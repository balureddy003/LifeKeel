# Category/urgency decision table — packages/engine/src/engine.ts loads this
# from <detectorsDir>/../category-table.yaml (detectorsDir = ./detectors, so
# this file lives at the repo root) and Detector.inferCategory() consults it
# before falling back to prefix/suffix heuristics (risk_/cost_/rev_ etc.).
#
# Without this file, every rule ID across every vertical fell through to
# those heuristics, which were written for a SaaS/SMB naming convention
# (foo_churn, foo_duplicate, foo_recovery) that none of the other verticals'
# rule IDs match — so every trading, property, family, and social insight
# silently defaulted to category: 'experience', which entity-model's
# riskTierFor() maps to riskTier: 'low'. In practice that meant a "severe
# price drop... likely indicates a fundamental issue" and a routine dividend
# opportunity rendered with the identical "Low risk" badge and identical
# green value styling — no visual distinction between genuine risk and
# genuine opportunity, on every card, in every vertical. See
# packages/entity-model/src/insight.ts's riskTierFor() and
# apps/lifekeel/src/components/entity/PotentialGapCard.tsx's RISK_COLOR/
# RISK_LABEL maps for how category flows into what the user actually sees.
#
# Both pattern fields are glob-style ('*' = wildcard). Matched against the
# distinctive rule_id alone (signal_type_pattern: '*') since rule IDs are
# unique across the whole detector set — simpler and safer than also
# threading each detector's signal_types through here.

# ── trading ──────────────────────────────────────────────────────────────────
# position_over_threshold and price_drop_below_avg are pre-split legacy rule
# IDs (concentration-risk.yaml and price-drop-alert.yaml now split these into
# _with_loss/_profitable and severe_/moderate_ variants) — kept here so
# existing insight documents still tagged with the old ID classify correctly;
# the current YAMLs no longer emit these IDs for newly-fired insights.
- signal_type_pattern: '*'
  rule_id_pattern: position_over_threshold
  category: risk
- signal_type_pattern: '*'
  rule_id_pattern: price_drop_below_avg
  category: risk
- signal_type_pattern: '*'
  rule_id_pattern: position_over_threshold_with_loss
  category: risk
- signal_type_pattern: '*'
  rule_id_pattern: position_over_threshold_profitable
  category: risk
- signal_type_pattern: '*'
  rule_id_pattern: severe_price_drop
  category: risk
- signal_type_pattern: '*'
  rule_id_pattern: moderate_price_drop
  category: risk
- signal_type_pattern: '*'
  rule_id_pattern: trailing_stop_breached
  category: risk
- signal_type_pattern: '*'
  rule_id_pattern: attractive_dividend_yield
  category: revenue
- signal_type_pattern: '*'
  rule_id_pattern: momentum_above_add_threshold
  category: revenue
- signal_type_pattern: '*'
  rule_id_pattern: excess_cash
  category: revenue

