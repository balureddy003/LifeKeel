# AI system impact assessments (ISO/IEC 42001 6.1.4, 8.4, A.5.2–A.5.5)
#
# One entry per task_id in definitions/ai-tasks.yaml, using the record template in
# ISO_AUDITABLE.md §23.4 and the flow in §14.1 (assessment_level: full | standard |
# lightweight). Registry fields (registry_purpose, processors, data_boundary,
# retention_class, registry_authority, registry_risk) are copied from
# definitions/ai-tasks.yaml and definitions/ai-processors.yaml; risks are the
# docs/ims/risk/risk-register.yaml entries that name the task.
# apps/api/src/__tests__/ims-documents.test.ts fails if a task has no entry.
#
# Every decision below is a PROPOSAL. No assessment is signed: sign_off stays
# "—" until the AI governance lead and privacy lead record it.
# Processors listed as `unreviewed` (anthropic, openai) are refused outside dev.

document:
  id: LK-IMS-050
  title: AI system impact assessments
  version: '0.1'
  status: DRAFT — awaiting approval
  owner: AI governance lead (role)
  approver: CEO / top management (role)
  approved: —
  next_review: —
assessments:
  - task_id: assistant.answer.v1
    system: Ask Keel — interactive assistant
    version: v1
    owner: Model owner — TBD (AI governance lead to propose, CEO to appoint)
    assessment_level: full
    intended_use: Explain a household's own records and estimated gaps in plain language
    registry_purpose: Ask Keel — answer a question from the family's own records
    prohibited_or_foreseeable_misuse: >-
      Recommending products or providers, switching, investment transactions, payment initiation, medical or
      legal advice (CLAUDE.md rule 2); acting on the answer without the family
    affected_people: >-
      Organizer and adult members; other adults and children named in household records appear in context; not
      used by minors (youth use assistant.youth_answer.v1)
    children: 'N'
    special_category: 'N'
    data_in: >-
      Question plus task-minimised profile context; health terms stripped before the call
      (apps/api/src/privacy/special-category.ts); no vault plaintext
    data_out: Answer text shown to the user
    processors:
      - ollama (self_hosted — GCP service decommissioned 2026-10-24)
      - anthropic (unreviewed — refused outside dev)
      - openai (unreviewed — refused outside dev)
      - azure (approved)
      - vertex (approved)
      - groq (approved)
      - xai (approved — pre-launch testing exception only, G-SUP-02)
    data_boundary: approved_hosted_provider
    retention_class: limited_abuse_log
    autonomy_trust_tier: Tier 0 — informational
    registry_authority: language_only
    registry_risk: user_visible
    human_oversight_point: User reads the answer; deterministic figures come from records, not the model; no action is taken
    risks:
      - R-SEC-03 (12)
      - R-AI-01 (15)
      - R-AI-04 (9)
      - R-AI-07 (9)
      - R-AI-08 (12)
    fairness_accessibility: Plain-language copy; quality across household shapes, languages and literacy levels not yet measured
    transparency_to_users: Processor disclosure page exists; in-product Art. 50 AI disclosure open (G-AI-02)
    evaluations_and_thresholds: Advice-rule test over copy; red-team guard fixtures. No task eval suite or thresholds yet (G-AI-01)
    eval_runs_id: —
    residual_risk: Medium — pending task eval suite and counsel sampling of real outputs (ISO_AUDITABLE.md §14.3)
    decision: 'Proposed: release behind the gateway; re-assess when the eval suite lands (§14.3). Not approved.'
    reassessment_trigger: >-
      New model or processor, data class, audience or autonomy level; a change to this task in
      definitions/ai-tasks.yaml; an AI incident
    sign_off:
      ai_governance_lead: —
      privacy_lead: —
      date: —
