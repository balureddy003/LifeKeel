# LifeKeel IMS — risk register and treatment plan
#
# Method: docs/ims/risk/methodology.md (ISO_AUDITABLE.md §13). Score =
# likelihood × impact; level Low 1–4, Medium 5–9, High 10–16, Critical 20–25.
# R-SEC-01 … R-SUP-01 are the 20 seed risks of ISO_AUDITABLE.md §13.3 with
# their scores unchanged; the rest extend the register to every asset class
# (ISO_AUDITABLE.md §8.2) and every AI system (definitions/ai-tasks.yaml and
# ai-bom.yaml). Scores are the Lead Implementer's proposal from repository
# evidence and must be re-assessed by each risk owner.
#
# acceptance is `pending` for every risk: no owner has accepted a residual
# risk yet, and nobody may record an acceptance on an owner's behalf.
#
# control_evidence lists repository paths of the existing controls; the IMS
# test checks they exist. annex_a = ISO/IEC 27001:2022 Annex A;
# aims_controls = ISO/IEC 42001:2023 Annex A.

document:
  id: LK-IMS-031
  title: Risk register and treatment plan
  version: '0.1'
  status: DRAFT — awaiting approval
  owner: IMS manager (role)
  approver: CEO / top management (role)
  approved: —
  next_review: —

