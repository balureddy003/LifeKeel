# LifeKeel IMS — consolidated gap register (tracker for ISO_AUDITABLE.md §15)
#
# One entry per G-ID in ISO_AUDITABLE.md §15 (S1–S4). IDs are stable: cite
# them in PRs ("Closes G-SEC-03"). apps/api/src/__tests__/ims-gap-register.test.ts
# fails CI if a §15 G-ID is missing here, if an id repeats, if a severity or
# status value is invalid, if severity disagrees with the §15 subsection, or if
# a listed evidence path does not exist (and a `closed` entry must list one).
#
# Status values:
#   open         — no work started, or only pre-existing context in the repo
#   in_progress  — work under way (a draft exists or a PR is open); NOT approved
#   verify       — believed done in the repo; needs an independent check
#                  (internal auditor) before it can be closed
#   closed       — done, with repository evidence listed and verified
# A management-system gap (policy, scope, roles, SoA, risk acceptance) cannot
# be `closed` by a draft: it needs the approver's recorded approval, which no
# file in this repository yet contains.
#
# phase: the ISO_AUDITABLE.md §16 roadmap phase (0 Mobilise, 1 Foundations,
# 2 Close S1/S2 controls, 3 Operate and evidence, 4 Certify, 5 Maintain/extend).
#
# evidence: repository paths that exist today and relate to the gap (for an
# open gap these are context, not proof of closure), or "—" when there is none.

document:
  id: LK-IMS-002
  title: Consolidated gap register
  version: '0.1'
  status: DRAFT — awaiting approval
  owner: IMS manager (role)
