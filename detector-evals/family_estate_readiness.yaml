# Golden eval cases for detectors/family/estate-readiness.yaml.
# event_type mirrors what family-financial-profile.ts emits: 'family.estate',
# with has_will / has_power_of_attorney as 0 or 1 from vault doc_type tags.
cases:
  - id: no-estate-docs
    description: Neither a will nor a power of attorney is on file — both rules fire
    event_type: family.estate
    data:
      has_will: 0
      has_power_of_attorney: 0
    expected_insights:
      - rule_id: estate_no_will
        min_or_score: 0.7
      - rule_id: estate_no_power_of_attorney
        min_or_score: 0.7

  - id: will-only
    description: Will on file but no power of attorney — only the PoA rule fires
    event_type: family.estate
    data:
      has_will: 1
      has_power_of_attorney: 0
    expected_insights:
      - rule_id: estate_no_power_of_attorney
        min_or_score: 0.7

  - id: poa-only
    description: Power of attorney on file but no will — only the will rule fires
    event_type: family.estate
    data:
      has_will: 0
      has_power_of_attorney: 1
    expected_insights:
      - rule_id: estate_no_will
        min_or_score: 0.7

  - id: complete-estate
    description: Both documents on file — nothing fires
    event_type: family.estate
    data:
      has_will: 1
      has_power_of_attorney: 1
    expected_insights: []
