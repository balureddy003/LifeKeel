cases:
  - id: high-dividend-yield
    description: VUKG at 3.5% yield should trigger dividend opportunity
    event_type: portfolio_position
    data:
      ticker: VUKG
      quantity: 100
      avg_price: 4000
      current_price: 4000
      position_value_minor: 400000
      dividend_yield_pct: 3.5
      days_to_ex_dividend: 5
    expected_insights:
      - rule_id: attractive_dividend_yield
        min_or_score: 0.7

  - id: yield-exactly-at-2-pct
    description: Yield at exactly 2.0% should not trigger (rule is strict >)
    event_type: portfolio_position
    data:
      ticker: VUKG
      quantity: 100
      avg_price: 4000
      current_price: 4000
      position_value_minor: 400000
      dividend_yield_pct: 2.0
    expected_silent: true

  - id: low-dividend-yield
    description: Yield at 1.5% should stay silent
    event_type: portfolio_position
    data:
      ticker: AAPL
      quantity: 100
      avg_price: 10000
      current_price: 10000
      position_value_minor: 1000000
      dividend_yield_pct: 1.5
    expected_silent: true

  - id: missing-yield
    description: Position without dividend yield should stay silent
    event_type: portfolio_position
    data:
      ticker: TSLA
      quantity: 100
      avg_price: 15000
      current_price: 15000
      position_value_minor: 1500000
    expected_silent: true

  - id: just-above-2-pct-yield
    description: Yield at 2.1% with an upcoming ex-dividend date should trigger
    event_type: portfolio_position
    data:
      ticker: VYM
      quantity: 100
      avg_price: 4000
      current_price: 4000
      position_value_minor: 400000
      dividend_yield_pct: 2.1
      days_to_ex_dividend: 5
    expected_insights:
      - rule_id: attractive_dividend_yield
        min_or_score: 0.7

  - id: zero-yield
    description: Yield at 0% should stay silent
    event_type: portfolio_position
    data:
      ticker: BRK
      quantity: 100
      avg_price: 20000
      current_price: 20000
      position_value_minor: 2000000
      dividend_yield_pct: 0
      days_to_ex_dividend: 5
    expected_silent: true

  - id: high-yield-but-distant-ex-dividend
    description: High yield with ex-dividend more than 7 days away should stay silent
    event_type: portfolio_position
    data:
      ticker: VYM
      quantity: 100
      avg_price: 4000
      current_price: 4000
      position_value_minor: 400000
      dividend_yield_pct: 3.5
      days_to_ex_dividend: 14
    expected_silent: true

  - id: high-yield-recently-ex-dividend
    description: High yield announced within the last 30 days should trigger
    event_type: portfolio_position
    data:
      ticker: SCHD
      quantity: 100
      avg_price: 4000
      current_price: 4000
      position_value_minor: 400000
      dividend_yield_pct: 3.5
      days_since_ex_dividend: 10
    expected_insights:
      - rule_id: attractive_dividend_yield
        min_or_score: 0.7

  - id: high-yield-long-past-ex-dividend
    description: High yield with ex-dividend long past should stay silent
    event_type: portfolio_position
    data:
      ticker: HDV
      quantity: 100
      avg_price: 4000
      current_price: 4000
      position_value_minor: 400000
      dividend_yield_pct: 3.5
      days_since_ex_dividend: 45
    expected_silent: true
