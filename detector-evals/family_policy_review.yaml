# Golden eval cases for detectors/family/policy-review.yaml.
# event_type mirrors what family-financial-profile.ts emits:
# 'family.policy_review' — one event per (type, holder) overlap group, plus
# one summary event for orphaned attribution.
cases:
  - id: duplicate-life-cover
    description: Two life policies on the same member — possible leftover from a switch
    event_type: family.policy_review
    data:
      overlap_count: 2
      overlap_type: life
      overlap_holder: Priya
      overlap_providers: Aviva + Legal & General
      overlap_monthly_premium_minor: 6500
      orphaned_policy_count: 0
      member_id: 'm_priya:life'
    expected_insights:
      - rule_id: duplicate_policy_coverage
        min_or_score: 0.6

  - id: orphaned-beneficiary
    description: A policy still points at a member no longer on the roster
    event_type: family.policy_review
    data:
      overlap_count: 0
      orphaned_policy_count: 1
      orphaned_policy_descriptions: life policy with Aviva
    expected_insights:
      - rule_id: policy_attributed_to_removed_member
        min_or_score: 0.65

  - id: stale-renewal
    description: A renewal date on file is already in the past — record may be stale or cover lapsed
    event_type: family.policy_review
    data:
      overlap_count: 0
      orphaned_policy_count: 0
      stale_renewal_count: 2
      stale_renewal_descriptions: 'car policy with Acme held by the household, renewal date 34 days in the past'
      stale_renewal_monthly_premium_minor: 6700
    expected_insights:
      - rule_id: policy_renewal_date_in_past
        min_or_score: 0.75

  - id: clean-register
    description: Single policy per (type, holder), all attributions current
    event_type: family.policy_review
    data:
      overlap_count: 1
      orphaned_policy_count: 0
      stale_renewal_count: 0
    expected_insights: []

  - id: premium-creep
    description: A recorded premium went up >5% vs the previous entry — informational price-creep flag
    event_type: family.policy_review
    data:
      overlap_count: 0
      orphaned_policy_count: 0
      stale_renewal_count: 0
      premium_increase_count: 1
      premium_increase_descriptions: 'car policy with Acme held by the household: premium went from £40.00 to £52.00/month (30% higher)'
      premium_increase_annual_delta_minor: 14400
    expected_insights:
      - rule_id: premium_increased
        min_or_score: 0.7

  - id: premium-unchanged
    description: No premium increases on file — the rule stays quiet
    event_type: family.policy_review
    data:
      overlap_count: 0
      orphaned_policy_count: 0
      stale_renewal_count: 0
      premium_increase_count: 0
    expected_insights: []

  - id: premium-possibly-stopped
    description: No payment on file for 62 days — the household should check the policy is in force
    event_type: family.policy_review
    data:
      overlap_count: 0
      orphaned_policy_count: 0
      stale_renewal_count: 0
      premium_increase_count: 0
      stale_payment_count: 1
      stale_payment_since_date: '2026-08-14'
      stale_payment_descriptions: 'life policy with Acme held by Priya: last payment on file 2026-08-14 (62 days ago)'
      stale_payment_monthly_premium_minor: 4500
      no_nomination_count: 0
      new_child_after_nomination_count: 0
    expected_insights:
      - rule_id: premium_possibly_stopped
        min_or_score: 0.7

  - id: premium-payments-current
    description: Payment records are recent — the stopped-payment rule stays quiet
    event_type: family.policy_review
    data:
      overlap_count: 0
      orphaned_policy_count: 0
      stale_renewal_count: 0
      premium_increase_count: 0
      stale_payment_count: 0
      stale_payment_since_date: ''
      stale_payment_descriptions: ''
      stale_payment_monthly_premium_minor: 0
      no_nomination_count: 0
      new_child_after_nomination_count: 0
    expected_insights: []

  - id: nomination-none-on-file
    description: A life policy with no nomination recorded — flag fires
    event_type: family.policy_review
    data:
      overlap_count: 0
      orphaned_policy_count: 0
      stale_renewal_count: 0
      premium_increase_count: 0
      stale_payment_count: 0
      no_nomination_count: 1
      no_nomination_descriptions: 'life policy with Acme held by Priya'
      new_child_after_nomination_count: 0
    expected_insights:
      - rule_id: nomination_none_on_file
        min_or_score: 0.7

  - id: nomination-predates-child
    description: A child joined the family after the recorded nomination date
    event_type: family.policy_review
    data:
      overlap_count: 0
      orphaned_policy_count: 0
      stale_renewal_count: 0
      premium_increase_count: 0
      stale_payment_count: 0
      no_nomination_count: 0
      new_child_after_nomination_count: 1
      new_child_after_nomination_descriptions: 'life policy with Acme held by Priya: nomination dated 2023-05-01, 1 child on the family record joined after'
    expected_insights:
      - rule_id: nomination_predates_new_child
        min_or_score: 0.7

  - id: nomination-ex-partner
    description: The nomination names a person recorded as an ex-partner — member-scoped event
    event_type: family.policy_review
    data:
      member_id: 'm_priya'
      ex_partner_nomination_count: 1
      ex_partner_nomination_descriptions: 'life policy with Acme: the nomination on file dated 2021-03-02 names a person recorded as an ex-partner'
    expected_insights:
      - rule_id: nomination_names_ex_partner
        min_or_score: 0.7

  - id: nomination-current
    description: Nomination on file and current — all three flags stay quiet
    event_type: family.policy_review
    data:
      overlap_count: 0
      orphaned_policy_count: 0
      stale_renewal_count: 0
      premium_increase_count: 0
      stale_payment_count: 0
      no_nomination_count: 0
      new_child_after_nomination_count: 0
      ex_partner_nomination_count: 0
    expected_insights: []
