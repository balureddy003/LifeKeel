cases:
  - id: excess-cash-above-5-pct
    description: Cash at 10% of portfolio should trigger rebalance suggestion
    event_type: portfolio_summary
    goal_kpi_targets:
      cash_allocation_max_pct: 5
    data:
      cash: 1000000
      total_value: 10000000
      cash_pct: 10
      currency: GBP
    expected_insights:
      - rule_id: excess_cash
        min_or_score: 0.7

  - id: cash-below-5-pct
    description: Cash at 3% should stay silent
    event_type: portfolio_summary
    goal_kpi_targets:
      cash_allocation_max_pct: 5
    data:
      cash: 300000
      total_value: 10000000
      cash_pct: 3
      currency: GBP
    expected_silent: true

  - id: cash-exactly-at-5-pct
    description: Cash at exactly 5% should not trigger (rule is strict >)
    event_type: portfolio_summary
    goal_kpi_targets:
      cash_allocation_max_pct: 5
    data:
      cash: 500000
      total_value: 10000000
      cash_pct: 5
      currency: GBP
    expected_silent: true

  - id: custom-cash-cap-8-pct
    description: Goal with 8% cash cap should allow 7% without firing
    event_type: portfolio_summary
    goal_kpi_targets:
      cash_allocation_max_pct: 8
    data:
      cash: 700000
      total_value: 10000000
      cash_pct: 7
      currency: GBP
    expected_silent: true

  - id: just-above-5-pct-cash-cap
    description: Cash at 5.1% should trigger rebalance suggestion
    event_type: portfolio_summary
    goal_kpi_targets:
      cash_allocation_max_pct: 5
    data:
      cash: 510000
      total_value: 10000000
      cash_pct: 5.1
      currency: GBP
    expected_insights:
      - rule_id: excess_cash
        min_or_score: 0.7

  - id: missing-total-value
    description: Portfolio summary without total_value should stay silent
    event_type: portfolio_summary
    goal_kpi_targets:
      cash_allocation_max_pct: 5
    data:
      cash: 1000000
      cash_pct: 10
      currency: GBP
    expected_silent: true
