# Trading & Investment vertical — LifeKeel Wealth Rules Lab
#
# A vertical for retail investors using Trading 212. It composes the new
# trading-212 connector with user-authored risk rules, Decision Contracts, and
# a paper-first execution model. Live trading is gated behind a separate opt-in.

id: trading-investment
name: Trading & Investment
tagline: Invest with your own rules, evidence, and a safety-first paper mode
status: alpha
tier_minimum: individual
supported_countries: ['GB', 'IN']

theme:
  accent_token: accent-emerald
  tone: Calm, evidence-led, never hype — every proposed action needs proof
  entity_noun: position
  outcome_noun: portfolio gains protected

personas:
  - id: self-directed-investor
    name: Self-Directed Investor
    description: >
      Manages their own ISA or Invest portfolio and wants deterministic alerts
      when positions breach their personal risk rules, with a paper-trading
      sandbox to preview every action.
    jobs_to_be_done:
      - Spot concentration risk before it hurts the portfolio
      - Get alerted when a holding drops through a rule threshold
      - Preview every rebalance in paper mode first
    primary_goal_templates:
      - diversified-portfolio-yield

  - id: side-hustle-trader
    name: Side-Hustle Trader
    description: >
      Actively trades around a small number of positions and wants fast,
      auditable risk alerts without being sold generic AI analysis.
    jobs_to_be_done:
      - Catch price-drop breaches against rule-based stops
      - See dividend opportunities and ex-dividend dates
      - Compare proposed actions against goals before acting
    primary_goal_templates:
      - diversified-portfolio-yield

  - id: isa-maximiser
    name: ISA Maximiser
    description: >
      Focuses on tax-wrapper efficiency and long-term yield. Wants to keep
      positions diversified and reinvest dividends within the ISA allowance.
    jobs_to_be_done:
      - Track ISA allowance used and remaining
      - Receive dividend-reinvest suggestions
      - Avoid concentration in a single name inside the ISA wrapper
    primary_goal_templates:
      - diversified-portfolio-yield

  - id: elss-sip-investor
    name: ELSS SIP Investor
    description: >
      Indian investor using ELSS mutual funds via SIP for §80C tax savings.
      Wants to maximise the ₹1.5L annual deduction while monitoring fund
      performance and lock-in periods.
    jobs_to_be_done:
      - Track §80C limit utilised and remaining
      - Monitor ELSS fund NAV growth
      - Track lock-in period for each SIP instalment
    primary_goal_templates:
      - elss-tax-saving

required_connectors:
  - trading-212
  # Zerodha (Kite Connect) is required for Indian tenants. Listed as
  # optional here because the vertical supports both GB and IN — the
  # onboarding UI filters connectors by the tenant's country.
  - zerodha

optional_connectors:
  - alpha-vantage
  # Market-data connectors for price history backfill and fundamentals
  # enrichment. Users provide their own API keys (except yfinance, which
  # needs no key). All emit market_price / company_fundamentals signals
  # that feed the defensive and momentum trend-following engines.
  - yfinance       # No key, 20+ year history, fundamentals — best for backtesting
  - hf-data        # Free key, 1-min bars since 2002, CC BY 4.0 — research-grade
  - finnhub        # Free key, 60/min, 1 year history + fundamentals — real-time
  - polygon        # Free key, 5/min, 2 year history, 15min delayed — secondary

detectors:
  - trading_concentration_risk
  - trading_price_drop_alert
  - trading_dividend_opportunity
  - trading_rebalance_suggestion

outcome_packs:
  - portfolio-health
  # B1: goal-oriented packs — the first screen of onboarding asks
  # "What do you want to achieve?" and these are the five answers.
  - grow-wealth
  - protect-portfolio
  - find-opportunities
  - improve-trading
  - track-goals

goal_templates:
  - diversified-portfolio-yield
  - compound-growth-trading
  - realistic-compound-growth-trading
  # India-specific templates (INR-denominated, Zerodha connector)
  - elss-tax-saving
  - compound-growth-trading-inr

kpi_vocabulary:
  - Portfolio concentration
  - Dividend yield
  - Unrealised P&L

# Jurisdiction-specific terms — never shown mixed together. The API resolves
# the tenant's country from which connector they've connected (trading-212
# = GB, zerodha = IN) and appends only the matching list to kpi_vocabulary
# above; a tenant with neither connected yet sees only the universal list.
kpi_vocabulary_by_country:
  GB:
    - ISA allowance used
  IN:
    - ELSS invested (§80C)
    - SIP completion
    - Lock-in remaining
