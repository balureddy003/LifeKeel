# Property & Wealth — Vertical #1 (reference template)
#
# A vertical is pure composition + identity over the shared Kairos core.
# It references content by id; the ids resolve against the flat detectors/,
# connectors/, and definitions/ directories that the existing loaders read.
# See docs/prd/vertical-template-framework.md.

id: property-wealth
name: Property & Wealth
tagline: Find and act on property and wealth opportunities, with proof
status: alpha
tier_minimum: individual
supported_countries: ['GB']

theme:
  # Was accent-indigo, which is also the platform's DEFAULT_ACCENT
  # (vertical-accent.ts) — a property-wealth tenant was pixel-identical to a
  # tenant with no vertical set at all. sky is the only token not already
  # claimed (trading=emerald, smb-operations=amber, audience-growth=fuchsia).
  accent_token: accent-sky
  tone: Confident, numbers-first, plain-English — no hype, always cite the evidence
  entity_noun: asset
  outcome_noun: portfolio value protected

personas:
  - id: investor
    name: Property Investor
    description: >
      Runs a buy-to-let / HMO portfolio and wants to grow net yield without
      babysitting spreadsheets. Cares about cash flow, voids, and refinance timing.
    jobs_to_be_done:
      - Spot underperforming properties before they drag the portfolio
      - Catch refinance and remortgage windows the moment rates move
      - Know which actions actually moved yield, with evidence
    primary_goal_templates:
      - buy-to-let-yield

  - id: buyer
    name: Real Estate Buyer
    description: >
      Actively hunting for a property to buy and wants to be first to a genuine
      price drop or below-market listing in target areas.
    jobs_to_be_done:
      - Be alerted to real price drops in target areas, not noise
      - Understand whether a listing is actually below area benchmark
    primary_goal_templates:
      - buy-to-let-yield

  - id: home-owner
    name: Home Owner
    description: >
      Owns their home and wants to protect and grow its value — remortgage
      timing, energy-efficiency ROI, and market-value tracking.
    jobs_to_be_done:
      - Track home value against the local market
      - Catch the right moment to remortgage
    primary_goal_templates: []

required_connectors:
  - rightmove
  - zoopla
optional_connectors:
  - land-registry
  - open-banking

detectors:
  - property_yield_gap
  - property_price_drop
  - property_refinance_window

outcome_packs:
  - property-yield

goal_templates:
  - buy-to-let-yield

kpi_vocabulary:
  - Net rental yield
  - Void rate
  - Portfolio value
  - Loan-to-value
  - Refinance headroom
