# Branding & Marketing — Vertical #5
#
# A vertical for any user or business that wants marketing to run itself —
# lead nurture, cart recovery, upsell, win-back, reviews, and daily social
# presence, with human approval where it matters. It composes the marketing
# workflows, ecommerce + social detectors, and the revenue / customer-
# experience / audience-growth outcome packs that already ship in the flat
# definitions/ and detectors/ directories. See
# docs/prd/vertical-template-framework.md.
#
# Dogfooding: Kairos itself is the first tenant of this vertical. The
# `marketing_kairos_social_presence` and `marketing_kairos_x_daily_capability`
# workflows are Kairos's own daily marketing automation — listed under
# `workflows:` below because they aren't bundled by any outcome pack, they're
# the vertical's own daily-content engine. Eating our own dog food is the
# proof the vertical works for any business, not just a demo.
#
# Relationship to `audience-growth`: that vertical is creator/brand-marketer
# focused on social following + reputation. This vertical is broader
# marketing operations — the full lead→nurture→convert→retain→win-back
# loop plus daily social presence. They share the social detectors and the
# audience-growth outcome pack by design; the difference is scope and the
# dogfooding-first posture.
#
# Known content gap (pre-existing, tracked not fixed here): the marketing
# workflows reference connectors (gmail, hubspot, mailchimp, zendesk, slack,
# twitter_x, linkedin, ghost) that previously had no manifest in connectors/.
# They now ship as `status: planned` manifests — contract fixed, live
# ingestion not wired — matching trading-investment's connector posture
# (rightmove/zoopla/trading-212 are all `planned` too). The vertical lists
# them under optional_connectors so the full connector surface is honest;
# wiring live OAuth/API ingestion for each is tracked separately.

id: branding-marketing
name: Branding & Marketing
tagline: Run marketing on autopilot — acquire, nurture, retain, and prove it worked
status: alpha
tier_minimum: individual
supported_countries: []  # global

theme:
  # violet is the only Tailwind palette token not already claimed by a
  # shipped vertical (trading=emerald, smb-operations=amber,
  # audience-growth=fuchsia, property-wealth=sky, default=indigo). Added
  # to AccentToken in apps/studio/src/lib/vertical-accent.ts alongside
  # this manifest so the 6th vertical gets a distinct visual identity
  # instead of falling back to indigo (the no-vertical default).
  accent_token: accent-violet
  tone: Bold, creative, evidence-led — ship daily, measure what worked, never vanity metrics
  entity_noun: campaign
  outcome_noun: campaign value captured

personas:
  - id: growth-marketer
    name: Growth Marketer
    description: >
      Runs marketing for a small business or team and wants the full
      acquisition-to-retention loop to run itself — lead qualify + nurture,
      cart recovery, upsell, win-back, and review requests — with a human
      approval gate on outbound. Kairos's own marketing team is the first
      tenant of this persona (dogfooding).
    jobs_to_be_done:
      - Qualify and nurture new leads without manual CRM work
      - Recover abandoned carts and win back churned customers on autopilot
      - Keep daily social presence across LinkedIn and X without spending hours
      - Tie marketing effort to revenue, not just reach
    primary_goal_templates:
      - reputation-reviews
      - trial-conversion

  - id: founder-operator
    name: Founder-Operator
    description: >
      Solo founder or owner-operator who markets their own business and wants
      consistent social presence, review requests, and follow-up to run in the
      background so they can focus on the product.
    jobs_to_be_done:
      - Post consistently across platforms without guessing what to write
      - Ask happy customers for reviews at the right moment
      - Know which marketing actions actually moved revenue
    primary_goal_templates:
      - social-x-growth
      - reputation-reviews

required_connectors:
  - postiz
optional_connectors:
  - shopify
  - postiz-library
  # Marketing-infrastructure connectors used by the bundled workflows. All are
  # `status: planned` manifests (contract fixed, live ingestion not wired) —
  # same posture as trading-investment's planned connectors. Declared here so
  # the vertical is honest about the full connector surface its workflows
  # touch, even though only `postiz` is required for the daily-content engine.
  - gmail
  - hubspot
  - mailchimp
  - zendesk
  - slack
  - twitter_x
  - linkedin
  - ghost

detectors:
  - cart_abandonment_recovery
  - churn_risk_detection
  - social_engagement_drop
  - social_post_performance_spike
  - social_viral_spike
  - social_goal_progress

outcome_packs:
  - revenue-optimisation
  - customer-experience
  - audience-growth

goal_templates:
  - social-x-growth
  - reputation-reviews
  - trial-conversion

# Workflows bundled by the outcome packs above are inherited automatically;
# these are the vertical's own daily-content engine — Kairos dogfoods them
# as its first tenant. Not referentially checked (checkVerticalReferences
# covers detectors/packs/connectors/goal-templates), but all ids resolve
# against definitions/workflows/.
workflows:
  - marketing_kairos_social_presence
  - marketing_kairos_x_daily_capability

kpi_vocabulary:
  - Lead conversion rate
  - Cart recovery rate
  - Revenue recovered
  - Engagement rate
  - Follower growth rate
  - Average review score
  - Content ROI
