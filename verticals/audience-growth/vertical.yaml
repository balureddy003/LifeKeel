# Audience & Brand Growth — Vertical #4
#
# Same core, pointed at social/reputation growth instead of trading, property,
# or SMB cash ops. Almost all of this vertical's content already shipped as
# orphaned pieces in the flat directories (marketing workflows, social
# detectors, the `audience-growth` outcome pack) — this manifest is what binds
# them into a vertical, per docs/prd/vertical-template-framework.md.
#
# Two personas span the individual/business split the same way Trading &
# Investment's personas are all-individual and SMB Operations' are all-business:
# `creator` is an individual building a personal brand; `brand-marketer` is a
# business/team running marketing operations. Same product, same brand, no
# separate SKU — tier_minimum: individual keeps the creator path available on
# Free/Pro; team-scale features (multi-seat approval, more connectors) are
# gated at the plan level, not the vertical level.
#
# Known content gap (tracked, not fixed here — mirrors the pre-existing
# cash-recovery bug called out in the framework PRD): the `reputation-reviews`
# goal template and its `negative_review_responder` workflow reference a
# `google_reviews` connector and a `review_sentiment_detector` that don't exist
# yet. The brand-marketer persona's review journey is a real dead end until a
# reviews connector + detector ship — surfaced deliberately rather than hidden.

id: audience-growth
name: Audience & Brand Growth
tagline: Grow your following and reputation on autopilot, with proof it worked
status: alpha
tier_minimum: individual
supported_countries: []  # global

theme:
  accent_token: accent-fuchsia
  tone: Energetic, consistency-first, evidence-led — reward showing up daily, never vanity metrics
  entity_noun: channel
  outcome_noun: growth value captured

personas:
  - id: creator
    name: Individual Creator
    description: >
      Builds a personal brand or following on their own — a founder, consultant,
      or solo creator posting consistently who wants to know within a day
      whether a post is working, not just chase vanity metrics.
    jobs_to_be_done:
      - Post consistently without spending hours guessing what to write
      - Know quickly whether a post is over- or under-performing
      - See real follower and engagement growth against a stated goal
    primary_goal_templates:
      - social-x-growth

  - id: brand-marketer
    name: Brand & Marketing Lead
    description: >
      Runs marketing for a small business or team and wants multi-platform
      content, review response, and social ROI tracking to run itself, with
      human approval where it matters.
    jobs_to_be_done:
      - Keep LinkedIn, X, Instagram, Facebook and YouTube posting on a cadence
      - Respond to negative reviews quickly without sounding robotic
      - Tie social effort to measurable ROI, not just reach
    primary_goal_templates:
      - reputation-reviews

required_connectors:
  - postiz
optional_connectors:
  - postiz-library

detectors:
  - social_engagement_drop
  - social_post_performance_spike
  - social_goal_progress

outcome_packs:
  - audience-growth

goal_templates:
  - social-x-growth
  - reputation-reviews

kpi_vocabulary:
  - Follower growth rate
  - Engagement rate
  - Content ROI
  - Average review score
