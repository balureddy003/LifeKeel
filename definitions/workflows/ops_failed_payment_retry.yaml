id: ops_failed_payment_retry
name: Failed Payment → Smart Retry → Escalation
description: |
  When a Stripe payment fails: classify the failure reason, try a smart retry if
  recoverable, send a personalised recovery email to the customer, and if still
  failing after 3 attempts — alert the finance team and log to Xero.
version: 1.0.0
template:
  category: finance
  required_connectors: [slack, xero]
  estimated_roi: "£2,000–£20,000/month from recovered failed payments"
  setup_minutes: 15
  featured: true
enabled: true
trigger:
  event_type: payment.failed

state:
  failure_reason: ""
  recovery_email: ""
  retry_count: 0
  is_recoverable: false

nodes:
  - id: trigger
    type: trigger
    label: Payment failed
    config: {}

  - id: classify_failure
    type: skill
    label: Classify failure reason
    config:
      skill: classify
      text: "Stripe decline code: {{event.decline_code}} | Error: {{event.error_message}} | Amount: {{event.amount_pence}}p | Customer: {{event.customer_email}}"
      labels: [insufficient_funds, card_expired, card_lost_stolen, bank_blocked, network_error, fraud_suspected, other]
      output_key: failure_classification

  - id: decide_retry
    type: skill
    label: Decide if retry is safe
    config:
      skill: decide
      question: "Should we retry this payment automatically?"
      context: "Failure reason: {{state.failure_classification.labels[0]}}. Amount: {{event.amount_pence}}p. Customer history: {{event.customer_lifetime_value_pence}}p LTV. Previous failed attempts: {{event.previous_failures}}."
      options: [retry_now, retry_in_24h, contact_customer_first, escalate_to_team]
      output_key: retry_decision

  - id: draft_recovery_email
    type: skill
    label: Draft recovery email
    config:
      skill: generate
      persona: "a helpful billing support agent who is empathetic and solution-focused"
      tone: "friendly, non-accusatory, action-oriented"
      max_words: 100
      prompt: "Write a short payment recovery email to {{event.customer_name}} whose payment of £{{event.amount_display}} failed due to {{state.failure_classification.labels[0]}}. Make it easy for them to update their card or retry. Don't sound threatening."
      output_key: recovery_email
      fallback: "Hi {{event.customer_name}}, your recent payment of £{{event.amount_display}} was unsuccessful. Please update your payment details to avoid service interruption."

  - id: send_recovery_email
    type: connector_action
    label: Send recovery email
    config:
      connector: sendgrid
      action: send_email
      params:
        to: "{{event.customer_email}}"
        from: "billing@{{tenant.domain}}"
        subject: "Action needed: payment of £{{event.amount_display}} failed"
        html_content: "{{state.recovery_email}}"

  - id: check_should_escalate
    type: condition
    label: Escalate to team?
    config:
      expression: "retry_decision.decision == 'escalate_to_team' OR event.previous_failures >= 3"
      true_node: alert_finance_team
      false_node: END

  - id: alert_finance_team
    type: connector_action
    label: Alert finance team on Slack
    config:
      connector: slack
      action: send_message
      params:
        channel: "#finance-alerts"
        text: "💳 *Failed payment requires action*\n*Customer:* {{event.customer_name}} ({{event.customer_email}})\n*Amount:* £{{event.amount_display}}\n*Reason:* {{state.failure_classification.labels[0]}}\n*Attempts:* {{event.previous_failures}}\n*AI decision:* {{state.retry_decision.decision}}\n*Reasoning:* {{state.retry_decision.reasoning}}"

  - id: log_to_xero
    type: connector_action
    label: Log in Xero
    config:
      connector: xero
      action: get_contacts
      params: {}

edges:
  - from: trigger
    to: [classify_failure, draft_recovery_email]
  - from: classify_failure
    to: decide_retry
  - from: decide_retry
    to: send_recovery_email
  - from: draft_recovery_email
    to: send_recovery_email
  - from: send_recovery_email
    to: check_should_escalate
  - from: check_should_escalate
    to: alert_finance_team
    condition: "retry_decision.decision == 'escalate_to_team'"
    label: Escalate
  - from: alert_finance_team
    to: log_to_xero

settings:
  trust_level: 0
  timeout_minutes: 15
  max_retries: 3
  on_error: notify
