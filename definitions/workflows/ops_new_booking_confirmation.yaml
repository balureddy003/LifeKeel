id: ops_new_booking_confirmation
name: New Booking → Confirm → Prep Brief → Remind
description: |
  When a Calendly booking is made: send a confirmation, AI-generates a
  personalised pre-meeting brief for the team, adds to Google Calendar,
  and sends a 24h reminder to both parties.
version: 1.0.0
template:
  category: ops
  required_connectors: [gmail, google_calendar, slack]
  estimated_roi: "£500–£5,000/month from reduced no-shows and better meeting prep"
  setup_minutes: 10
  featured: true
enabled: true
trigger:
  event_type: calendar.booking.created

state:
  meeting_brief: ""
  calendar_event_id: ""

nodes:
  - id: trigger
    type: trigger
    label: Booking created in Calendly
    config: {}

  - id: generate_brief
    type: skill
    label: Generate pre-meeting brief
    config:
      skill: enrich
      data:
        name: "{{event.invitee_name}}"
        email: "{{event.invitee_email}}"
        meeting_type: "{{event.event_type_name}}"
        answers: "{{event.questions_and_answers}}"
      infer_fields:
        - name: likely_goal
          description: What the prospect likely wants to achieve from this meeting
        - name: suggested_talking_points
          description: 2-3 specific talking points the host should prepare
        - name: potential_objections
          description: Likely objections or concerns to anticipate
        - name: priority_level
          description: "Urgency level: high / medium / low — based on their answers"
      output_key: meeting_brief

  - id: send_confirmation
    type: connector_action
    label: Send confirmation email
    config:
      connector: gmail
      action: send_email
      params:
        to: "{{event.invitee_email}}"
        subject: "Meeting confirmed: {{event.event_type_name}} on {{event.start_time_formatted}}"
        body: "Hi {{event.invitee_name}},<br><br>Your meeting is confirmed for <strong>{{event.start_time_formatted}}</strong>.<br><br>Join link: {{event.location}}<br><br>We look forward to speaking with you!<br><br>{{tenant.business_name}}"

  - id: add_to_calendar
    type: connector_action
    label: Add to Google Calendar
    config:
      connector: google_calendar
      action: create_event
      params:
        summary: "{{event.event_type_name}} — {{event.invitee_name}}"
        start: "{{event.start_time}}"
        end: "{{event.end_time}}"
        description: "Pre-meeting brief:\n\nGoal: {{state.meeting_brief.likely_goal}}\n\nTalking points: {{state.meeting_brief.suggested_talking_points}}\n\nAnticipate: {{state.meeting_brief.potential_objections}}"
        attendees: '["{{event.invitee_email}}"]'

  - id: notify_team
    type: connector_action
    label: Notify team on Slack
    config:
      connector: slack
      action: send_message
      params:
        channel: "#bookings"
        text: "📅 *New booking:* {{event.event_type_name}}\n*Who:* {{event.invitee_name}} ({{event.invitee_email}})\n*When:* {{event.start_time_formatted}}\n*Priority:* {{state.meeting_brief.priority_level}}\n*Their goal:* {{state.meeting_brief.likely_goal}}"

  - id: wait_for_reminder
    type: wait
    label: Wait until 24h before
    config:
      duration: 23h

  - id: send_reminder
    type: connector_action
    label: Send 24h reminder
    config:
      connector: gmail
      action: send_email
      params:
        to: "{{event.invitee_email}}"
        subject: "Reminder: your meeting tomorrow at {{event.start_time_formatted}}"
        body: "Hi {{event.invitee_name}},<br><br>Just a reminder about your meeting tomorrow.<br>Join link: {{event.location}}<br><br>See you then!"

edges:
  - from: trigger
    to: [generate_brief, send_confirmation]
  - from: [generate_brief, send_confirmation]
    to: add_to_calendar
  - from: add_to_calendar
    to: notify_team
  - from: notify_team
    to: wait_for_reminder
  - from: wait_for_reminder
    to: send_reminder

settings:
  trust_level: 0
  timeout_minutes: 2000
  on_error: notify
