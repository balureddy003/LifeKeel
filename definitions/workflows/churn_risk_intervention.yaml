workflow:
  id: churn_risk_intervention
  name: "Churn Risk → Personalised Offer → Multi-channel"
  description: >
    When a high-value customer shows churn signals, alert the team on Slack,
    generate a personalised retention offer, and log to CRM — all automatically.
  version: "1.0.0"
  enabled: true

  trigger:
    detector: saas_churn_risk
    condition: "churn_probability > 0.7 AND monthly_value > 500"

  state:
    customer_id: ""
    customer_name: ""
    customer_email: ""
    monthly_value: ""
    churn_signals: ""
    retention_offer: ""
    account_manager: ""

  nodes:
    - id: alert_team
      type: notify
      label: "Alert sales team immediately"
      config:
        channel: slack
        destination: "#sales-alerts"
        template: |
          🚨 *High-value churn risk detected*
          Customer: {{state.customer_name}} ({{state.monthly_value}}/mo)
          Signals: {{state.churn_signals}}
          Account manager: {{state.account_manager}}

    - id: generate_offer
      type: ai_generate
      label: "Generate personalised retention offer"
      config:
        model: claude-haiku-4-5
        system: |
          You are a customer success specialist focused on retention.
          Create personalised, high-value offers for at-risk customers.
          Be specific, concrete, and reference their actual usage patterns.
        prompt: |
          Generate a personalised retention offer for {{state.customer_name}},
          a customer worth {{state.monthly_value}}/month who is showing these
          churn signals: {{state.churn_signals}}.

          Suggest one specific, high-value offer (discount, feature unlock,
          dedicated support, etc.) with a clear call to action.
        output_key: retention_offer
        fallback: "Schedule a call to understand their needs and offer a 20% loyalty discount."

    - id: approve_offer
      type: human_approval
      label: "Account manager approves offer"
      config:
        title: "Retention offer needs approval before outreach"
        urgency: high
        timeout: 2h
        # New tenants: auto_dismiss. Upgrade to auto_approve via trust_level setting after 5 manual approvals.
        timeout_action: auto_dismiss
        display:
          - label: "Customer"
            value: "{{state.customer_name}} — {{state.monthly_value}}/mo"
          - label: "Churn signals"
            value: "{{state.churn_signals}}"
          - label: "Suggested offer"
            value: "{{state.retention_offer}}"
        actions:
          - id: approve
            label: "Send offer"
            style: primary
          - id: edit_approve
            label: "Customise & send"
            style: secondary
            allow_edit: true
            edit_field: retention_offer
          - id: reject
            label: "Handle manually"
            style: danger

    - id: send_offer_email
      type: notify
      label: "Send retention email to customer"
      config:
        channel: email
        destination: "{{state.customer_email}}"
        subject: "We'd love to keep you — special offer inside"
        template: |
          Hi {{state.customer_name}},

          We noticed you might not be getting the full value from your subscription,
          and we'd love to change that.

          {{state.retention_offer}}

          Would you have 15 minutes for a quick call?

          Warm regards,
          {{state.account_manager}}

    - id: log_to_crm
      type: http
      label: "Log intervention in CRM"
      config:
        method: POST
        url: "http://localhost:3001/connectors/hubspot/deals/{{state.customer_id}}/notes"
        body:
          note: "Churn intervention triggered. Offer sent: {{state.retention_offer}}"
          type: CHURN_INTERVENTION

  edges:
    - from: alert_team
      to: generate_offer

    - from: generate_offer
      to: approve_offer

    - from: approve_offer
      to: send_offer_email
      condition: "__outcome == 'approve' || __outcome == 'edit_approve'"
      label: "Approved"

    - from: approve_offer
      to: log_to_crm
      condition: "__outcome == 'reject'"
      label: "Manual"

    - from: send_offer_email
      to: log_to_crm

    - from: log_to_crm
      to: END

  settings:
    timeout_minutes: 120
    max_retries: 2
    on_error: notify
    trust_level: 0
