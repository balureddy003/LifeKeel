workflow:
  id: invoice_overdue_chase
  name: "Overdue Invoice → AI Email → Send"
  description: >
    When an invoice becomes overdue, draft a professional chase email using AI,
    get human approval, then send via the connected email integration.
  version: "1.0.0"
  enabled: true

  trigger:
    detector: overdue_invoice_recovery
    condition: "days_overdue >= 7"

  state:
    invoice_id: ""
    customer_name: ""
    customer_email: ""
    amount_due: ""
    days_overdue: 0
    generated_email: ""
    email_subject: ""

  nodes:
    - id: fetch_invoice
      type: http
      label: "Fetch invoice details"
      config:
        method: GET
        url: "http://localhost:3001/connectors/xero/invoices/{{event_source_id}}"
        output:
          invoice_id: "$.body.invoice_id"
          customer_name: "$.body.contact.name"
          customer_email: "$.body.contact.email"
          amount_due: "$.body.amount_due_formatted"
          days_overdue: "$.body.days_overdue"

    - id: generate_email
      type: ai_generate
      label: "Generate chase email"
      config:
        model: claude-haiku-4-5
        system: |
          You are a professional accounts receivable assistant. Write clear, polite
          but firm payment reminder emails. Be concise. Include the invoice amount
          and days overdue. Offer to help with any issues.
        prompt: |
          Write a payment reminder email to {{state.customer_name}} for an invoice
          that is {{state.days_overdue}} days overdue for {{state.amount_due}}.
          Their email: {{state.customer_email}}

          Format as:
          SUBJECT: [subject line]
          BODY:
          [email body]
        output_key: generated_email
        fallback: |
          SUBJECT: Payment Reminder — Invoice Due
          BODY:
          Dear {{state.customer_name}},

          I hope this finds you well. I'm writing regarding invoice {{state.invoice_id}}
          for {{state.amount_due}}, which is now {{state.days_overdue}} days overdue.

          Please arrange payment at your earliest convenience, or contact us if you
          have any questions.

          Best regards

    - id: approve_email
      type: human_approval
      label: "Approve chase email"
      config:
        title: "Invoice chase email needs approval"
        urgency: medium
        timeout: 4h
        # New tenants: auto_dismiss. Upgrade to auto_approve via trust_level setting after 5 manual approvals.
        timeout_action: auto_dismiss
        display:
          - label: "Customer"
            value: "{{state.customer_name}} ({{state.customer_email}})"
          - label: "Invoice"
            value: "{{state.invoice_id}} — {{state.amount_due}} — {{state.days_overdue}} days overdue"
          - label: "Draft email"
            value: "{{state.generated_email}}"
        actions:
          - id: approve
            label: "Send email"
            style: primary
          - id: edit_approve
            label: "Edit & send"
            style: secondary
            allow_edit: true
            edit_field: generated_email
          - id: reject
            label: "Don't send"
            style: danger

    - id: send_email
      type: notify
      label: "Send chase email"
      config:
        channel: email
        destination: "{{state.customer_email}}"
        subject: "Payment Reminder"
        template: "{{state.generated_email}}"

    - id: log_activity
      type: http
      label: "Log chase activity in Xero"
      config:
        method: POST
        url: "http://localhost:3001/connectors/xero/invoices/{{state.invoice_id}}/notes"
        body:
          note: "Chase email sent to {{state.customer_email}} for {{state.amount_due}} ({{state.days_overdue}} days overdue)"

  edges:
    - from: fetch_invoice
      to: generate_email

    - from: generate_email
      to: approve_email

    - from: approve_email
      to: send_email
      condition: "__outcome == 'approve' || __outcome == 'edit_approve'"

    - from: approve_email
      to: END
      condition: "__outcome == 'reject'"

    - from: send_email
      to: log_activity

    - from: log_activity
      to: END

  settings:
    timeout_minutes: 240
    max_retries: 2
    on_error: notify
    trust_level: 0
