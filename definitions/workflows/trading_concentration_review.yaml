id: trading_concentration_review
name: Concentration Risk → Draft Trim Note → Human Review → Notify
description: |
  When the Portfolio Concentration Risk detector flags a position that exceeds
  the goal's concentration cap: AI drafts a short, factual review note,
  routes it through a human approval gate, and notifies the owner on Slack.
  No trade is ever placed automatically — the owner decides whether to trim,
  and any live execution still requires a separate pending-trade confirmation.
  If the tenant has explicitly enabled autonomous trading (Portfolio →
  Research → Auto-Trading), the approval gate is bypassed and a pending trade is
  created directly — it still passes through the same guarded confirm path
  (tenant opt-in, broker live mode, KAIROS_ALLOW_LIVE_TRADING, order-value
  and daily-trade caps) before anything reaches the broker.
version: 1.0.0
enabled: true
trigger:
  detector: trading_concentration_risk

state:
  review_note: ""

nodes:
  - id: trigger
    type: trigger
    label: Concentration risk alert fired
    config: {}

  - id: draft_review_note
    type: skill
    label: Draft trim review note
    config:
      skill: generate
      prompt: >
        {{event.ticker}} now makes up {{event.portfolio_weight_pct}}% of the
        portfolio, above the configured concentration cap. The position is
        valued at £{{event.position_value_display}}. Write a short, calm
        review note for the owner: state the breach, note the concentration
        risk, and recommend reviewing whether to trim back to the target weight.
        Remind them that no trade executes without their explicit approval.
      persona: "a calm, factual portfolio risk analyst"
      tone: neutral
      max_words: 80
      output_key: review_note

  - id: human_review
    type: human_approval
    label: Review concentration breach
    config:
      title: "Concentration Risk — review required"
      urgency: medium
      timeout: 72h
      timeout_action: escalate
      auto_approve_condition: "event_auto_trading_enabled"
      auto_approve_outcome: auto_execute
      display:
        - label: Ticker
          value: "{{event.ticker}}"
        - label: Portfolio weight
          value: "{{event.portfolio_weight_pct}}%"
        - label: Position value
          value: "£{{event.position_value_display}}"
        - label: AI review note
          value: "{{state.review_note}}"
      actions:
        - id: propose_trim
          label: Propose trim to target weight
          style: primary
        - id: log_reviewed
          label: Reviewed — no action needed
          style: secondary
        - id: dismiss
          label: Dismiss
          style: danger

  - id: trade_intent
    type: trade_intent
    label: Create pending trade
    config: {}

  - id: notify_owner
    type: connector_action
    label: Notify owner on Slack
    config:
      connector: slack
      action: send_message
      params:
        channel: "{{tenant.owner_slack_id}}"
        text: >-
          ⚖️ *Concentration Risk reviewed* — {{event.ticker}}


          {{state.review_note}}


          _Decision: {{state.__outcome}}_

edges:
  - from: trigger
    to: draft_review_note
  - from: draft_review_note
    to: human_review
  - from: human_review
    to: trade_intent
  - from: trade_intent
    to: notify_owner

settings:
  trust_level: 0
  timeout_minutes: 4320
  on_error: notify
