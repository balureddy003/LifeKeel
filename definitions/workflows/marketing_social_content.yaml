id: marketing_social_content
name: Business Event → AI Social Post → Schedule
description: |
  When a significant business event occurs (big order, milestone, new product):
  AI generates platform-specific posts for LinkedIn and Instagram, gets human
  approval, then publishes.
version: 1.0.0
template:
  category: social
  required_connectors: [linkedin, slack]
  estimated_roi: "£1,000–£8,000/month from brand visibility and engagement"
  setup_minutes: 15
  featured: true
enabled: true
trigger:
  event_type: business.milestone

state:
  linkedin_post: ""
  instagram_caption: ""

nodes:
  - id: trigger
    type: trigger
    label: Business milestone / event
    config: {}

  - id: draft_linkedin
    type: skill
    label: Draft LinkedIn post
    config:
      skill: generate
      persona: "an authentic SMB founder sharing genuine business wins"
      tone: "professional but human. Insight-driven. Subtle CTA. No hashtag spam."
      max_words: 150
      prompt: "Write a LinkedIn post about this business milestone: {{event.description}}. Company: {{tenant.business_name}}. Make it feel real and insightful, not a press release. End with one question to spark engagement. Max 3 relevant hashtags."
      output_key: linkedin_post

  - id: draft_instagram
    type: skill
    label: Draft Instagram caption
    config:
      skill: generate
      persona: "a relatable brand voice for a growing SMB"
      tone: "upbeat, visual storytelling, community-focused"
      max_words: 80
      prompt: "Write an Instagram caption for this milestone: {{event.description}}. Brand: {{tenant.business_name}}. Keep it short, punchy, emoji-friendly. 5-8 relevant hashtags at the end."
      output_key: instagram_caption

  - id: human_approve
    type: human_approval
    label: Approve social posts
    config:
      title: "Social media posts ready for review"
      urgency: low
      timeout: 24h
      timeout_action: skip
      display:
        - label: LinkedIn draft
          value: "{{state.linkedin_post}}"
        - label: Instagram draft
          value: "{{state.instagram_caption}}"
      actions:
        - id: approve
          label: Publish both
          style: primary
        - id: edit_approve
          label: Edit & publish
          style: secondary
          allow_edit: true
          edit_field: linkedin_post
        - id: reject
          label: Skip this time
          style: danger

  - id: post_linkedin
    type: connector_action
    label: Post to LinkedIn
    config:
      connector: linkedin
      action: create_post
      params:
        text: "{{state.linkedin_post}}"
        author: "{{tenant.linkedin_urn}}"

  - id: notify_done
    type: connector_action
    label: Notify team
    config:
      connector: slack
      action: send_message
      params:
        channel: "#marketing"
        text: "✅ Social posts published for: {{event.description}}"

edges:
  - from: trigger
    to: [draft_linkedin, draft_instagram]
  - from: [draft_linkedin, draft_instagram]
    to: human_approve
  - from: human_approve
    to: post_linkedin
    condition: "__outcome == 'approve'"
    label: Approved
  - from: post_linkedin
    to: notify_done

settings:
  trust_level: 0
  timeout_minutes: 1440
  on_error: continue
