id: marketing_win_back_churned
name: Subscription Cancelled → Win-back Campaign
description: |
  When a Stripe subscription is cancelled: extract churn reason from their
  feedback, decide on the right win-back offer, send a personalised win-back
  email, and update CRM with churn category for analysis.
version: 1.0.0
template:
  category: marketing
  required_connectors: [gmail, hubspot]
  estimated_roi: "£500–£5,000/month from recovered subscriptions"
  setup_minutes: 10
  featured: true
enabled: true
trigger:
  event_type: subscription.cancelled

state:
  churn_reason: ""
  churn_category: ""
  win_back_offer: ""
  win_back_email: ""

nodes:
  - id: trigger
    type: trigger
    label: Subscription cancelled
    config: {}

  - id: classify_churn
    type: skill
    label: Classify churn reason
    config:
      skill: classify
      text: "Cancellation reason: {{event.cancellation_reason}} | Feedback: {{event.feedback}} | Plan: {{event.plan_name}} | LTV: {{event.customer_ltv_display}}"
      labels: [price_too_high, missing_feature, switching_competitor, not_using_it, business_closed, temporary_pause, bad_experience]
      multi: false
      output_key: churn_classification

  - id: decide_offer
    type: skill
    label: Decide win-back offer
    config:
      skill: decide
      question: "What is the best win-back offer for this churned customer?"
      context: "Churn reason: {{state.churn_classification.labels[0]}}. Plan: {{event.plan_name}}. LTV: {{event.customer_ltv_display}}. Months as customer: {{event.months_subscribed}}."
      options: [offer_50_percent_off, offer_free_month, offer_feature_trial, offer_downgrade, no_discount_just_feedback, do_not_contact]
      output_key: offer_decision

  - id: draft_win_back
    type: skill
    label: Draft win-back email
    config:
      skill: generate
      persona: "a genuine, human founder or customer success manager — not a bot"
      tone: "personal, honest, no hard sell. Acknowledge the cancellation warmly."
      max_words: 130
      prompt: "Write a win-back email to {{event.customer_name}} who cancelled their {{event.plan_name}} subscription due to {{state.churn_classification.labels[0]}}. Our win-back offer is: {{state.offer_decision.decision}}. Be genuine, acknowledge their reason, and make the offer feel like a personal gesture, not a marketing blast."
      output_key: win_back_email
      fallback: "Hi {{event.customer_name}}, we're sorry to see you go. We'd love to understand how we could have served you better. If you'd like to come back, we have something special for you."

  - id: check_contact
    type: condition
    label: Should we contact them?
    config:
      expression: "offer_decision.decision != 'do_not_contact'"
      true_node: send_win_back
      false_node: log_to_crm

  - id: send_win_back
    type: connector_action
    label: Send win-back email
    config:
      connector: gmail
      action: send_email
      params:
        to: "{{event.customer_email}}"
        subject: "We're sorry to see you go, {{event.customer_name}}"
        body: "{{state.win_back_email}}"

  - id: log_to_crm
    type: connector_action
    label: Update HubSpot with churn data
    config:
      connector: hubspot
      action: update_contact
      params:
        id: "{{event.hubspot_contact_id}}"
        properties:
          hs_lead_status: CHURNED
          churn_reason: "{{state.churn_classification.labels[0]}}"
          churn_date: "{{event.cancelled_at}}"
          win_back_offer_sent: "{{state.offer_decision.decision}}"

edges:
  - from: trigger
    to: [classify_churn, draft_win_back]
  - from: classify_churn
    to: decide_offer
  - from: [decide_offer, draft_win_back]
    to: check_contact
  - from: check_contact
    to: send_win_back
    condition: "offer_decision.decision != 'do_not_contact'"
    label: Contact them
  - from: check_contact
    to: log_to_crm
    label: Either path
  - from: send_win_back
    to: log_to_crm

settings:
  trust_level: 0
  timeout_minutes: 15
  on_error: continue
