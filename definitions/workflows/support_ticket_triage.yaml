id: support_ticket_triage
name: Support Ticket → AI Triage → Route → Auto-respond
description: |
  New Zendesk ticket arrives → classify intent and urgency → route to the right
  team queue → generate a first-response draft → if urgent, page the on-call
  team on Slack immediately.
version: 1.0.0
template:
  category: support
  required_connectors: [zendesk, slack]
  estimated_roi: "£2,000–£15,000/month from faster resolution and SLA compliance"
  setup_minutes: 10
  featured: true
enabled: true
trigger:
  event_type: support.ticket.created

state:
  ticket_category: ""
  urgency_score: 0
  draft_response: ""
  assigned_queue: ""

nodes:
  - id: trigger
    type: trigger
    label: New support ticket
    config: {}

  - id: classify_intent
    type: skill
    label: Classify ticket intent
    config:
      skill: classify
      text: "Subject: {{event.subject}} | Body: {{event.description}}"
      labels: [billing, technical, account, feature_request, complaint, refund, general]
      output_key: ticket_classification

  - id: score_urgency
    type: skill
    label: Score urgency
    config:
      skill: score
      subject: "{{event.subject}} {{event.description}}"
      rubric: "Score 0-100 for urgency. 90+ = service down, data loss, legal threat, abuse. 70-89 = billing issue, account locked, major bug. 40-69 = general support. Under 40 = feature request or general query."
      output_key: urgency_result

  - id: set_routing
    type: transform
    label: Set category + urgency
    config:
      mappings:
        ticket_category: "{{state.ticket_classification.labels[0]}}"
        urgency_score: "{{state.urgency_result.score}}"
        assigned_queue: "{{state.ticket_classification.labels[0] == 'billing' ? 'billing' : state.ticket_classification.labels[0] == 'technical' ? 'engineering' : 'general-support'}}"

  - id: draft_first_response
    type: skill
    label: Draft first response
    config:
      skill: generate
      persona: "an empathetic, expert customer support agent"
      tone: "helpful, concise, reassuring. Acknowledge the issue, give a clear next step."
      max_words: 150
      prompt: "Draft a first response to this {{state.ticket_category}} support ticket:\n\nSubject: {{event.subject}}\n\nCustomer message: {{event.description}}\n\nAcknowledge their issue, give 1-2 concrete next steps, set expectation on resolution time."
      output_key: draft_response
      fallback: "Thank you for contacting us. We've received your request and a member of our {{state.assigned_queue}} team will be in touch within 2 business hours."

  - id: route_ticket
    type: connector_action
    label: Route ticket in Zendesk
    config:
      connector: zendesk
      action: update_ticket
      params:
        id: "{{event.ticket_id}}"
        status: open
        comment: "Auto-routed to {{state.assigned_queue}} queue. AI classification: {{state.ticket_category}} (urgency: {{state.urgency_score}}/100)"

  - id: send_first_response
    type: connector_action
    label: Send first response
    config:
      connector: zendesk
      action: update_ticket
      params:
        id: "{{event.ticket_id}}"
        status: pending
        comment: "{{state.draft_response}}"

  - id: check_urgent
    type: condition
    label: Is it urgent?
    config:
      expression: "urgency_score >= 80"
      true_node: page_on_call
      false_node: END

  - id: page_on_call
    type: connector_action
    label: Page on-call on Slack
    config:
      connector: slack
      action: send_message
      params:
        channel: "#on-call-alerts"
        text: "🚨 *URGENT ticket* (#{{event.ticket_id}})\n*Category:* {{state.ticket_category}}\n*Urgency:* {{state.urgency_score}}/100\n*Subject:* {{event.subject}}\n*Customer:* {{event.requester_email}}\n\nPlease respond within 15 minutes."

edges:
  - from: trigger
    to: [classify_intent, score_urgency]
  - from: [classify_intent, score_urgency]
    to: set_routing
  - from: set_routing
    to: [draft_first_response, route_ticket]
  - from: draft_first_response
    to: send_first_response
  - from: [send_first_response, route_ticket]
    to: check_urgent
  - from: check_urgent
    to: page_on_call
    condition: "urgency_score >= 80"
    label: Urgent

settings:
  trust_level: 0
  timeout_minutes: 5
  max_retries: 2
  on_error: continue
