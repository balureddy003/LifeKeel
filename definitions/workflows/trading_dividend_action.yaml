id: trading_dividend_action
name: Dividend Opportunity → Draft Note → Human Review → Notify
description: |
  When the Dividend Opportunity detector flags a holding with an attractive
  yield inside an actionable ex-dividend window: AI drafts a short note
  summarising the opportunity, routes it through a human approval gate, and
  notifies the owner on Slack. No automatic reinvestment or buy happens — the
  owner decides whether to act.
version: 1.0.0
enabled: true
trigger:
  detector: trading_dividend_opportunity

state:
  review_note: ""

nodes:
  - id: trigger
    type: trigger
    label: Dividend opportunity alert fired
    config: {}

  - id: draft_review_note
    type: skill
    label: Draft dividend opportunity note
    config:
      skill: generate
      prompt: >
        {{event.ticker}} shows a {{event.dividend_yield_pct}}% dividend yield
        with an actionable ex-dividend window. Write a short, factual note for
        the owner: state the yield, mention the importance of confirming the
        ex-dividend date, and ask whether they want to review reinvestment
        options. Remind them that no trade executes without their approval.
      persona: "a calm, factual income-focused analyst"
      tone: neutral
      max_words: 80
      output_key: review_note

  - id: human_review
    type: human_approval
    label: Review dividend opportunity
    config:
      title: "Dividend Opportunity — review required"
      urgency: low
      timeout: 72h
      timeout_action: escalate
      display:
        - label: Ticker
          value: "{{event.ticker}}"
        - label: Dividend yield
          value: "{{event.dividend_yield_pct}}%"
        - label: Days to ex-dividend
          value: "{{event.days_to_ex_dividend}}"
        - label: AI review note
          value: "{{state.review_note}}"
      actions:
        - id: confirm_date
          label: Confirm ex-dividend date
          style: secondary
        - id: review_reinvest
          label: Review reinvestment options
          style: primary
        - id: dismiss
          label: Dismiss
          style: danger

  - id: notify_owner
    type: connector_action
    label: Notify owner on Slack
    config:
      connector: slack
      action: send_message
      params:
        channel: "{{tenant.owner_slack_id}}"
        text: >-
          💰 *Dividend Opportunity reviewed* — {{event.ticker}}


          {{state.review_note}}


          _Decision: {{state.__outcome}}_

edges:
  - from: trigger
    to: draft_review_note
  - from: draft_review_note
    to: human_review
  - from: human_review
    to: notify_owner

settings:
  trust_level: 0
  timeout_minutes: 4320
  on_error: notify
