id: ops_staff_onboarding
name: New Staff → Onboarding Sequence
description: |
  When a new team member is added: create their accounts, send a personalised
  welcome, schedule their 1:1, add to team Slack channels, and log in Airtable
  HR tracker.
version: 1.0.0
template:
  category: ops
  required_connectors: [slack, gmail, google_calendar, airtable]
  estimated_roi: "£1,000–£5,000/month from faster time-to-productivity"
  setup_minutes: 20
  featured: true
enabled: true
trigger:
  event_type: hr.employee.created

state:
  welcome_message: ""
  onboarding_plan: ""

nodes:
  - id: trigger
    type: trigger
    label: New employee added
    config: {}

  - id: generate_welcome
    type: skill
    label: Generate personalised welcome
    config:
      skill: generate
      persona: "a warm, enthusiastic people manager welcoming a new team member"
      tone: "genuine, excited, practical. Make them feel expected and valued."
      max_words: 120
      prompt: "Write a welcome message for {{event.employee_name}} who is joining as {{event.role}} on {{event.start_date}}. Company: {{tenant.business_name}}. Their manager: {{event.manager_name}}. Include 2-3 practical first-day tips."
      output_key: welcome_message

  - id: create_onboarding_plan
    type: skill
    label: Create 30-day onboarding plan
    config:
      skill: plan
      goal: "Onboard {{event.employee_name}} as {{event.role}} at {{tenant.business_name}} in 30 days"
      constraints: "Company size: {{tenant.employee_count}}. Industry: {{tenant.industry}}. Remote/hybrid: {{tenant.work_mode}}."
      output_key: onboarding_plan

  - id: invite_slack
    type: connector_action
    label: Invite to Slack channels
    config:
      connector: slack
      action: send_message
      params:
        channel: "#general"
        text: "🎉 Please welcome *{{event.employee_name}}* who's joining us as *{{event.role}}* on {{event.start_date}}! @channel say hello 👋"

  - id: send_welcome_email
    type: connector_action
    label: Send welcome email
    config:
      connector: gmail
      action: send_email
      params:
        to: "{{event.personal_email}}"
        subject: "Welcome to {{tenant.business_name}}, {{event.employee_name}}! 🎉"
        body: "{{state.welcome_message}}<br><br><strong>Your 30-day plan:</strong><br>{{state.onboarding_plan}}"

  - id: schedule_1on1
    type: connector_action
    label: Schedule first 1:1
    config:
      connector: google_calendar
      action: create_event
      params:
        summary: "Welcome 1:1 — {{event.employee_name}} + {{event.manager_name}}"
        start: "{{event.start_date}}T10:00:00"
        end: "{{event.start_date}}T10:30:00"
        attendees: '["{{event.employee_work_email}}", "{{event.manager_email}}"]'
        description: "First day welcome call. Agenda: introductions, role overview, 30-day plan review."

  - id: log_to_airtable
    type: connector_action
    label: Log in HR tracker
    config:
      connector: airtable
      action: create_record
      params:
        baseId: "{{tenant.airtable_hr_base_id}}"
        tableName: "Employees"
        fields:
          Name: "{{event.employee_name}}"
          Role: "{{event.role}}"
          Start Date: "{{event.start_date}}"
          Manager: "{{event.manager_name}}"
          Status: "Onboarding"

edges:
  - from: trigger
    to: [generate_welcome, create_onboarding_plan]
  - from: [generate_welcome, create_onboarding_plan]
    to: [invite_slack, send_welcome_email, schedule_1on1]
  - from: [invite_slack, send_welcome_email, schedule_1on1]
    to: log_to_airtable

settings:
  trust_level: 0
  timeout_minutes: 30
  on_error: continue
