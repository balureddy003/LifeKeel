id: trading_price_drop_review
name: Price Drop Alert → Draft Review Note → Human Review → Notify
description: |
  When the Price Drop Alert detector flags a held position that has breached
  the goal's price-drop threshold: AI drafts a short, factual review note,
  routes it through a human approval gate (landing in the Review queue), and
  notifies the owner on Slack with the outcome. No trade is ever placed
  automatically — this closes the loop between Signal Monitors, Alert Rules,
  and Approvals for the Trading & Investment vertical.
  If the tenant has explicitly enabled autonomous trading (Portfolio →
  Research → Auto-Trading), the approval gate is bypassed and a pending trade is
  created directly — it still passes through the same guarded confirm path
  (tenant opt-in, broker live mode, KAIROS_ALLOW_LIVE_TRADING, order-value
  and daily-trade caps) before anything reaches the broker.
version: 1.0.0
template:
  category: investing
  required_connectors: [slack]
  estimated_roi: "Faster, more consistent risk-rule reviews"
  setup_minutes: 2
  featured: true
enabled: true
trigger:
  detector: trading_price_drop_alert

state:
  review_note: ""

nodes:
  - id: trigger
    type: trigger
    label: Price Drop Alert fired
    config: {}

  - id: draft_review_note
    type: skill
    label: Draft review note
    config:
      skill: generate
      prompt: >
        {{event.ticker}} is at £{{event.current_price_gbp}} vs an average
        cost of £{{event.avg_price_gbp}} across {{event.quantity}} shares —
        a breach of the position's price-drop risk rule. Write a short
        review note for the position owner: state the breach plainly, note
        the estimated paper impact, and remind them that no trade executes
        without their approval.
      persona: "a calm, factual portfolio risk analyst"
      tone: neutral
      max_words: 80
      output_key: review_note

  - id: human_review
    type: human_approval
    label: Review position
    config:
      title: "Price Drop Alert — review required"
      urgency: medium
      timeout: 72h
      timeout_action: escalate
      auto_approve_condition: "event_auto_trading_enabled"
      auto_approve_outcome: auto_execute
      display:
        - label: Ticker
          value: "{{event.ticker}}"
        - label: Current price
          value: "£{{event.current_price_gbp}}"
        - label: Average cost
          value: "£{{event.avg_price_gbp}}"
        - label: AI review note
          value: "{{state.review_note}}"
      actions:
        - id: propose_trim
          label: Propose a trim to target weight
          style: primary
        - id: log_reviewed
          label: Reviewed — no action needed
          style: secondary
        - id: dismiss
          label: Dismiss
          style: danger

  - id: trade_intent
    type: trade_intent
    label: Create pending trade
    config: {}

  - id: notify_owner
    type: connector_action
    label: Notify owner on Slack
    config:
      connector: slack
      action: send_message
      params:
        channel: "{{tenant.owner_slack_id}}"
        text: >-
          📉 *Price Drop Alert reviewed* — {{event.ticker}}


          {{state.review_note}}


          _Decision: {{state.__outcome}}_

edges:
  - from: trigger
    to: draft_review_note
  - from: draft_review_note
    to: human_review
  - from: human_review
    to: trade_intent
  - from: trade_intent
    to: notify_owner

settings:
  trust_level: 0
  timeout_minutes: 4320
  on_error: notify
