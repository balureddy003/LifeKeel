workflow:
  id: marketing_kairos_x_daily_capability
  name: "Kairos X Presence Goal Action"
  description: >
    Runs daily for tenants with a connected X account. Drafts one practical
    goal action with a concrete example, asks for approval, then executes it
    through X after approval.
  version: "1.0.0"
  enabled: true

  trigger:
    schedule: "0 9 * * *"

  state:
    brand_context: |
      Kairos is an AI operating layer for small businesses. It turns natural
      language goals into KPI definitions, computes progress from connected
      business data, detects when a goal is behind pace or achieved, suggests
      actions, asks for approval, executes approved actions through connectors,
      tracks attribution, and learns which skills work.
    content_pillars: |
      - Goal compiler: turn "grow X presence" into measurable KPIs and detectors.
      - Universal KPI compute: refresh goal progress from MongoDB aggregations.
      - Insight engine: explain behind pace, on track, and achieved states.
      - Approval loop: send WhatsApp or Studio approvals before actions execute.
      - X connector skills: search, draft, post, reply, and build threads through X tools.
      - Attribution tracker: measure whether a post or action moved the KPI.
      - Skill optimizer: learn which prompts and actions perform best.
    x_post: ""

  nodes:
    - id: draft_x_post
      type: ai_generate
      label: "Draft goal action"
      config:
        model: "tier:balanced"
        system: >
          You write concise product-led X posts for Kairos. Be specific,
          practical, and credible. The channel is X only. Avoid hype, vague
          claims, emojis, hashtags, and invented customer names or metrics.
        prompt: >
          Write one X post for today that improves Kairos' presence on X by
          showing one interesting Kairos capability with a concrete example.

          Brand context:
          {{state.brand_context}}

          Capability pool:
          {{state.content_pillars}}

          Requirements:
          - Maximum 260 characters.
          - Mention Kairos once.
          - The example must be about X, social posting, KPI tracking,
            approvals, attribution, or connector automation.
          - Use "X", not "Twitter".
          - Do not mention Instagram, LinkedIn, TikTok, Facebook, YouTube,
            Substack, or other channels.
          - Include one concrete example of an input, workflow, detector, KPI,
            approval, connector action, attribution result, or learning loop.
          - Make it useful to founders, operators, or small business owners.
          - No emojis.
          - No hashtags.
          - Do not tell the reader to turn a goal into KPIs. Show one real
            Kairos capability in action.
          - Do not reuse the phrase "grow Twitter presence".
          - Output only the post text.
        output_key: x_post
        max_chars: 260
        fallback: "Kairos turns an X growth goal into KPIs, detectors, approvals, actions, and attribution. Example: draft one capability post daily, approve it, publish to X, then track engagement."
        fallbacks:
          - "Kairos connects goals to execution. Example: grow X presence becomes KPIs, a daily draft, a review step, an X publish action, and attribution back to the goal."
          - "Kairos can turn approved posting into a learning loop. Draft one X capability post, review it, publish it, then use engagement signals to sharpen tomorrow's action."
          - "Kairos tracks whether social work is moving a goal. Publish a capability post on X, sync impressions and engagement, then see if the goal is on track or needs a new action."
          - "Kairos turns a rough objective into an operating rhythm. Example: define an X growth goal, generate one useful daily post, approve it, publish it, and measure response."
          - "Kairos keeps humans in control of automation. Example: it drafts an X post about a capability, waits for approval, publishes only after review, then records the outcome."
          - "Kairos makes KPI progress visible after action. Example: approve an X post, publish through the connector, then compare impressions and engagement against the goal."
          - "Kairos helps operators move from intent to proof. Example: one X goal creates KPIs, one daily action, a review gate, connector execution, and outcome tracking."
          - "Kairos can explain why a goal needs action. Example: if X engagement is behind pace, it prepares a specific post for review instead of just showing a red dashboard."
        blocked_phrases:
          - "Turn \"grow Twitter presence\""
          - "Twitter"
          - "boost your engagement"
          - "boost your Twitter engagement"
          - "retweets and likes"
          - "set up automated tweet approvals"
          - "Set KPIs like follower count"
          - "real-time detector alerts"
          - "real-time alerts if you're behind"
          - "automated tweets through X tools"
        reflexion:
          criterion: "The post is 260 characters or fewer, mentions Kairos once, is specifically about X or social posting, includes a concrete example, has no hashtags or emojis, and does not mention Instagram, LinkedIn, TikTok, Facebook, YouTube, Substack, or invented results."
          max_cycles: 2
          on_failure: fallback

    - id: approve_x_post
      type: human_approval
      label: "Review goal action"
      config:
        title: "Review today's Kairos X goal action"
        urgency: medium
        timeout: "24h"
        timeout_action: skip
        display:
          - label: "Suggested action"
            value: "{{state.x_post}}"
            type: text
        actions:
          - id: approve
            label: "Publish to X"
            style: primary
            allow_edit: true
            edit_field: x_post
          - id: reject
            label: "Skip today"
            style: danger

    - id: publish_x_post
      type: connector_action
      label: "Execute goal action on X"
      config:
        connector: twitter_x
        action: createPosts
        params:
          text: "{{state.x_post}}"

  edges:
    - from: draft_x_post
      to: approve_x_post

    - from: approve_x_post
      to: publish_x_post
      condition: "__outcome == 'approve'"

    - from: approve_x_post
      to: END
      condition: "__outcome == 'reject'"

    - from: publish_x_post
      to: END

settings:
  trust_level: 0
