id: social-x-growth
domain: Marketing
name: Grow presence on X
description: Publish useful content consistently and improve reach and engagement.
intent: >
  Grow our presence on X by publishing one useful capability example every day
  and learning from engagement.
cadence: daily
required_connectors:
  - twitter_x
skills:
  - plan
  - generate
  - compare
  - decide
plan:
  - id: plan_topic
    label: Choose the next useful topic
    skill: plan
    approval_required: false
    description: Select a capability and concrete example based on the goal and recent results.
  - id: draft_post
    label: Draft the X post
    skill: generate
    workflow_id: marketing_kairos_x_daily_capability
    connector_id: twitter_x
    approval_required: true
    description: Create one concise, useful post and send it for review.
  - id: publish_measure
    label: Publish and measure
    skill: compare
    connector_id: twitter_x
    approval_required: false
    description: Publish the approved post, sync engagement, and compare it with prior posts.
  - id: adapt
    label: Adapt tomorrow's action
    skill: decide
    approval_required: false
    description: Use measured performance to choose the next capability and format.
stop_condition: Stop when all X growth KPIs are achieved or the goal is archived.
spec:
  name: Grow presence on X
  description: >
    Publish one useful capability example on X each day and learn which topics
    improve reach and engagement.
  timeline_days: 90
  tags: [marketing, social, x]
  confidence: 0.95
  reasoning: Curated goal template with measurable KPIs and a repeatable execution plan.
  warnings: []
  detectors: []
  kpis:
    - metric: twitter_followers
      label: X followers
      unit: followers
      target: 100
      start_value: 0
      current: 0
      direction: increase
      source: external_api
      reasoning: Measures audience growth.
    - metric: twitter_engagement_rate
      label: X engagement rate
      unit: ratio
      target: 0.03
      start_value: 0
      current: 0
      direction: increase
      source: external_api
      reasoning: Measures whether posts are useful to the audience.
    - metric: twitter_impressions
      label: X impressions
      unit: impressions
      target: 10000
      start_value: 0
      current: 0
      direction: increase
      source: external_api
      reasoning: Measures total reach.
