id: elss-tax-saving
name: ELSS Tax Saving (§80C)
domain: Trading & Investment
description: >
  Track an ELSS (Equity Linked Savings Scheme) tax-saving investment goal under
  Section 80C of the Income Tax Act. Maximise the ₹1.5L annual deduction limit
  through SIP (Systematic Investment Plan) instalments into ELSS mutual funds,
  while monitoring fund performance and lock-in period.
intent: >
  Invest ₹1,50,000 over the financial year in ELSS mutual funds via monthly SIPs
  of ₹12,500 to claim the full §80C deduction, while tracking fund NAV growth
  and remaining lock-in periods for each instalment.
cadence: monthly
required_connectors:
  - zerodha
skills:
  - compare
  - decide
  - plan
plan:
  - id: monitor_sip_progress
    label: Monitor SIP progress vs §80C limit
    skill: compare
    approval_required: false
    description: >
      Compare cumulative ELSS investments against the ₹1.5L §80C limit and
      surface alerts when monthly SIPs fall behind the target pace.
  - id: rebalance_elss_allocation
    label: Rebalance ELSS fund allocation
    skill: decide
    approval_required: true
    description: >
      Suggest rebalancing across ELSS fund categories (large-cap, mid-cap,
      multi-cap) when allocation drifts beyond thresholds.
  - id: track_lock_in_period
    label: Track lock-in period
    skill: plan
    approval_required: false
    description: >
      Monitor the 3-year lock-in period for each SIP instalment and flag
      instalments approaching their release date.
stop_condition: >
  Stop when the ₹1.5L §80C limit is fully utilised for the financial year
  (April 1 – March 31), or when the user opts out of ELSS investments.
spec:
  name: ELSS Tax Saving (§80C)
  description: >
    Tax-saving investment plan using ELSS mutual funds under §80C. Targets
    ₹1,50,000 in annual ELSS contributions via monthly SIPs of ₹12,500 to
    claim the full tax deduction. Includes fund performance tracking and
    lock-in period monitoring.
  timeline_days: 365
  tags: [trading, investment, elss, tax-saving, india, sip, 80c]
  confidence: 0.7
  reasoning: >
    ELSS is the only §80C instrument with a 3-year lock-in (shortest among
    all §80C options) and has historically delivered 12-15% annualised returns
    over 5+ year horizons. The ₹12,500/month SIP maximises the ₹1.5L limit
    with even pacing.
  warnings:
    - >
      ELSS investments are subject to a 3-year lock-in per instalment —
      SIP instalments cannot be withdrawn until 3 years from the investment
      date.
    - >
      ELSS returns are market-linked and not guaranteed. Past performance is
      not indicative of future results.
    - >
      This template depends on a Zerodha (Kite Connect) connector and sync
      job that posts portfolio holdings. Connect the data source first.
  detectors:
    - id: trading_concentration_risk
      name: ELSS fund concentration risk
      existing: true
      reasoning: >
        Fires when a single ELSS fund exceeds 40% of the total ELSS portfolio,
        protecting against over-concentration in one fund.
    - id: trading_rebalance_suggestion
      name: SIP rebalance suggestion
      existing: true
      reasoning: >
        Surfaces when ELSS allocation drifts from the target large-cap/mid-cap
        mix or when SIP instalments are missed.
  kpis:
    - metric: elss_invested_minor
      label: ELSS invested (₹)
      unit: minor_currency
      target: 15000000
      start_value: 0
      current: 0
      direction: increase
      source: signals
      signal_types: [portfolio_summary]
      aggregation: last
      field: data.invested_value
      reasoning: >
        Tracks cumulative ELSS investments against the ₹1,50,000 §80C limit.
        Target is in paise (₹1.5L = 1,50,00,000 paise = 15,000,000 minor units).
    - metric: sip_completion_pct
      label: §80C limit utilised
      unit: percent
      target: 100
      start_value: 0
      current: 0
      direction: increase
      source: signals
      signal_types: [portfolio_summary]
      aggregation: last
      field: data.sip_completion_pct
      reasoning: >
        Percentage of the ₹1.5L §80C limit utilised. 100% means the full
        deduction has been claimed for the financial year.
    - metric: elss_nav_growth_pct
      label: ELSS NAV growth
      unit: percent
      target: 12
      start_value: 0
      current: 0
      direction: increase
      source: signals
      signal_types: [portfolio_summary]
      aggregation: last
      field: data.nav_growth_pct
      reasoning: >
        Tracks the weighted-average NAV growth across ELSS fund holdings.
        12% is a moderate long-term expectation for diversified ELSS funds.
    - metric: lock_in_remaining_months
      label: Lock-in remaining (months)
      unit: months
      target: 0
      start_value: 36
      current: 36
      direction: decrease
      source: signals
      signal_types: [portfolio_summary]
      aggregation: last
      field: data.lock_in_months
      reasoning: >
        Tracks the remaining lock-in period (in months) for the earliest
        SIP instalment. Reaches 0 when the first instalment's 3-year lock-in
        expires and becomes redeemable.
