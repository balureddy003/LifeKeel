id: reputation-reviews
domain: Marketing
name: Improve customer reviews
description: Respond to negative feedback and consistently request reviews.
intent: Improve our average customer review score to 4.5 while responding quickly to negative feedback.
cadence: daily
required_connectors: []
skills:
  - classify
  - generate
  - decide
  - compare
plan:
  - id: classify_reviews
    label: Classify new reviews
    skill: classify
    workflow_id: negative_review_responder
    approval_required: false
    description: Identify negative reviews and the likely cause.
  - id: prepare_response
    label: Prepare a helpful response
    skill: generate
    approval_required: true
    description: Draft an empathetic response for review before posting.
  - id: request_reviews
    label: Request reviews from happy customers
    skill: decide
    workflow_id: marketing_review_request
    approval_required: true
    description: Select appropriate customers for a review request.
stop_condition: Stop when the average review score reaches 4.5 and negative responses meet the service target.
spec:
  name: Improve customer reviews
  description: Improve review score through timely responses and consistent review requests.
  timeline_days: 90
  tags: [marketing, reputation]
  confidence: 0.95
  reasoning: Curated goal template with measurable KPIs and a repeatable execution plan.
  warnings: []
  detectors: []
  kpis:
    - metric: average_review_score
      label: Average review score
      unit: stars
      target: 4.5
      start_value: 0
      current: 0
      direction: increase
      source: manual
      reasoning: Measures overall customer reputation.
    - metric: negative_review_response_hours
      label: Negative review response time
      unit: hours
      target: 24
      start_value: 0
      current: 0
      direction: decrease
      source: manual
      reasoning: Measures responsiveness to negative feedback.
