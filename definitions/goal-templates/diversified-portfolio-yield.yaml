id: diversified-portfolio-yield
domain: Trading & Investment
name: Build a Diversified Portfolio Yield
description: Grow a diversified Trading 212 portfolio while keeping concentration risk below 10%.
intent: Grow a diversified portfolio yield to 6.5% while capping any single stock at 10% of the portfolio.
cadence: weekly
required_connectors:
  - trading-212
skills:
  - compare
  - decide
  - plan
plan:
  - id: monitor_concentration
    label: Monitor concentration risk
    skill: compare
    approval_required: false
    description: Track single-position weights against the 10% cap.
  - id: rebalance
    label: Propose rebalancing actions
    skill: decide
    approval_required: true
    description: Suggest trades when a position exceeds the cap or a price drop creates an opportunity.
  - id: review_yield
    label: Review dividend yield
    skill: plan
    approval_required: false
    description: Assess portfolio yield and dividend reinvestment alignment.
stop_condition: Stop when the portfolio yield reaches target and no single position exceeds 10% for 30 consecutive days.
spec:
  name: Build a Diversified Portfolio Yield
  description: >
    Grow a diversified Trading 212 portfolio while keeping concentration risk
    below 10% and reinvesting dividends that align with the goal.
  timeline_days: 365
  tags: [trading, investment, portfolio]
  confidence: 0.95
  reasoning: Curated goal template with measurable KPIs and a repeatable execution plan.
  warnings: []
  detectors:
    - id: trading_concentration_risk
      name: Trading concentration risk
      existing: true
      reasoning: Fires when a single position exceeds the target weight.
    - id: trading_price_drop_alert
      name: Trading price drop alert
      existing: true
      reasoning: Identifies price drops that may represent buying opportunities.
    - id: trading_dividend_opportunity
      name: Trading dividend opportunity
      existing: true
      reasoning: Surfaces upcoming or attractive dividend events.
    - id: trading_rebalance_suggestion
      name: Trading rebalance suggestion
      existing: true
      reasoning: Suggests rebalancing to maintain diversification.
  kpis:
    - metric: portfolio_dividend_yield_pct
      label: Dividend yield
      unit: percent
      target: 6.5
      start_value: 0
      current: 0
      direction: increase
      source: signals
      signal_types: [portfolio_summary]
      aggregation: last
      field: data.dividend_yield_pct
      reasoning: Tracks the portfolio dividend yield over time.
    - metric: portfolio_concentration_max_pct
      label: Max single-position weight
      unit: percent
      target: 10
      start_value: 0
      current: 0
      direction: decrease
      source: signals
      signal_types: [portfolio_position]
      aggregation: last
      field: data.portfolio_weight_pct
      reasoning: Measures the largest single-position exposure to enforce diversification.
    - metric: isa_allowance_used_pct
      label: ISA allowance used
      unit: percent
      target: 100
      start_value: 0
      current: 0
      direction: increase
      source: signals
      signal_types: [portfolio_summary]
      aggregation: last
      field: data.isa_allowance_used_pct
      reasoning: Tracks how much of the annual ISA allowance has been used.
