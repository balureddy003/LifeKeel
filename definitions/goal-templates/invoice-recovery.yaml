id: invoice-recovery
domain: Finance
name: Reduce overdue invoices
description: Recover overdue receivables while reducing manual finance work.
intent: Reduce overdue invoices to zero in 60 days without increasing finance workload.
cadence: daily
required_connectors:
  - xero
skills:
  - extract
  - prioritize
  - generate
  - decide
plan:
  - id: prioritize
    label: Prioritize overdue accounts
    skill: prioritize
    approval_required: false
    description: Rank overdue invoices by value, age, and likelihood of recovery.
  - id: draft_chase
    label: Prepare personalized follow-ups
    skill: generate
    workflow_id: invoice_overdue_chase
    connector_id: xero
    approval_required: true
    description: Draft the next appropriate reminder for each prioritized account.
  - id: measure_recovery
    label: Measure recovered cash
    skill: compare
    approval_required: false
    description: Track overdue balance and payment time after each action.
stop_condition: Stop when overdue invoice count reaches zero.
spec:
  name: Reduce overdue invoices
  description: Recover overdue balances with prioritized, approved follow-up actions.
  timeline_days: 60
  tags: [finance, receivables]
  confidence: 0.95
  reasoning: Curated goal template with measurable KPIs and a repeatable execution plan.
  warnings: []
  detectors: []
  kpis:
    - metric: overdue_invoice_count
      label: Overdue invoices
      unit: invoices
      target: 0
      start_value: 0
      current: 0
      direction: decrease
      source: signals
      signal_types: [invoice.overdue]
      aggregation: count
      reasoning: Directly measures the unresolved invoice backlog.
    - metric: overdue_balance
      label: Overdue balance
      unit: minor currency units
      target: 0
      start_value: 0
      current: 0
      direction: decrease
      source: signals
      signal_types: [invoice.overdue]
      aggregation: sum
      field: data.amount_minor
      reasoning: Measures the cash still at risk.
