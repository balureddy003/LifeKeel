id: trial-conversion
domain: Customer
name: Improve trial conversion
description: Nurture new leads with a qualified, personalized onboarding sequence.
intent: Improve trial-to-paid conversion to 25 percent by qualifying and nurturing new leads automatically.
cadence: daily
required_connectors:
  - mailchimp
  - gmail
skills:
  - classify
  - generate
  - decide
plan:
  - id: qualify_lead
    label: Qualify the new lead
    skill: classify
    workflow_id: marketing_new_lead_nurture
    connector_id: mailchimp
    approval_required: false
    description: Score the lead against the ideal customer profile and assign a nurture tier.
  - id: send_welcome
    label: Send a personalized welcome sequence
    skill: generate
    connector_id: gmail
    approval_required: true
    description: Draft and send a welcome email tailored to the lead's tier before it goes out.
  - id: measure_conversion
    label: Measure trial-to-paid conversion
    skill: compare
    approval_required: false
    description: Track how many nurtured trials convert to paid plans.
stop_condition: Stop when trial-to-paid conversion reaches target for the period.
spec:
  name: Improve trial conversion
  description: Qualify and nurture new leads so more trials convert to paid customers.
  timeline_days: 60
  tags: [customer, acquisition, trial]
  confidence: 0.9
  reasoning: Curated goal template with measurable KPIs and a repeatable execution plan.
  warnings: []
  detectors:
    - id: acquisition-conversion-stall
      name: Acquisition conversion stall
      existing: true
      reasoning: Fires when pipeline movement and trial-to-paid conversion are both below target.
  kpis:
    - metric: trial_conversion_rate
      label: Trial-to-paid conversion rate
      unit: ratio
      target: 0.25
      start_value: 0
      current: 0
      direction: increase
      source: signals
      signal_types: [stripe.trial_conversion]
      aggregation: last
      reasoning: Directly measures trial-to-paid conversion performance.
