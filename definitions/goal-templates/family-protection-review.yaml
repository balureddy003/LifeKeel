id: family-protection-review
domain: Family & Household
name: Family Protection Review
description: Review your family's insurance, savings, and goals to understand your financial readiness.
intent: Understand your family's financial readiness across protection, education, emergency savings, and retirement.
cadence: monthly
required_connectors: []
skills:
  - compare
  - decide
  - plan
plan:
  - id: review_protection
    label: Review protection coverage
    skill: compare
    approval_required: false
    description: Compare listed insurance policies against estimated household needs.
  - id: review_education
    label: Review education funding
    skill: compare
    approval_required: false
    description: Check education savings progress against targets and timelines.
  - id: review_emergency
    label: Review emergency fund
    skill: compare
    approval_required: false
    description: Evaluate emergency savings against recommended 3-6 months of expenses.
  - id: review_retirement
    label: Review retirement readiness
    skill: decide
    approval_required: true
    description: Project retirement savings trajectory against target age and income.
stop_condition: Stop when all four review areas have been assessed and any gaps are documented.
spec:
  name: Family Protection Review
  description: >
    Review your family's insurance, savings, and goals to understand your
    financial readiness. Informational only — not financial advice.
  timeline_days: 30
  tags: [family, protection, insurance, savings, retirement]
  confidence: 0.90
  reasoning: Curated goal template for monthly family financial readiness review.
  warnings:
    - All projections are estimates based on user-provided data and not guaranteed.
    - Consult a qualified professional before making financial decisions.
  detectors:
    - id: family_protection_gap
      name: Family protection gap
      existing: true
      reasoning: Flags gaps in insurance coverage against household needs.
    - id: family_education_shortfall
      name: Education funding shortfall
      existing: true
      reasoning: Identifies education savings behind target.
    - id: family_emergency_fund_adequacy
      name: Emergency fund adequacy
      existing: true
      reasoning: Evaluates emergency savings against recommended months of expenses.
    - id: family_retirement_gap
      name: Retirement savings gap
      existing: true
      reasoning: Projects retirement savings trajectory against target.
  kpis:
    - metric: family_readiness_score
      label: Family Readiness Score
      unit: percent
      target: 80
      start_value: 0
      current: 0
      direction: increase
      source: manual
      reasoning: Overall readiness across protection, education, emergency, and retirement.
