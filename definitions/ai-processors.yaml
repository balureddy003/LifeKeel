# AI processor registry — PRD-142, ARCHITECTURE.md §8.4, CLAUDE.md rule 3.
#
# Who may receive a family's content when a model call runs. The task registry
# (definitions/ai-tasks.yaml) says which processors a task may use
# (`allowed_processors`); this file says whether each one is approved.
#
# STATUS TODAY: `azure` and `vertex` are approved (owner decisions,
# 2026-10-22); anthropic, openai and groq remain `unreviewed`. Unknown facts
# are the explicit value `not_reviewed`, never an invented one. Retention for
# an unreviewed processor is the most conservative class (limited_abuse_log)
# because that is what must be assumed until reviewed.
#
# To approve a processor the owner supplies the real terms and sets
# `status: approved` with every field filled and real YYYY-MM-DD dates: the
# loader (packages/platform/src/ai-processors.ts) refuses `not_reviewed` on an
# approved entry. Retention is per model handle (`*` = any model not listed).
# A lapsed `review_due` blocks the processor again.
#
# Enforcement is AI_PROCESSOR_ENFORCEMENT = off | warn | enforce. The default
# is `enforce` outside dev (an unapproved processor is refused) and `warn` in
# dev. Outside dev, `warn` or `off` only takes effect with AI_POLICY_EXCEPTION
# set to a recorded reference (apps/api/src/ai/task-gateway.ts). Until the
# hosted processors a deployment uses are approved here, its hosted AI
# features are unavailable.

version: 1

processors:
  ollama:
    name: LifeKeel self-hosted model (Ollama)
    hosting: self_hosted
    status: self_hosted
    endpoint: LOCAL_JUDGE_BASE_URL (LifeKeel-operated infrastructure)
    region: LifeKeel-operated infrastructure
    terms_ref: none — no third-party processor
    no_training_basis: no third party receives content; the model is used for inference only
    retention:
      '*': none
    sub_processors: [none]
    transfer_mechanism: none — content stays in LifeKeel infrastructure
    dpa_date: not_applicable
    breach_notice_sla: not_applicable
    reviewed_at: not_applicable
    review_due: not_applicable

  anthropic:
    name: Anthropic API
    hosting: hosted
    status: unreviewed
    endpoint: https://api.anthropic.com
    region: not_reviewed
    terms_ref: not_reviewed
    no_training_basis: not_reviewed
    retention:
      '*': limited_abuse_log
    sub_processors: [not_reviewed]
    transfer_mechanism: not_reviewed
    dpa_date: not_reviewed
    breach_notice_sla: not_reviewed
    reviewed_at: not_reviewed
    review_due: not_reviewed

  openai:
    name: OpenAI API
    hosting: hosted
    status: unreviewed
    endpoint: https://api.openai.com
    region: not_reviewed
    terms_ref: not_reviewed
    no_training_basis: not_reviewed
    retention:
      '*': limited_abuse_log
    sub_processors: [not_reviewed]
    transfer_mechanism: not_reviewed
    dpa_date: not_reviewed
    breach_notice_sla: not_reviewed
    reviewed_at: not_reviewed
    review_due: not_reviewed

  azure:
    # Approved 2026-10-22 (owner decision): Azure OpenAI is the chosen hosted
    # processor. Honest gaps recorded inline — the resource is not deployed
    # yet, so `region` is filled at provisioning, and the default abuse-
    # monitoring retention applies until Microsoft approves modified abuse
    # monitoring on the subscription.
    name: Azure OpenAI Service
    hosting: hosted
    status: approved
    endpoint: the resource named by AZURE_OPENAI_ENDPOINT
    region: deployment-selected — the Azure region of the resource named by AZURE_OPENAI_ENDPOINT (not yet deployed)
    terms_ref: Microsoft Products and Services Data Protection Addendum + Azure OpenAI Service data, privacy and security documentation
    no_training_basis: Azure OpenAI product terms — prompts and completions are not used to train, retrain or improve models and are not shared with OpenAI
    retention:
      # Default Azure terms: prompts/completions may be held up to 30 days for
      # abuse monitoring until modified abuse monitoring (zero retention) is
      # approved on the subscription.
      '*': limited_abuse_log
    sub_processors:
      [
        Microsoft Corporation — Azure platform sub-processors per the Microsoft Products and Services DPA,
      ]
    transfer_mechanism: Microsoft Standard Contractual Clauses / EU Data Boundary per the Microsoft Products and Services DPA
    dpa_date: '2026-10-22'
    breach_notice_sla: notification without undue delay per the Microsoft Products and Services DPA
    reviewed_at: '2026-10-22'
    review_due: '2027-10-22'

  vertex:
    # Approved 2026-10-22 (owner decision): Google Cloud Vertex AI is the second
    # approved hosted processor — the enterprise Gemini path (NOT the free
    # Gemini Developer API, whose unpaid tier trains on submitted content).
    # Honest gaps recorded inline: the GCP project/location are not deployed
    # yet, so `region` is filled at provisioning (VERTEX_LOCATION), and the
    # conservative retention class applies until the deployment's data-
    # governance settings are confirmed.
    name: Google Cloud Vertex AI (Gemini)
    hosting: hosted
    status: approved
    endpoint: https://<location>-aiplatform.googleapis.com — the project and location named by VERTEX_PROJECT/VERTEX_LOCATION
    region: deployment-selected — the Vertex location configured in VERTEX_LOCATION (not yet deployed)
    terms_ref: Google Cloud Data Processing and Security Terms + Vertex AI data governance and generative-AI documentation
    no_training_basis: Google Cloud service terms — Vertex AI does not use customer prompts or responses to train Google's foundation models
    retention:
      # Vertex AI does not persist prompts/responses for product improvement;
      # transient processing only. Recorded conservatively at limited_abuse_log
      # until the deployment's data-governance configuration is confirmed — the
      # enterprise path can reach zero_data_retention.
      '*': limited_abuse_log
    sub_processors:
      [
        Google LLC and affiliates — Google Cloud Platform sub-processor list per the Google Cloud Data Processing Addendum,
      ]
    transfer_mechanism: EU Standard Contractual Clauses / UK Addendum per the Google Cloud Data Processing Addendum
    dpa_date: '2026-10-22'
    breach_notice_sla: notification without undue delay per the Google Cloud Data Processing Addendum
    reviewed_at: '2026-10-22'
    review_due: '2027-10-22'

  groq:
    name: Groq API
    hosting: hosted
    status: approved
    endpoint: https://api.groq.com
    # Inference runs on Groq's US LPUs; any retained data lands in US GCP
    # buckets (console.groq.com/docs/your-data).
    region: US
    terms_ref: >-
      console.groq.com/docs/your-data + Groq Services Agreement +
      GroqCloud DPA (effective 2025-10-15)
    # DPA §2.3 limits processing to providing the Cloud Services; inference
    # customer data is NOT retained by default — nothing to train on.
    no_training_basis: >-
      GroqCloud DPA §2.3 purpose limitation; inference customer data not
      retained by default (console.groq.com/docs/your-data)
    # Default: up-to-30-day reliability/abuse logs — self-serve ZDR via
    # Console → Data Controls (no application needed, unlike Azure). Flip to
    # zero_data_retention once the org admin enables it. Never use /batches
    # or /fine_tunings — those endpoints retain by design.
    retention:
      '*': limited_abuse_log
    # Live list: trust.groq.com/subprocessors (DPA §7.2). Retention host is
    # GCP. Third-party model terms still apply on top — Llama carries Meta's
    # AI Model Terms per Services Agreement §4.1.
    sub_processors:
      [
        Google LLC — GCP hosts retained data (console.groq.com/docs/your-data); full list at trust.groq.com/subprocessors,
      ]
    transfer_mechanism: EU SCCs (Commission Implementing Decision 2021/914) per GroqCloud DPA §8
    dpa_date: '2026-10-23'
    # DPA §6 — without undue delay, at most 72 hours.
    breach_notice_sla: within 72 hours per GroqCloud DPA §6
    reviewed_at: '2026-10-23'
    review_due: '2027-10-23'

  xai:
    # Approved 2026-10-23 (owner decision) on the CONDITION that Zero Data
    # Retention is enabled — the xAI DPA (Sept 2026 update) requires Personal
    # Data to be processed ONLY via the ZDR-enabled API; non-ZDR use is a
    # material breach of the agreement.
    #
    # 2026-10-31 exception (owner decision, testing phase only): self-serve
    # ZDR is not offered on this team's xAI tier (xAI routes non-enterprise
    # teams to sales for ZDR). Verified live: /v1/me zdr_status=no_zdr and
    # x-zero-data-retention:false on responses. The owner accepts the DPA
    # condition while the product is pre-launch/testing and commits to
    # switching the serving provider (groq at limited_abuse_log, Azure, or
    # Vertex — all approved without a ZDR condition) or reaching enterprise
    # ZDR before production launch. Recorded below at the ACTUAL default
    # retention (30-day audit log) so the gateway check evaluates reality,
    # not the intended state. Revert to zero_data_retention — and verify the
    # x-zero-data-retention:true header — if ZDR is ever enabled.
    name: xAI (Grok) API
    hosting: hosted
    status: approved
    endpoint: https://api.x.ai
    region: us — global endpoint, region not contractually pinned (US regional endpoint available)
    terms_ref: xAI Enterprise Terms of Service + SpaceXSI Data Processing Addendum (ZDR required for Personal Data, Sept 2026)
    no_training_basis: xAI Enterprise ToS — User Content is not used to train foundation models or develop new products; ZDR additionally prevents persistence of prompts/outputs
    retention:
      # Actual state (2026-10-31): ZDR unavailable on this team tier — the
      # default up-to-30-day encrypted audit log applies. Non-sensitive
      # tasks tolerating limited_abuse_log may route here during the
      # testing-phase exception above; lifekeel_infra_required tasks never
      # do (their boundary is self-hosted, not retention class).
      '*': limited_abuse_log
    sub_processors:
      [
        maintained list at https://x.ai/legal/subprocessor-list — AWS,
        Google Cloud,
        Oracle,
        MongoDB and others,
        all US plus a UK subsidiary,
      ]
    transfer_mechanism: EU Standard Contractual Clauses per the SpaceXSI Data Processing Addendum
    dpa_date: '2026-09-22'
    breach_notice_sla: without undue delay and, where feasible, within 48 hours per the SpaceXSI Data Processing Addendum
    reviewed_at: '2026-10-23'
    review_due: '2027-10-23'
