# AI task-policy registry — ARCHITECTURE.md §8.4, PRD-142.
#
# Every hosted/local model call in production must run under a task listed
# here. The gateway (packages/platform/src/task-gateway.ts) resolves the
# policy by task_id and enforces it: model allowlist, input/output token
# ceilings, deadline, per-task circuit breaker, symmetric input/output
# guards, budget check and usage→cost-ledger recording. An unknown task_id
# is a hard failure in production (fail closed) and a warn+default in dev.
#
# `allowed_processors` (PRD-142) names which entries in definitions/ai-processors.yaml
# may serve a task. `ollama` is the self-hosted model; the rest are hosted and
# are only usable once that processor is approved. A hosted fallback is listed
# only where the task's own terms say one is acceptable; `[]` is for a
# device_only task, which has no server-side processor at all.
#
# 2026-10-24: the GCP Ollama service (lifekeel-local-judge) was decommissioned
# for cost (~$12/day always-on). Non-sensitive `lifekeel_infra` tasks moved to
# `approved_hosted_provider` so they serve on the approved hosted processors.
# Only `lifekeel_infra_required` (special-category/youth quarantine) and
# `device_only` tasks still demand the self-hosted/on-device path.
#
# Fields are the enforceable subset of the full AiTaskPolicy interface.
# Terms/retention/review fields stay documentation until the processor-
# terms enforcement lands (they are still required so an entry cannot be
# added without stating them).

version: 1

tasks:
  assistant.answer.v1:
    purpose: Ask Keel — answer a question from the family's own records
    risk: user_visible
    authority: language_only
    data_boundary: approved_hosted_provider
    # Azure (approved 2026-10-22) is on default abuse-monitoring terms —
    # limited_abuse_log tolerated for this non-sensitive task until modified
    # abuse monitoring is approved on the subscription.
    processor_terms_ref: anthropic/openai API terms, Microsoft Products and Services DPA — not used for training
    provider_retention_class: limited_abuse_log
    allowed_models: [tier:fast]
    allowed_processors: [ollama, anthropic, openai, azure, vertex, groq, xai]
    primary_model: tier:fast
    preferred_execution: hosted_sync
    deadline_ms: 30000
    max_input_tokens: 8000
    max_output_tokens: 1500
    budget_class: interactive
    guard_policy: family_pii

  assistant.answer_verified.v1:
    # PRD-212: the deterministic tier — a factual ask resolved to an approved
    # read operation and rendered from a reviewed template with provenance.
    # Registered so the policy class exists and metrics/ops can reference it;
    # the resolver makes NO model call, so model/processor fields describe
    # the boundary it would be held to, not a call it makes.
    purpose: Ask Keel — deterministic answer from an approved read operation with provenance
    risk: user_visible
    authority: language_only
    data_boundary: lifekeel_infra
    processor_terms_ref: self-hosted — no model call is made
    provider_retention_class: none
    allowed_models: [deterministic]
    allowed_processors: [ollama]
    primary_model: deterministic
    preferred_execution: deterministic
    deadline_ms: 2000
    max_input_tokens: 8000
    max_output_tokens: 1500
    budget_class: interactive
    guard_policy: family_pii

  assistant.scenario_narration.v1:
