    # abuse monitoring is approved on the subscription.
    processor_terms_ref: anthropic/openai API terms, Microsoft Products and Services DPA — not used for training
    provider_retention_class: limited_abuse_log
    allowed_models: [tier:fast]
    allowed_processors: [ollama, anthropic, openai, azure, vertex, groq, xai]
    primary_model: tier:fast
    # Device-first: the feature prefers the on-device path
