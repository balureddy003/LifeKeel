# AI task-policy registry — ARCHITECTURE.md §8.4, PRD-142.
#
# Every hosted/local model call in production must run under a task listed
# here. The gateway (packages/platform/src/task-gateway.ts) resolves the
# policy by task_id and enforces it: model allowlist, input/output token
# ceilings, deadline, per-task circuit breaker, symmetric input/output
# guards, budget check and usage→cost-ledger recording. An unknown task_id
# is a hard failure in production (fail closed) and a warn+default in dev.
#
# Fields are the enforceable subset of the full AiTaskPolicy interface.
# Terms/retention/review fields stay documentation until the processor-
# terms enforcement lands (they are still required so an entry cannot be
# added without stating them).

version: 1

tasks:
  assistant.answer.v1:
    purpose: Ask Keel — answer a question from the family's own records
    risk: user_visible
    authority: language_only
    data_boundary: lifekeel_infra
    processor_terms_ref: anthropic/openai API terms — not used for training
    provider_retention_class: service_transient
    allowed_models: [tier:fast]
    primary_model: tier:fast
    preferred_execution: hosted_sync
    deadline_ms: 30000
    max_input_tokens: 8000
    max_output_tokens: 1500
    budget_class: interactive
    guard_policy: family_pii

  assistant.scenario_narration.v1:
