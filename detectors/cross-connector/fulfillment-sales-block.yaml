id: fulfillment-sales-block
name: Fulfillment sales block
version: "2.0.0"
signal_types: [shopify.inventory_stockout, hubspot.open_deals]
evidence_types: [shopify.inventory_stockout, hubspot.open_deals]
industries: ["*"]
correlation: { window_hours: 48, require_all: true, min_evidence_count: 2 }
rules:
  - id: fulfillment_sales_block
    name: Stockout is blocking open deals
    condition: "data.stockout_count > 0 and data.open_deals_over_14_days > 0"
    confidence: 0.86
    impact_low: 0
    impact_high: 0
    reasoning_template: "Inventory stockouts overlap with aging open deals."
    actions: ["Prioritize inventory for active deals"]
