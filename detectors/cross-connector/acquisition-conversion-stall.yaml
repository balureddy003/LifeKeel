id: acquisition-conversion-stall
name: Acquisition conversion stall
version: "2.0.0"
signal_types: [hubspot.pipeline_stall, stripe.trial_conversion]
evidence_types: [hubspot.pipeline_stall, stripe.trial_conversion]
industries: ["*"]
correlation: { window_hours: 72, require_all: true, min_evidence_count: 2 }
rules:
  - id: acquisition_conversion_stall
    name: Acquisition and conversion are stalled
    condition: "data.stalled_deals > 5 and data.trial_to_paid_rate < 0.15"
    confidence: 0.84
    impact_low: 0
    impact_high: 0
    reasoning_template: "Pipeline movement and trial conversion are both below target."
    actions: ["Review acquisition handoff and trial activation"]
