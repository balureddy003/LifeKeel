id: cash-crunch-early-warning
name: Cash crunch early warning
version: "2.0.0"
signal_types: [xero.payables_aging, stripe.deferred_revenue, bank.balance_trend]
evidence_types: [xero.payables_aging, stripe.deferred_revenue, bank.balance_trend]
industries: ["*"]
correlation: { window_hours: 168, require_all: true, min_evidence_count: 3 }
rules:
  - id: cash_crunch_early_warning
    name: Cash crunch risk detected
    condition: "data.payables_overdue_minor > 0 and data.deferred_revenue_minor > 0 and data.balance_change_pct < -0.1"
    confidence: 0.9
    impact_low: 0
    impact_high: 0
    reasoning_template: "Overdue payables, deferred revenue, and falling bank balance indicate cash pressure."
    actions: ["Prepare a short-term cash preservation plan"]
