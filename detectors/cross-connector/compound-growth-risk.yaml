id: compound-growth-risk
name: Compound growth risk
version: "2.0.0"
signal_types: [stripe.mrr_change, shopify.cart_abandonment_rate, xero.runway_days]
evidence_types: [stripe.mrr_change, shopify.cart_abandonment_rate, xero.runway_days]
industries: ["*"]
correlation: { window_hours: 72, require_all: true, min_evidence_count: 3 }
rules:
  - id: compound_growth_risk_high
    name: Compound growth risk is high
    condition: "data.mrr_change_pct < -0.05 and data.cart_abandonment_rate > 0.65 and data.runway_days < 60"
    confidence: 0.88
    impact_low: 0
    impact_high: 0
    reasoning_template: "MRR, cart conversion, and cash runway are deteriorating together."
    actions: ["Review growth and cash recovery plan"]
