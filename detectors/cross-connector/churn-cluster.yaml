id: churn-cluster
name: Churn cluster
version: "2.0.0"
signal_types: [stripe.subscription_cancellations, shopify.repeat_purchase_rate, xero.ar_concentration]
evidence_types: [stripe.subscription_cancellations, shopify.repeat_purchase_rate, xero.ar_concentration]
industries: ["*"]
correlation: { window_hours: 168, require_all: true, min_evidence_count: 3 }
rules:
  - id: churn_cluster
    name: Churn cluster detected
    condition: "data.cancellations_7d >= 3 and data.repeat_purchase_rate < 0.2 and data.top_customer_ar_share > 0.4"
    confidence: 0.87
    impact_low: 0
    impact_high: 0
    reasoning_template: "Cancellation clustering overlaps with weak repeat purchase and concentrated receivables."
    actions: ["Launch retention outreach for the affected cohort"]
