id: family_policy_review
name: Policy Register Hygiene Detection
description: >
  Reviews the family's policy register itself rather than coverage
  adequacy: duplicate policies of the same type covering the same person
  (which can be intentional, for example employer cover plus a personal
  policy), and policies still attributed to a member who is no longer on the family
  roster. These are record-keeping findings, not coverage judgments.
version: 1.0.0
signal_types:
  - family.policy_review
industries: ['family', 'insurance']

rules:
  - id: duplicate_policy_coverage
    name: Possible Duplicate Policy
    # One event per (type, holder) overlap group — the composite member_id
    # ("m_123:life" or "household:car") keeps each overlap's entity_key
    # distinct so dedup and stale-resolution stay per-pair.
    condition: 'data.overlap_count > 1'
    confidence: 0.7
    impact_low: 'data.overlap_monthly_premium_minor'
    impact_high: 'data.overlap_monthly_premium_minor * 12'
    reasoning_template: >
      {{data.overlap_count}} {{data.overlap_type}} policies appear on file for {{data.overlap_holder}}
      ({{data.overlap_providers}}), costing {{data.overlap_monthly_premium_minor}}/month combined. This can
      be intentional (for example, employer cover plus a personal policy), and the records on file cannot
      show which applies. This is informational only: your insurer or a licensed insurance professional
      can confirm what each policy covers.
    actions:
      - Check whether both policies are still active and what each one covers
      - Check each policy's start date, cover amount and renewal date against your own records
      - Ask your insurer or a licensed insurance professional what each policy covers — overlapping cover can be deliberate

  - id: policy_attributed_to_removed_member
    name: Policy Attributed To Someone No Longer On The Roster
    condition: 'data.orphaned_policy_count > 0'
    confidence: 0.7
    impact_low: 0
    impact_high: 0
    reasoning_template: >
      {{data.orphaned_policy_count}} policies on file are still attributed to a family member who is no
      longer on the roster: {{data.orphaned_policy_descriptions}}.
      The cover may still be real — only the attribution is stale — but member-level readiness and
      per-member insights can't see it until it's re-attributed.
    actions:
      - Re-assign the policy to the correct roster member, or remove it if the cover ended
      - If the member left the family, check whether the policy itself should still be on file

  - id: policy_renewal_date_in_past
    name: Renewal Date On File Has Passed
    # soonestPolicyRenewal only looks forward — a renewal_date in the past is
    # invisible without this rule. The record may be stale (the policy renewed
    # and nobody updated the date) or the cover may have lapsed; the register
    # cannot tell which, so this stays a record-keeping finding.
    condition: 'data.stale_renewal_count > 0'
    confidence: 0.8
    impact_low: 0
    impact_high: 'data.stale_renewal_monthly_premium_minor * 12'
    reasoning_template: >
      {{data.stale_renewal_count}} policies on file have a renewal date that has already passed:
      {{data.stale_renewal_descriptions}}. The cover may have renewed without the record being updated,
      or the policy may have ended — the record on file cannot show which. This is informational only:
      your insurer or a licensed insurance professional can confirm the policy's current status.
    actions:
      - Check each policy's documents or your insurer account for its current status
      - Update the renewal date on file if the policy renewed
      - Remove the policy from the register if the cover ended
      - If you are unsure whether the cover is still active, ask your insurer or a licensed insurance professional

  - id: premium_increased
    name: Recorded Premium Went Up
    # Intent 38: premium_history is appended whenever the recorded premium
    # changes — a policy renewing dearer every year is otherwise invisible.
    # Informational only: this describes the family's own recorded figures.
    # It must never name an alternative provider or suggest switching —
    # that's arranging, and stays out.
    condition: 'data.premium_increase_count > 0'
    confidence: 0.75
    impact_low: 0
    impact_high: 'data.premium_increase_annual_delta_minor'
    reasoning_template: >
      {{data.premium_increase_count}} recorded premiums on file went up by more than 5%:
      {{data.premium_increase_descriptions}}. This is informational only — it describes what is
      recorded in your register, not whether the new premium is competitive. Checking renewal
      documents and comparing quotes from multiple insurers are both reasonable next steps;
      a licensed insurance professional can advise on cover.
    actions:
      - Check the renewal documents for the reason given for the increase
      - If the premium rose at renewal, comparing quotes from multiple insurers is a reasonable next step
      - Update the recorded premium and renewal date if the register is out of date
      - A licensed insurance professional can advise on your cover

  - id: premium_possibly_stopped
    name: No Payment Recorded On File
    # Intent 88 / PRD-233: a premium can stop silently — a cancelled direct
    # debit or expired card — and the family finds out at claim time. The
    # register sees only that the last dated payment record is older than
    # the expected interval; it cannot know the policy's real status, so it
    # never says "lapsed" and never mentions a grace period (unconfirmed).
    condition: 'data.stale_payment_count > 0'
    confidence: 0.8
    impact_low: 0
    impact_high: 'data.stale_payment_monthly_premium_minor * 12'
    reasoning_template: >
      {{data.stale_payment_count}} policies on file have no payment recorded
      since {{data.stale_payment_since_date}}: {{data.stale_payment_descriptions}}.
      Check with your provider that cover is in force — the record on file
      cannot show whether it is. This is informational only.
    actions:
      - Check with your provider that each named policy is in force
      - If the payment record is simply out of date, update the premium history on file
      - If you are unsure whether the cover is still active, ask your insurer or a licensed insurance professional
  - id: nomination_none_on_file
    name: No Nomination On File
    # Intent 87 / PRD-234: a pension or life policy with no recorded
    # nomination is a factual gap in the household's own record — the flag
    # states what is missing, never who should be named.
    condition: 'data.no_nomination_count > 0'
    confidence: 0.8
    impact_low: 0
    impact_high: 0
    reasoning_template: >
      {{data.no_nomination_count}} life or income-protection policies on file have no
      nomination recorded: {{data.no_nomination_descriptions}}. Trustees or the
      scheme decide — check the scheme's rules; the provider's own form or page
      is where a nomination is recorded. This is informational only.
    actions:
      - Check the provider's own form or page for how nominations are recorded
      - Update the record on file once you know what the nomination says
      - A licensed insurance professional can explain what a nomination does

  - id: nomination_predates_new_child
    name: Nomination Recorded Before A Child Joined
    condition: 'data.new_child_after_nomination_count > 0'
    confidence: 0.75
    impact_low: 0
    impact_high: 0
    reasoning_template: >
      {{data.new_child_after_nomination_count}} nominations on file predate a
      child on the family record: {{data.new_child_after_nomination_descriptions}}.
      This states the dates on file — not what the nomination should say.
      Trustees or the scheme decide — check the scheme's rules.
    actions:
      - Check the provider's own form or page for the nomination on file
      - Update the record on file if the nomination has changed

  - id: nomination_names_ex_partner
    name: Nomination Names A Person Recorded As An Ex-Partner
    # Scoped to the nominating adult via member_id on the event — the flag
    # never reaches the other adult's view (Intent 82).
    condition: 'data.ex_partner_nomination_count > 0'
    confidence: 0.8
    impact_low: 0
    impact_high: 0
    reasoning_template: >
      {{data.ex_partner_nomination_count}} nominations on file name a person
      recorded as an ex-partner: {{data.ex_partner_nomination_descriptions}}.
      This states what the record says — not what it should say. Trustees or
      the scheme decide — check the scheme's rules.
    actions:
      - Check the provider's own form or page for the nomination on file
      - Update the record on file if the nomination has changed
