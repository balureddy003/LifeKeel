id: family_retirement_gap
name: Retirement Savings Gap Detection
description: >
  Projects whether a family's current retirement savings trajectory is on track
  to meet their target retirement age and income. Compares pension balance,
  contribution rate, and expected growth against the projected need, surfacing
  gaps early enough to adjust contributions.
version: 1.0.0
signal_types:
  - family.pension
  - family.retirement_target
  - family.savings_rate
industries: ["family", "retirement", "wealth"]

rules:
  - id: retirement_behind_target_age
    name: Retirement Savings Behind Target Age
    # Gated to only fire when closing the gap via contributions alone is a
    # realistic single lever (needed increase under half of monthly income).
    # Above that, retirement_gap_unaffordable_by_contributions below fires
    # instead — verified against a real near-retiree scenario this session
    # where this rule's old, ungated version suggested increasing monthly
    # contributions by an amount larger than the household's entire income.
    # PRD-106: this same gate also structurally excludes anyone already at
    # or past target_retirement_age — projectRetirement() sets
    # additional_monthly_contribution_needed_minor to a sentinel
    # (Number.MAX_SAFE_INTEGER) for that population specifically so this
    # condition can never be true for them, no explicit age check needed
    # here. Confirmed live: a retired 70-year-old previously got "your
    # projected retirement age is approximately 130... increasing monthly
    # contributions by £0.00 could close the gap" from this rule.
    condition: >
      data.projected_retirement_age > data.target_retirement_age and
      data.pension_balance_minor > 0 and
      data.additional_monthly_contribution_needed_minor <= data.monthly_salary_minor * 0.5
    confidence: 0.76
    impact_low: "data.additional_monthly_contribution_needed_minor * 12 * (data.target_retirement_age - data.current_age)"
    impact_high: "data.additional_monthly_contribution_needed_minor * 12 * (data.target_retirement_age - data.current_age) * 1.3"
    reasoning_template: >
      Based on the data you entered, your projected retirement age is approximately {{data.projected_retirement_age}},
      compared to your target of {{data.target_retirement_age}}. One projection suggests that increasing monthly
      contributions by {{data.additional_monthly_contribution_needed_minor}} could close the gap. These are
      estimates and not guaranteed — please consult a qualified financial professional.
    actions:
      - Review your current pension contribution rate and consider whether an increase is feasible
      - Research tax-advantaged retirement savings options in your country
      - Consider consulting a financial advisor about your retirement plan

  - id: retirement_gap_unaffordable_by_contributions
    name: Retirement Gap Too Large For Contributions Alone
    # The complement of retirement_behind_target_age's gate — same underlying
    # gap, but here "just contribute more" isn't a realistic single fix.
    # Two branches: pre-target-age (same as before — projected retirement
    # age has slipped past target and the needed contribution increase
    # isn't realistic), or PRD-106's past-target-age case (current_age >=
    # target_retirement_age, where additional_monthly_contribution_needed_minor
    # is a sentinel — see projectRetirement in family-financial-profile.ts —
    # so this branch checks achievable_retirement_income_minor against the
    # target directly instead: a genuine shortfall in what today's balance
    # can sustain, not "any balance below infinity"). Confirmed live: a
    # retired 70-year-old with a real shortfall previously got a literal
    # "your projected retirement age is approximately 130" from the other
    # rule; a 63-year-old severe pre-target gap got "retire around age
    # 111" from this rule's own old copy — both fixed by dropping every
    # age reference from the template below, which reads correctly for
    # either branch without needing to know which one fired.
    condition: >
      data.pension_balance_minor > 0 and (
        (data.current_age < data.target_retirement_age and
         data.projected_retirement_age > data.target_retirement_age and
         data.additional_monthly_contribution_needed_minor > data.monthly_salary_minor * 0.5)
        or
        (data.current_age >= data.target_retirement_age and
         data.achievable_retirement_income_minor < data.target_retirement_income_minor)
      )
    confidence: 0.76
    impact_low: "(data.target_retirement_income_minor - data.achievable_retirement_income_minor) * 10"
    impact_high: "(data.target_retirement_income_minor - data.achievable_retirement_income_minor) * 25"
    reasoning_template: >
      Based on the data you entered, your pension trajectory falls short of your target — it could sustain roughly
      {{data.achievable_retirement_income_minor}} a year instead of your {{data.target_retirement_income_minor}}
      target, and closing that gap through higher contributions alone would need more than half your monthly
      income, not a realistic single fix. Two paths worth considering: delaying when you start drawing on this
      money, or adjusting your target income. These are estimates, not guarantees — a financial professional can
      help weigh which trade-off fits your family.
    actions:
      - Consider whether delaying retirement by a few years is workable for your family
      - Consider whether a lower target retirement income is workable
      - Consult a financial advisor about which trade-off fits your family's plans

  - id: no_retirement_savings
    name: No Retirement Savings Listed
    condition: "data.pension_balance_minor == 0 and data.current_age >= 25"
    confidence: 0.84
    impact_low: "data.target_retirement_income_minor * 12 * (data.target_retirement_age - data.current_age) * 0.15"
    impact_high: "data.target_retirement_income_minor * 12 * (data.target_retirement_age - data.current_age) * 0.25"
    reasoning_template: >
      No retirement savings are listed in your family profile. With approximately {{data.target_retirement_age - data.current_age}}
      years until your target retirement age, starting now could give more time for compound growth. This is informational
      only — please consult a qualified financial professional before making decisions.
    actions:
      - Research pension and retirement savings options available in your country
      - Consider setting up a regular monthly contribution to a retirement account
      - Consult a financial advisor about an appropriate retirement savings strategy
