id: social_engagement_drop
name: "Social Engagement — Sustained Drop"
description: "Detects when engagement rate has been declining consistently using CUSUM change-point detection."
version: "1.0.0"
signal_types:
  - social.post.performance
industries:
  - "*"

rules:
  - id: engagement_cusum_down
    name: "Engagement rate declining (CUSUM alarm)"
    condition: "data.engagement_rate > 0"
    cusum:
      field: data.engagement_rate
      direction: down
      slack: 0.5
      threshold: 4.0
      min_observations: 7
    confidence: 0.82
    impact_low: 0
    impact_high: 0
    reasoning_template: |
      Your {{data.platform}} engagement rate has been trending downward for several posts.
      Latest: {{data.engagement_rate}} (Likes: {{data.likes}}, Comments: {{data.comments}}).
      Common causes: posting at wrong times, content fatigue, algorithm changes.
    actions:
      - "Review content mix — vary topics and formats"
      - "Check posting schedule vs audience peak hours"
      - "Try a question or poll to re-engage followers"
    dedup_window_ms: 86400000

  - id: zero_engagement
    name: "Post received zero engagement"
    condition: "data.impressions > 100 and data.engagement_rate == 0"
    confidence: 0.79
    impact_low: 0
    impact_high: 0
    reasoning_template: |
      Your {{data.platform}} post with {{data.impressions}} impressions received no engagement.
      This suggests the content or hook is not resonating with your audience.
    actions:
      - "Review post content and headline"
      - "Test different post formats (carousel, video, question)"
    dedup_window_ms: 3600000
