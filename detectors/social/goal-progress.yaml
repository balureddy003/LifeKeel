id: social_goal_progress
name: "Social Goal — Progress Tracker"
description: "Fires insights when social media goal progress is behind pace, on track, or achieved. Requires GoalStore KPI snapshots."
version: "1.1.0"
signal_types:
  - social.post.performance
  - goal.kpi.updated
industries:
  - "*"
category: goal_progress

rules:
  - id: goal_stalled
    name: "Goal has made no progress yet — pace can't be projected"
    condition: "data.days_elapsed >= 1 and data.pace_per_day <= 0 and data.pct_complete < 1.0"
    confidence: 0.84
    impact_low: 0
    impact_high: 0
    reasoning_template: |
      Your goal "{{data.goal_name}}" hasn't shown any progress yet.
      {{data.pct_time_elapsed_percent}}% of the timeline has elapsed with 0% complete.
      {{data.days_remaining}} days remain to reach {{data.target_display}} — at this pace it won't be reached in time.
    actions:
      - "Increase activity pace until the goal is back on track"
      - "Review content mix — prioritise high-engagement angles"
      - "Consider promoted posts to accelerate reach"
    dedup_window_ms: 86400000

  - id: goal_behind_pace
    name: "Goal is behind pace — intervention needed"
    condition: "data.days_elapsed >= 1 and data.pace_per_day > 0 and data.pct_complete < data.pct_time_elapsed * 0.75"
    confidence: 0.84
    impact_low: 0
    impact_high: 0
    reasoning_template: |
      Your goal "{{data.goal_name}}" is behind pace.
      Progress: {{data.pct_complete_percent}}% complete with {{data.pct_time_elapsed_percent}}% of time elapsed.
      At current pace you will finish in {{data.projected_days}} days (target: {{data.timeline_days}} days).
      You need {{data.required_pace_multiplier}}× pace to catch up.
      {{data.days_remaining}} days remaining to reach {{data.target_display}}.
    actions:
      - "Increase activity pace until the goal is back on track"
      - "Review content mix — prioritise high-engagement angles"
      - "Consider promoted posts to accelerate reach"
    dedup_window_ms: 86400000

  - id: goal_on_track
    name: "Goal is on track — maintain current approach"
    condition: "data.days_elapsed >= 1 and data.pct_complete >= data.pct_time_elapsed * 0.9 and data.pct_complete < 1.0 and data.projected_days >= data.timeline_days * 0.7"
    confidence: 0.78
    impact_low: 0
    impact_high: 0
    reasoning_template: |
      Goal "{{data.goal_name}}" is on track.
      {{data.pct_complete_percent}}% complete with {{data.pct_time_elapsed_percent}}% of time used.
      Current pace: {{data.pace_per_day}} per day.
    actions:
      - "Continue current posting strategy"
    dedup_window_ms: 604800000

  - id: goal_ahead_of_pace
    name: "Goal is ahead of pace — raise the target"
    condition: "data.days_elapsed >= 1 and data.projected_days < data.timeline_days * 0.7 and data.pct_complete < 1.0"
    confidence: 0.80
    impact_low: 0
    impact_high: 0
    reasoning_template: |
      Goal "{{data.goal_name}}" is ahead of pace — on track to complete {{data.days_early}} days early.
      Consider raising the target from {{data.target_display}} to {{data.suggested_new_target_display}}.
    actions:
      - "Review and raise goal target"
      - "Replicate what's working across other channels"
    dedup_window_ms: 604800000

  - id: goal_achieved
    name: "Goal achieved!"
    condition: "data.pct_complete >= 1.0"
    confidence: 0.97
    impact_low: 0
    impact_high: 0
    reasoning_template: |
      🎉 Goal achieved: "{{data.goal_name}}"
      Reached {{data.current_display}} — target was {{data.target_display}}.
      Completed in {{data.days_elapsed}} days (target: {{data.timeline_days}} days).
    actions:
      - "Set a new, more ambitious goal"
      - "Share the milestone publicly"
    dedup_window_ms: 2592000000
