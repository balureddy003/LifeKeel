id: cart_abandonment_recovery
name: Cart Abandonment Recovery
description: >
  Detects high-value abandoned carts and surfaces targeted recovery opportunities
  with personalised incentive recommendations.
version: 1.0.0
signal_types:
  - cart.abandoned
  - session.ended
industries: ["ecommerce", "retail", "marketplace"]

rules:
  - id: high_value_cart_abandoned
    name: High-Value Cart Abandoned
    condition: >
      data.cart_value_minor >= 5000 and
      data.hours_since_abandoned >= 1 and
      data.hours_since_abandoned <= 24
    confidence: 0.87
    impact_low: "data.cart_value_minor * 0.15"
    impact_high: "data.cart_value_minor * 0.45"
    reasoning_template: >
      Cart worth {{data.cart_value_minor}} abandoned
      {{data.hours_since_abandoned}} hours ago. Recovery email within 1–3 hours
      achieves 45% conversion. Discount should not exceed 10% of cart value.
    actions:
      - Send recovery email with cart link (no discount — 1h window)
      - Send follow-up with 5% discount (6h window)
      - Final follow-up with 10% discount (24h window)
    dedup_window_ms: 86400000

  - id: repeat_abandoner
    name: Repeat Cart Abandoner
    condition: >
      data.abandoned_carts_30d >= 3 and
      data.cart_value_minor >= 2000
    confidence: 0.81
    impact_low: "data.avg_cart_value_minor * 0.2"
    impact_high: "data.avg_cart_value_minor * 0.5"
    reasoning_template: >
      Customer has abandoned {{data.abandoned_carts_30d}} carts in past 30 days.
      Average cart value: {{data.avg_cart_value_minor}}.
      Likely friction point: checkout UX or payment method availability.
    actions:
      - Offer guest checkout option
      - Add alternative payment methods prompt
      - Trigger UX review for this customer segment
    state_enabled: true
    window_size: 3
    window_duration_ms: 2592000000
