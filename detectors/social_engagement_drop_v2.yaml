id: social_engagement_drop_v2
name: "Social Engagement Drop v2"
description: "Fires when any platform engagement drops below threshold"
version: "2.0.0"
signal_types:
  - social.analytics.daily
  - social.post.published
rules:
  - id: low_engagement
    name: "Low engagement rate"
    condition: "engagement_rate < 0.02"
    confidence: 0.8
    urgency: high
    category: marketing
    impact_low: 1000
    impact_high: 5000
    reasoning_template: |
      Engagement rate is below the minimum acceptable threshold of 2%.
    actions:
      - "Review recent content quality"
      - "Post at peak hours"
  - id: very_low_impressions
    name: "Very low impressions"
    condition: "impressions < 500"
    confidence: 0.7
    urgency: medium
    category: marketing
    impact_low: 500
    impact_high: 2000
    reasoning_template: |
      Impressions are critically low — content is not being distributed.
    actions:
      - "Check platform algorithm changes"
      - "Boost post"
