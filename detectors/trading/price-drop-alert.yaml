id: trading_price_drop_alert
name: Price Drop Alert
description: >
  Flags when a held position drops more than 5% below its average purchase price,
  signalling a potential breach of the user's risk rule.
version: 1.0.0
signal_types:
  - portfolio_position
industries:
  - investment
  - wealth

rules:
  - id: severe_price_drop
    name: Severe drop below average (15%+)
    condition: data.current_price < data.avg_price * (1 - 15 / 100)
    confidence: 0.85
    # Suppress if the price is recovering (current > 3% above recent low).
    # Severe drops that are already bouncing back are not actionable — the
    # user should have sold before the bounce, not after.
    suppress_if: data.is_recovering == 1 and data.recovery_pct > 5
    # 3-day dedup — severe drops are high-priority but re-firing every sync
    # cycle (every 15 min) creates noise. 3 days is enough for the user to act.
    dedup_window_ms: 259200000
    impact_low: 0
    impact_high: "(data.avg_price - data.current_price) * data.quantity"
    reasoning_template: >
      {{data.ticker}} is at £{{data.current_price_gbp}} vs your average of
      £{{data.avg_price_gbp}}, a severe drop of more than 15%. This is beyond
      normal volatility and likely indicates a fundamental issue.
    actions:
      - Consider selling to cut the loss — severe drops often continue
      - Paper-trade the decision before any live action
    alternatives_template:
      - label: "Sell {{data.quantity}} shares of {{data.ticker}} — cut the loss"
        why_not: "Stops further downside immediately. Severe drops (15%+) are often driven by fundamental issues and tend to persist."
        forecast_low: "(data.avg_price - data.current_price) * data.quantity"
        forecast_high: "(data.avg_price - data.current_price) * data.quantity"
      - label: "Hold and set a hard stop at -5% from current price"
        why_not: "Gives a small window for recovery while capping downside, but a gap-down below the stop still incurs slippage."
        forecast_low: "(data.avg_price - data.current_price) * data.quantity * 1.2"
        forecast_high: "0"
      - label: "Trim half — reduce exposure while keeping a recovery position"
        why_not: "Halves the downside risk while retaining some upside if the stock recovers."
        forecast_low: "(data.avg_price - data.current_price) * data.quantity * 0.5"
        forecast_high: "(data.current_price - data.avg_price) * data.quantity * 0.5"
    risk_template: >
      {{data.ticker}} is down more than 15% from your average. A drop of this
      magnitude is rarely just market noise — it typically reflects a
      fundamental issue (earnings miss, sector downgrade, company-specific news).
      The position is likely to fall further unless there is a clear catalyst
      for recovery.
    exit_criteria_template: >
      Auto-archive when {{data.ticker}} recovers above the
      {{context.goal_kpi_targets.price_drop_alert_threshold_pct}}% threshold
      (i.e. current_price >= avg_price * (1 - threshold/100)) or when the
      position is closed.

  - id: moderate_price_drop
    name: Moderate drop below the goal's threshold
    condition: data.current_price < data.avg_price * (1 - context.goal_kpi_targets.price_drop_alert_threshold_pct / 100) and data.current_price >= data.avg_price * (1 - 15 / 100)
    confidence: 0.70
    impact_low: 0
    impact_high: "(data.avg_price - data.current_price) * data.quantity"
    reasoning_template: >
      {{data.ticker}} is at £{{data.current_price_gbp}} vs your average of
      £{{data.avg_price_gbp}}, a drop beyond the {{context.goal_kpi_targets.price_drop_alert_threshold_pct}}%
      rule threshold but within normal volatility range (under 15%).
    actions:
      - Review the position — moderate drops may recover
      - Consider setting a stop-loss rather than selling immediately
    alternatives_template:
      - label: "Hold and set a hard stop at -10% from current price"
        why_not: "Gives the position room to recover while capping downside. Moderate drops often recover if the thesis is intact."
        forecast_low: "(data.avg_price - data.current_price) * data.quantity * 1.5"
        forecast_high: "0"
      - label: "Sell {{data.quantity}} shares of {{data.ticker}} — cut the loss"
        why_not: "Stops further downside, but may be premature for a moderate drop that could recover."
        forecast_low: "(data.avg_price - data.current_price) * data.quantity"
        forecast_high: "(data.avg_price - data.current_price) * data.quantity"
      - label: "Average down — buy {{data.quantity}} more at current price"
        why_not: "Lowers the break-even, but doubles exposure to a position that is already underperforming."
        forecast_low: "(data.avg_price - data.current_price) * data.quantity * 2"
        forecast_high: "(data.current_price - data.avg_price) * data.quantity * 2"
    risk_template: >
      {{data.ticker}} is down {{data.drop_pct}}% from your average. If the drop is
      driven by a fundamental issue (earnings miss, sector downgrade), the position
      is likely to fall further. If it is market-wide volatility, the position may
      recover, but your capital is at risk in the meantime.
    exit_criteria_template: >
      Auto-archive when {{data.ticker}} recovers above the
      {{context.goal_kpi_targets.price_drop_alert_threshold_pct}}% threshold
      (i.e. current_price >= avg_price * (1 - threshold/100)) or when the
      position is closed.
