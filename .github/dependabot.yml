version: 2
# Fewer, grouped PRs: each Dependabot PR costs a full CI run. Minor and patch updates arrive as one
# PR per ecosystem; major versions are ignored here and upgraded by hand as planned migrations
# (a bare major bump of TypeScript, Vite, jsdom or React fails CI and costs a run for nothing).
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    groups:
      next:
        patterns:
          - 'next'
          - 'eslint-config-next'
      minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns:
          - '*'
  # R31: digest-pinned base images (apps/api/Dockerfile, infra/*) get update PRs.
  - package-ecosystem: 'docker'
    directory: '/apps/api'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 1
    # Node 25+ no longer ships corepack, which this image uses to install pnpm, and CI tests on Node 22.
    # A Node major bump is a deliberate change, not an automatic one.
    ignore:
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
