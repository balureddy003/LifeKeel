name: Images

# Builds the container images WITHOUT pushing them, so a broken Dockerfile or a missing system
# package fails a PR instead of the first deploy. Path-filtered (the builds are heavy), run weekly
# to catch base-image drift, and runnable by hand.

on:
  pull_request:
    paths:
      - 'apps/api/Dockerfile'
      - 'apps/api/package.json'
      - 'infra/**'
      - 'scripts/boot-smoke.sh'
      - '.github/workflows/images.yml'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-image:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: agentoak-api:ci
          cache-from: type=gha,scope=api-image
          cache-to: type=gha,mode=max,scope=api-image
      - name: Tesseract is installed (local document OCR depends on it)
        run: docker run --rm --entrypoint tesseract agentoak-api:ci --version
      - name: Boot the image with deploy-like (empty) variables
        run: SMOKE_IMAGE=agentoak-api:ci MONGODB_URL=mongodb://127.0.0.1:27017 REDIS_URL=redis://127.0.0.1:6379 scripts/boot-smoke.sh

  local-judge-image:
    runs-on: ubuntu-latest
    steps:
      # The Ollama base image alone is ~4 GB unpacked and `load: true` stores it twice (buildx cache
      # plus the Docker image store); the default runner runs out of disk. Drop preinstalled toolchains
      # this job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # A tiny model keeps CI fast: this checks the Dockerfile and the bake mechanics, not model quality.
      - name: Build the Ollama image with a small model baked in
        uses: docker/build-push-action@v7
        with:
          context: infra/local-judge
          file: infra/local-judge/Dockerfile
          load: true
          build-args: MODEL=qwen2.5:0.5b
          tags: agentoak-local-judge:ci
      - name: The baked-in model is present and the server answers offline
        run: |
          docker run -d --name judge -p 11434:11434 agentoak-local-judge:ci
          for i in $(seq 1 60); do curl -sf localhost:11434/api/version && break; sleep 2; done
          curl -sf localhost:11434/api/tags | tee /dev/stderr | grep -q 'qwen2.5:0.5b' || { docker logs judge; exit 1; }

  encoder-image:
    runs-on: ubuntu-latest
    steps:
      # The Ollama base image alone is ~4 GB unpacked and `load: true` stores it twice (buildx cache
      # plus the Docker image store); the default runner runs out of disk. Drop preinstalled toolchains
      # this job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # BAKE_MODEL=false skips the ~1.7 GB model; the build still installs and IMPORTS gliner2, which is
      # what catches an undeclared dependency.
      - name: Build the encoder image (dependencies only)
        uses: docker/build-push-action@v7
        with:
          context: infra/encoder-service
          file: infra/encoder-service/Dockerfile
          load: true
          build-args: BAKE_MODEL=false
          tags: agentoak-encoder:ci
          cache-from: type=gha,scope=encoder-image
          cache-to: type=gha,mode=max,scope=encoder-image
      - name: Request-handling tests inside the real image
        run: docker run --rm -v "$PWD/infra/encoder-service:/t" -w /t agentoak-encoder:ci python -m unittest test_server -v
