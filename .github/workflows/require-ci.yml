name: Require green CI (reusable)

# Called by every deploy workflow. Resolves the requested ref to one immutable
# SHA, then refuses unless (1) that SHA is in main's history, (2) the CI
# workflow succeeded on it, and (3) its production dependencies pass the
# high-severity audit (R30: the PR-time Security run covered the PR head,
# not this merge commit, and advisories land without code changes). Deploys then check out the SHA, not the moving ref,
# so what was verified is exactly what ships.
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    outputs:
      sha:
        description: Verified commit SHA (only set once every gate below passed)
        value: ${{ jobs.gate.outputs.sha }}

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      REF: ${{ inputs.ref }}
    steps:
      - id: resolve
        run: |
          sha=$(gh api "repos/$REPO/commits/$REF" --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved $REF -> $sha"
      - name: SHA must be on main
        run: |
          status=$(gh api "repos/$REPO/compare/main...${{ steps.resolve.outputs.sha }}" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::${{ steps.resolve.outputs.sha }} is not in main's history (compare status: $status). Merge via PR first."
            exit 1
          fi
      - name: CI must have passed on this SHA
        run: |
          n=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=${{ steps.resolve.outputs.sha }}&status=success" --jq .total_count)
          if [ "$n" -lt 1 ]; then
            echo "::error::No successful CI run for ${{ steps.resolve.outputs.sha }}. Wait for CI or fix it before deploying."
            exit 1
          fi

  dependency-audit:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: No high or critical advisories in production dependencies
        run: pnpm audit --prod --audit-level=high

  gate:
    needs: [verify, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sha: ${{ needs.verify.outputs.sha }}
    steps:
      - run: echo "Release gates passed for ${{ needs.verify.outputs.sha }}"
