name: Security

# Cheap checks (audit, gitleaks) run on every PR. CodeQL is ~4 of the ~5 minutes a PR push used to cost
# and its results are not uploaded (code scanning is not enabled), so it runs weekly and on demand
# instead. No push-to-main trigger: the PR run already covered those commits.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: '0 6 * * 1' # weekly: new advisories land without code changes
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-audit:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Production deps only; fail on high/critical. Dev-tool advisories are
      # handled by Dependabot rather than blocking merges.
      # Baseline was cleaned via root package.json pnpm.overrides. If a new high
      # advisory has no patched release yet, add a documented override or
      # temporary exception here rather than silencing the job.
      - run: pnpm audit --prod --audit-level=high

  secret-scan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # gitleaks-action lists PR commits via the API; without this it 403s
      # with "Resource not accessible by integration".
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript
      # Code scanning is not enabled on this repo, so uploading results fails the job.
      # Keep the SARIF as a workflow artifact instead. To get alerts in the Security tab,
      # enable code scanning in repo settings, then remove `upload: never` and the artifact step.
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          upload: never
          output: codeql-results
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codeql-sarif
          path: codeql-results
      # R30: high-confidence findings are actionable, not just archived.
      # Fails on any result whose rule has security-severity >= 7.0 (high
      # or critical); the SARIF artifact above names them.
      - name: Fail on high or critical CodeQL findings
        if: always()
        run: |
          high=$(jq '[.runs[] as $r | $r.results[]? as $res
            | ($r.tool.driver.rules[]? | select(.id == $res.ruleId)
               | (.properties["security-severity"] // "0") | tonumber)
            | select(. >= 7)] | length' codeql-results/*.sarif | awk '{s+=$1} END {print s+0}')
          echo "High/critical CodeQL findings: $high"
          [ "$high" -eq 0 ]
