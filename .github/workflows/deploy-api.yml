name: Deploy API

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to deploy'
        type: string
        required: true
        default: 'main'

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  # Full Artifact Registry image prefix: <region>-docker.pkg.dev/<project>/<repo>
  ARTIFACT_REGISTRY: ${{ secrets.GCP_ARTIFACT_REGISTRY || format('{0}-docker.pkg.dev/{1}/agentoak-docker', secrets.GCP_REGION || 'us-central1', secrets.GCP_PROJECT_ID) }}
  REGISTRY_HOST: ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev
  API_IMAGE: ${{ secrets.GCP_ARTIFACT_REGISTRY || format('{0}-docker.pkg.dev/{1}/agentoak-docker', secrets.GCP_REGION || 'us-central1', secrets.GCP_PROJECT_ID) }}/api
  API_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE_NAME || 'agentoak-api' }}

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY_HOST }} --quiet

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.API_SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.API_IMAGE }}:${{ github.sha }}
          flags: --port=3001 --allow-unauthenticated --cpu=1 --memory=512Mi --max-instances=4 --concurrency=80 --min-instances=0
          env_vars: |
            NODE_ENV=production
            KAIROS_DEPLOYMENT_MODE=cloud
            CORS_ORIGIN=${{ vars.AGENT_OAK_URL || secrets.AGENT_OAK_URL }}
            LOG_LEVEL=info
            AGENT_OAK_URL=${{ vars.AGENT_OAK_URL || secrets.AGENT_OAK_URL }}
            API_BASE_URL=${{ vars.API_BASE_URL }}
          secrets: |
            MONGODB_URL=agentoak-mongodb-url:latest
            REDIS_URL=agentoak-redis-url:latest
            JWT_SECRET=agentoak-jwt-secret:latest
            SETTINGS_ENCRYPTION_KEY=agentoak-settings-encryption-key:latest
            GOOGLE_CLIENT_ID=agentoak-google-client-id:latest
            GOOGLE_CLIENT_SECRET=agentoak-google-client-secret:latest
            STRIPE_SECRET_KEY=agentoak-stripe-secret-key:latest
            KAIROS_STRIPE_WEBHOOK_SECRET=agentoak-stripe-webhook-secret:latest
            OPENAI_API_KEY=agentoak-openai-api-key:latest
            # Web push — without these, /push/vapid-key 503s and no browser
            # can subscribe. Create in Secret Manager from one `npx web-push
            # generate-vapid-keys` run before the next deploy.
            VAPID_PUBLIC_KEY=agentoak-vapid-public-key:latest
            VAPID_PRIVATE_KEY=agentoak-vapid-private-key:latest
            VAPID_SUBJECT=agentoak-vapid-subject:latest
          secrets_update_strategy: overwrite

      - name: Smoke test new revision
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Smoke testing $SERVICE_URL/health/ready"
          STATUS="000"
          for i in $(seq 1 18); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$SERVICE_URL/health/ready" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Smoke test passed (HTTP 200)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS, waiting..."
            sleep 5
          done
          if [ "$STATUS" != "200" ]; then
            echo "::error::Smoke test failed (last status: $STATUS)."
            echo "::error::To roll back: gcloud run services update-traffic ${{ env.API_SERVICE }} --to-revisions PREV_REVISION=100 --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT_ID }}"
            exit 1
          fi
          echo "Smoke test passed — new revision is healthy and serving traffic"
