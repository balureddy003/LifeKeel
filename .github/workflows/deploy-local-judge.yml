name: Deploy local judge (self-hosted model service)

# Manual, like deploy-api.yml. NOT yet run end to end: build, deploy and eval this once
# and watch it before relying on it. See infra/local-judge/README.md.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to deploy'
        type: string
        required: true
        default: 'main'
      model:
        description: 'Ollama model baked into the image (do not go below 3b: 1.5b approved unsafe copy in testing)'
        type: string
        required: true
        default: 'qwen2.5:7b'
      min_instances:
        description: 'Always-on instances. 1 avoids ~30s+ cold starts but is a standing cost; 0 scales to zero.'
        type: string
        required: true
        default: '1'
      max_instances:
        description: 'Upper bound; each instance serves one call at a time, so this is the parallel-call ceiling.'
        type: string
        required: true
        default: '2'
      run_eval:
        description: 'Run the model eval against the deployed service and fail on a gate failure'
        type: boolean
        required: true
        default: true

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'us-central1' }}
  REGISTRY_HOST: ${{ secrets.GCP_REGION || 'us-central1' }}-docker.pkg.dev
  JUDGE_IMAGE: ${{ secrets.GCP_ARTIFACT_REGISTRY || format('{0}-docker.pkg.dev/{1}/lifekeel-docker', secrets.GCP_REGION || 'us-central1', secrets.GCP_PROJECT_ID) }}/local-judge
  JUDGE_SERVICE: ${{ secrets.LOCAL_JUDGE_SERVICE_NAME || 'lifekeel-local-judge' }}
  # Runtime service account of the API service; it is granted run.invoker on this service.
  API_RUNTIME_SA: ${{ secrets.API_RUNTIME_SERVICE_ACCOUNT }}

jobs:
  # Fails loudly when dispatched from a branch other than main (stops accidents; a writer can still edit this
  # file on their own branch, see docs/sdlc/status.md G10).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deploys run from main only
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (got $REF). Choose 'Use workflow from: main'; put the commit to deploy in the ref input."
            exit 1
          fi

  verify-ci:
    needs: guard
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/require-ci.yml
    with:
      ref: ${{ github.event.inputs.ref || 'main' }}

  deploy-local-judge:
    needs: verify-ci
    # Required reviewers are configured on this GitHub Environment (Settings >
    # Environments > production); the job pauses here until a person approves.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}

      - name: Require the API runtime service account
        run: |
          if [ -z "$API_RUNTIME_SA" ]; then
            echo "::error::Set the API_RUNTIME_SERVICE_ACCOUNT secret. The service is deployed without public access, so the API's service account needs run.invoker."
            exit 1
          fi

      - name: Refuse models below 3b
        run: |
          case "${{ github.event.inputs.model }}" in
            *:0.5b|*:1b|*:1.5b|*:1.1b) echo "::error::Models below 3b approved unsafe copy in testing (see infra/local-judge/README.md)."; exit 1 ;;
          esac

      - name: Authenticate to Google Cloud (workload identity)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        # R31: keyless workload identity federation when the repo Variables
        # GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DEPLOY_SERVICE_ACCOUNT are set; the long-lived
        # JSON key is only a fallback until they are, then delete the secret.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Authenticate to Google Cloud (service-account key fallback)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Warn when deploying with a long-lived key
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        run: echo "::warning::Deploy authenticated with a long-lived service-account key. Configure GCP_WORKLOAD_IDENTITY_PROVIDER and remove the key."

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY_HOST }} --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push the model image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: infra/local-judge
          file: infra/local-judge/Dockerfile
          push: true
          build-args: |
            MODEL=${{ github.event.inputs.model }}
          tags: |
            ${{ env.JUDGE_IMAGE }}:${{ github.sha }}
            ${{ env.JUDGE_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # No public access: Cloud Run itself rejects any request without a Google identity
      # token for this service, which replaces an auth proxy (Ollama has no auth of its own).
      # concurrency=1: parallel calls to one CPU model only add latency (measured).
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "$JUDGE_SERVICE" \
            --image "$JUDGE_IMAGE:${{ github.sha }}" \
            --region "$GCP_REGION" \
            --port 11434 \
            --cpu 4 --memory 16Gi \
            --no-cpu-throttling \
            --concurrency 1 \
            --timeout 300 \
            --min-instances "${{ github.event.inputs.min_instances }}" \
            --max-instances "${{ github.event.inputs.max_instances }}" \
            --no-allow-unauthenticated
          URL=$(gcloud run services describe "$JUDGE_SERVICE" --region "$GCP_REGION" --format 'value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Allow the API service account to call it
        run: |
          gcloud run services add-iam-policy-binding "$JUDGE_SERVICE" \
            --region "$GCP_REGION" \
            --member "serviceAccount:$API_RUNTIME_SA" \
            --role roles/run.invoker

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: ${{ github.event.inputs.run_eval == 'true' }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: ${{ github.event.inputs.run_eval == 'true' }}
        with:
          node-version: 22
          cache: pnpm

      - name: Run the model eval against the deployed service
        if: ${{ github.event.inputs.run_eval == 'true' }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec turbo run build --filter=@lifekeel/api
          # Audience is the service URL, matching what the API itself sends (cloud-run-auth.ts).
          TOKEN=$(gcloud auth print-identity-token --audiences="${{ steps.deploy.outputs.url }}")
          # Fail the job if a gate fails. The new revision is already serving, so a failure means: roll back.
          LOCAL_JUDGE_BASE_URL="${{ steps.deploy.outputs.url }}" \
          LOCAL_JUDGE_MODEL="${{ github.event.inputs.model }}" \
          LOCAL_JUDGE_BEARER="$TOKEN" \
          node apps/api/dist/eval/local-model-eval.js || {
            echo "::error::Model eval failed its gates. Roll back: gcloud run services update-traffic $JUDGE_SERVICE --to-revisions PREV_REVISION=100 --region $GCP_REGION --project $GCP_PROJECT_ID"
            exit 1
          }
