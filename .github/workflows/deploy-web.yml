name: Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to deploy'
        type: string
        required: true
        default: 'main'
      same_origin_api:
        description: 'Route API calls via the Hosting /api rewrite instead of the Cloud Run URL'
        type: boolean
        required: false
        default: true

# One deploy at a time; never cancel a deploy mid-flight.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  # Fails loudly when dispatched from a branch other than main (stops accidents; a writer can still edit this
  # file on their own branch, see docs/sdlc/status.md G10).
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deploys run from main only
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (got $REF). Choose 'Use workflow from: main'; put the commit to deploy in the ref input."
            exit 1
          fi

  verify-ci:
    needs: guard
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/require-ci.yml
    with:
      ref: ${{ github.event.inputs.ref || 'main' }}

  deploy:
    needs: verify-ci
    # Required reviewers are configured on this GitHub Environment (Settings >
    # Environments > production); the job pauses here until a person approves.
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN || secrets.NEXT_PUBLIC_SENTRY_DSN }}
      # Cloudflare Turnstile site key — public by design. Empty = no widget
      # (only valid while the API runs TURNSTILE_MODE=off).
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID || secrets.FIREBASE_PROJECT_ID || 'dyocense-502208' }}
      # RFC 9116 security.txt contact — override via repo Variable; the
      # build skips the file entirely when this is empty, so keep the
      # conventional inbox set unless a better endpoint exists.
      NEXT_PUBLIC_SECURITY_CONTACT: ${{ vars.NEXT_PUBLIC_SECURITY_CONTACT || 'security@lifekeel.co.uk' }}
      # Docked Keel assistant panel — 'on' replaces the full-page /assistant
      # in production; set the repo Variable to 'off' to roll back.
      NEXT_PUBLIC_KEEL_PANEL: ${{ vars.NEXT_PUBLIC_KEEL_PANEL || 'on' }}
    steps:
      - name: Check NEXT_PUBLIC_API_URL
        run: |
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            echo "✗ NEXT_PUBLIC_API_URL must be set as a GitHub Variable (or Secret) before deploying."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lifekeel/web run build:export
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SAME_ORIGIN_API: ${{ github.event.inputs.same_origin_api == 'true' && '1' || '' }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ env.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ env.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_KEEL_PANEL: ${{ env.NEXT_PUBLIC_KEEL_PANEL }}

      # The CSP (script-src 'self') blocks the inline <script> bodies Next.js
      # emits for hydration. Move them to content-addressed files so the
      # strict policy still holds without a giant hash list in the header.
      - run: node scripts/externalize-inline-scripts.mjs apps/web/out

      # Same first-load JS budget the PR gate enforces, measured on the exact files being deployed.
      - run: node scripts/check-landing-size.mjs apps/web/out

      # R34: the CSP names the one API origin this build calls instead of
      # trusting every *.run.app service. firebase.json carries a
      # placeholder so a deploy that skips this step fails closed.
      - name: Pin the API origin in the CSP
        working-directory: apps/web
        run: |
          ORIGIN="$(node -e 'console.log(new URL(process.argv[1]).origin)' "$NEXT_PUBLIC_API_URL")"
          case "$ORIGIN" in
            https://api.lifekeel.co.uk|https://api.lifekeel.si) ORIGIN="" ;;
          esac
          if [ -n "$ORIGIN" ]; then
            sed -i "s# __API_ORIGIN__# ${ORIGIN}#g" firebase.json
          else
            sed -i 's# __API_ORIGIN__##g' firebase.json
          fi
          if grep -q '__API_ORIGIN__' firebase.json; then echo "placeholder left in CSP"; exit 1; fi

      - name: Authenticate to Firebase project (workload identity)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        # R31: keyless workload identity federation when the repo Variables
        # GCP_WORKLOAD_IDENTITY_PROVIDER and FIREBASE_DEPLOY_SERVICE_ACCOUNT are set; the long-lived
        # JSON key is only a fallback until they are, then delete the secret.
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Authenticate to Firebase project (service-account key fallback)
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SA_KEY }}
      - name: Warn when deploying with a long-lived key
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        run: echo "::warning::Deploy authenticated with a long-lived service-account key. Configure GCP_WORKLOAD_IDENTITY_PROVIDER and remove the key."

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        working-directory: apps/web
        run: firebase deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
