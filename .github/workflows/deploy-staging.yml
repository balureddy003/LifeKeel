name: Deploy staging

# Deploys the API and the web app to STAGING only. It is separate from the production workflows on
# purpose (docs/runbooks/staging-environment.md):
#  - its own GitHub environment, `staging`, with its own variables and secrets. It never uses the
#    `production` environment or its approval, and never reads a production secret;
#  - the staging service name is fixed in this file, not a variable, so it cannot be pointed at production;
#  - the API step updates the image only (gcloud run deploy --image), so the settings and secrets already on
#    the staging service stay exactly as they are;
#  - the web step publishes one Firebase site, `staging`, built against the staging API, and refuses to build
#    against a production API origin.
# Required environment variables and secrets are listed in the runbook.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (branch, tag, or SHA) to deploy. It must be on main and green in CI.'
        type: string
        required: true
        default: 'main'
      api:
        description: 'Deploy the staging API'
        type: boolean
        required: false
        default: true
      web:
        description: 'Deploy the staging web app'
        type: boolean
        required: false
        default: true

# One staging deploy at a time. Never cancel one mid-flight.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deploys run from main only
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (got $REF). Choose 'Use workflow from: main'; put the commit to deploy in the ref input."
            exit 1
          fi

  verify-ci:
    needs: guard
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/require-ci.yml
    with:
      ref: ${{ github.event.inputs.ref || 'main' }}

  deploy-api:
    if: ${{ github.event.inputs.api != 'false' }}
    needs: verify-ci
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # The commit require-ci.yml verified. Never github.sha, which is the dispatching branch.
      RELEASE_SHA: ${{ needs.verify-ci.outputs.sha }}
      # Fixed. Not a variable and not a secret, so this workflow cannot deploy to the production service.
      STAGING_SERVICE: lifekeel-api-staging
      GCP_PROJECT_ID: ${{ vars.STAGING_GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.STAGING_GCP_REGION || 'us-central1' }}
      REGISTRY_HOST: ${{ vars.STAGING_GCP_REGION || 'us-central1' }}-docker.pkg.dev
      API_IMAGE: ${{ vars.STAGING_GCP_REGION || 'us-central1' }}-docker.pkg.dev/${{ vars.STAGING_GCP_PROJECT_ID }}/lifekeel-docker/api
    steps:
      - name: Check the staging settings are present
        run: |
          if [ -z "$GCP_PROJECT_ID" ]; then
            echo "::error::STAGING_GCP_PROJECT_ID must be set as a variable on the 'staging' environment."
            exit 1
          fi
          case "$STAGING_SERVICE" in
            *-staging) ;;
            *) echo "::error::The service name must end in -staging (got $STAGING_SERVICE)."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}

      - name: Authenticate to Google Cloud (workload identity)
        if: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_GCP_DEPLOY_SERVICE_ACCOUNT }}
      - name: Authenticate to Google Cloud (service-account key fallback)
        if: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.STAGING_GCP_SA_KEY }}
      - name: Warn when deploying with a long-lived key
        if: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        run: echo "::warning::Staging deploy authenticated with a long-lived service-account key. Configure STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER and remove the key."

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGISTRY_HOST }} --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build and push the API image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:staging-${{ env.RELEASE_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record the image digest
        run: echo "IMAGE_REF=${{ env.API_IMAGE }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          version: 'v0.75.0'
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      # Image only. The settings, secrets and scaling on the staging service stay as they are. This is the
      # difference from the production deploy, which sets them on every release.
      - name: Deploy the image to the staging service
        run: |
          set -euo pipefail
          gcloud run deploy "$STAGING_SERVICE" --image "$IMAGE_REF" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --quiet
          # Revisions can be pinned by name. Staging should always serve the newest one.
          gcloud run services update-traffic "$STAGING_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --to-latest --quiet

      - name: Check the new revision is healthy
        run: |
          set -euo pipefail
          URL=$(gcloud run services describe "$STAGING_SERVICE" --region "$GCP_REGION" --project "$GCP_PROJECT_ID" --format='value(status.url)')
          echo "Checking $URL/health/ready"
          STATUS="000"
          BODY=""
          for i in $(seq 1 18); do
            BODY=$(curl -s -w '\n%{http_code}' "$URL/health/ready" || echo -e "\n000")
            STATUS=$(echo "$BODY" | tail -1)
            [ "$STATUS" = "200" ] && break
            echo "Attempt $i: HTTP $STATUS, waiting..."
            sleep 5
          done
          if [ "$STATUS" != "200" ]; then
            echo "$BODY" | head -n -1
            echo "::error::Staging did not become healthy (last status $STATUS) for release $RELEASE_SHA."
            exit 1
          fi
          echo "Staging API is healthy on release $RELEASE_SHA"
          {
            echo "### Staging API deployed"
            echo "- Commit: \`$RELEASE_SHA\`"
            echo "- Image: \`$IMAGE_REF\`"
            echo "- Service: \`$STAGING_SERVICE\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-web:
    if: ${{ github.event.inputs.web != 'false' }}
    needs: verify-ci
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      # The API the staging web app calls. A variable on the 'staging' environment.
      NEXT_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
      FIREBASE_PROJECT_ID: ${{ vars.STAGING_FIREBASE_PROJECT_ID || vars.STAGING_GCP_PROJECT_ID }}
      STAGING_SITE: ${{ vars.STAGING_FIREBASE_SITE || 'lifekeel-staging' }}
    steps:
      - name: Check the API URL is a staging one
        run: |
          if [ -z "${NEXT_PUBLIC_API_URL}" ]; then
            echo "::error::STAGING_API_URL must be set as a variable on the 'staging' environment before deploying."
            exit 1
          fi
          if [ -z "${FIREBASE_PROJECT_ID}" ]; then
            echo "::error::STAGING_FIREBASE_PROJECT_ID (or STAGING_GCP_PROJECT_ID) must be set on the 'staging' environment."
            exit 1
          fi
          ORIGIN="$(node -e 'console.log(new URL(process.argv[1]).host)' "$NEXT_PUBLIC_API_URL")"
          if echo "$ORIGIN" | grep -Eq '(^|\.)lifekeel\.(co\.uk|si)$'; then
            echo "::error::STAGING_API_URL points at a production host ($ORIGIN). Staging must never be built against production."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify-ci.outputs.sha }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lifekeel/web run build:export
        env:
          NEXT_PUBLIC_API_URL: ${{ env.NEXT_PUBLIC_API_URL }}
          # The staging site has no /api rewrite to the API, so the app calls the staging API directly.
          NEXT_PUBLIC_SAME_ORIGIN_API: ''
          NEXT_PUBLIC_SENTRY_DSN: ''
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ''
          NEXT_PUBLIC_KEEL_PANEL: 'on'

      - run: node scripts/externalize-inline-scripts.mjs apps/web/out
      - run: node scripts/check-landing-size.mjs apps/web/out

      # Names the staging API origin in the CSP, as the production deploy does for its own.
      - name: Pin the API origin in the CSP
        working-directory: apps/web
        run: |
          ORIGIN="$(node -e 'console.log(new URL(process.argv[1]).origin)' "$NEXT_PUBLIC_API_URL")"
          sed -i "s# __API_ORIGIN__# ${ORIGIN}#g" firebase.json
          if grep -q '__API_ORIGIN__' firebase.json; then echo "placeholder left in CSP"; exit 1; fi

      - name: Authenticate to Firebase project (workload identity)
        if: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.STAGING_FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Authenticate to Firebase project (service-account key fallback)
        if: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.STAGING_FIREBASE_SA_KEY }}
      - name: Warn when deploying with a long-lived key
        if: ${{ vars.STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER == '' }}
        run: echo "::warning::Staging deploy authenticated with a long-lived service-account key. Configure STAGING_GCP_WORKLOAD_IDENTITY_PROVIDER and remove the key."

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # One site only. The three production sites are not touched.
      - name: Deploy to the staging Firebase site
        working-directory: apps/web
        run: firebase deploy --only hosting:staging --project "$FIREBASE_PROJECT_ID" --non-interactive

      - name: Check the staging site serves this build
        run: |
          set -euo pipefail
          URL="https://${STAGING_SITE}.web.app/"
          for i in $(seq 1 12); do
            if curl -fsS "$URL" -o "$RUNNER_TEMP/index.html"; then break; fi
            echo "Attempt $i: not ready, waiting..."; sleep 5
          done
          grep -q "LifeKeel" "$RUNNER_TEMP/index.html" || { echo "::error::$URL did not serve LifeKeel."; exit 1; }
          CSP=$(curl -sI "$URL" | tr -d '\r' | grep -i '^content-security-policy' || true)
          ORIGIN="$(node -e 'console.log(new URL(process.argv[1]).origin)' "$NEXT_PUBLIC_API_URL")"
          echo "$CSP" | grep -q "$ORIGIN" || { echo "::error::The staging site's CSP does not name the staging API ($ORIGIN)."; exit 1; }
          echo "### Staging web deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Site: $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "- API: $ORIGIN" >> "$GITHUB_STEP_SUMMARY"
