<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96">
  <!--
    Horizontal lockup. Wordmark is a live <text> element in Fraunces —
    portable in a browser, but convert to outline paths in a design tool
    before this goes anywhere the font can't be guaranteed to load (print,
    a store listing, an environment without internet access to Google Fonts).
    The icon itself is pure geometry and has no such dependency.
  -->
  <defs>
    <linearGradient id="mark-bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b3b5c"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="21" fill="url(#mark-bg)"/>
  <g stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- mast + sail -->
    <path d="M48 13 L48 29" opacity="0.85"/>
    <path d="M48 15 L62 29 L48 29 Z" fill="#ffffff" stroke="none" opacity="0.95"/>
    <!-- waterline -->
    <path d="M10 37 Q18 33 26 37 T42 37 T58 37 T74 37 T86 37" fill="none" opacity="0.55" stroke-width="2.5"/>
    <!-- hull -->
    <path d="M24 46 Q48 68 72 46" fill="none" opacity="0.95"/>
    <!-- keel fin -->
    <path d="M48 58 L48 75" opacity="0.9"/>
    <!-- keel bulb -->
    <rect x="40" y="74" width="16" height="6.5" rx="3.25" fill="#ffffff" stroke="none"/>
  </g>
  <text x="118" y="63" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="42" letter-spacing="-0.4" fill="#16151a">LifeKeel</text>
</svg>
