<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" width="360" height="96">
  <!--
    Horizontal lockup. Wordmark is a live <text> element in Fraunces —
    portable in a browser, but convert to outline paths in a design tool
    before this goes anywhere the font can't be guaranteed to load (print,
    a store listing, an environment without internet access to Google Fonts).
    The icon itself is pure geometry and has no such dependency.
  -->
  <defs>
    <linearGradient id="mark-bg" x1="0" y1="0" x2="96" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b80f8"/>
      <stop offset="1" stop-color="#6b5ce0"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="21" fill="url(#mark-bg)"/>
  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round">
    <path d="M48 17 L17 48 L48 79 L79 48 Z" fill="none" opacity="0.95"/>
    <path d="M48 17 L48 79" opacity="0.65"/>
    <path d="M17 48 L79 48" opacity="0.65"/>
  </g>
  <circle cx="48" cy="17" r="4" fill="#ffffff"/>
  <circle cx="17" cy="48" r="4" fill="#ffffff"/>
  <circle cx="79" cy="48" r="4" fill="#ffffff"/>
  <circle cx="48" cy="79" r="4" fill="#ffffff"/>
  <circle cx="48" cy="48" r="5.5" fill="#ffffff"/>
  <text x="118" y="63" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="42" letter-spacing="-0.4" fill="#16151a">Trellis</text>
</svg>
