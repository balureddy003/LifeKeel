<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
  <!-- Stacked lockup — square contexts: social avatars, splash screens, deck title slides. Same font-portability note as logo-horizontal.svg. -->
  <defs>
    <linearGradient id="mark-bg-v" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b80f8"/>
      <stop offset="1" stop-color="#6b5ce0"/>
    </linearGradient>
  </defs>
  <g transform="translate(40, 0)">
    <rect width="120" height="120" rx="26" fill="url(#mark-bg-v)"/>
    <g stroke="#ffffff" stroke-width="5.5" stroke-linecap="round">
      <path d="M60 21 L21 60 L60 99 L99 60 Z" fill="none" opacity="0.95"/>
      <path d="M60 21 L60 99" opacity="0.65"/>
      <path d="M21 60 L99 60" opacity="0.65"/>
    </g>
    <circle cx="60" cy="21" r="5" fill="#ffffff"/>
    <circle cx="21" cy="60" r="5" fill="#ffffff"/>
    <circle cx="99" cy="60" r="5" fill="#ffffff"/>
    <circle cx="60" cy="99" r="5" fill="#ffffff"/>
    <circle cx="60" cy="60" r="7" fill="#ffffff"/>
  </g>
  <text x="100" y="158" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="30" letter-spacing="-0.3" fill="#16151a">Trellis</text>
</svg>
