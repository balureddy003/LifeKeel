<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeKeel</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
    background: #FDFCF9; color: #21332C;
    font: 17px/1.5 -apple-system, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { body { background: #17211D; color: #E8EFEA; } }
  main { max-width: 22rem; }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1.5rem; opacity: .8; }
  button {
    min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px;
    background: #0F6B8A; color: #fff; font: inherit; font-weight: 600;
  }
</style>
</head>
<body>
<main>
  <h1>No connection</h1>
  <p>LifeKeel needs the internet to open. What you have saved is safe. Check your connection and try again.</p>
  <button id="retry" type="button">Try again</button>
</main>
<script>
  document.getElementById('retry').addEventListener('click', function () {
    window.location.replace('__WEB_URL__');
  });
  window.addEventListener('online', function () { window.location.replace('__WEB_URL__'); });
</script>
</body>
</html>
