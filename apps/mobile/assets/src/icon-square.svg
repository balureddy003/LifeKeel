<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Opaque square variant of apps/web/public/icon.svg — Apple applies the
       squircle mask itself, so store icons must be full-bleed and opaque. -->
