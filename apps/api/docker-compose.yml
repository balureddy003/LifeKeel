version: "3.9"
services:
  api:
    build:
      context: ../..
      dockerfile: ./apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/lifekeel
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=change-me-in-production
      - PORT=3001
    depends_on:
      - mongodb
      - redis
    volumes:
      - ../../detectors:/app/detectors:ro
      - ../../connectors:/app/connectors:ro

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:
