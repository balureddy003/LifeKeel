# STATUS: planned — Slack has a public Web API behind bot tokens, but live
# ingestion is not wired. This definition fixes the connector contract so
# verticals that notify channels (branding-marketing, smb-operations,
# trading-investment) reference a real id; wiring is tracked separately.
id: slack
name: Slack
provider: slack
version: 0.1.0
status: planned
description: Slack — send messages to channels and receive webhook events
category: generic
base_url: https://slack.com/api

auth:
  type: bot_token
  notes: Bot User OAuth token (xoxb-) sent as a Bearer header.

resources:
  - name: post_message
    path: /chat.postMessage
    method: POST
    description: Post a message to a channel
  - name: channels
    path: /conversations.list
    method: GET
    description: List public channels

signal_types:
  - message.posted
  - message.received
  - channel.joined
  - channel.left
