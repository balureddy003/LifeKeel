# STATUS: planned — Trading 212 Public API is in beta and currently executes
# in the account's primary currency. The `resources:` below (used by the
# read-only sync/polling pipeline) stay GET-only by design — polling a write
# endpoint would resubmit an order on every sync cycle. Real order placement
# is a *write action*, not a sync resource, and lives in
# packages/workflows/src/connectors/ConnectorRegistry.ts's `trading-212`
# entry (`place_market_order`, `get_order`, `cancel_order`), executed via
# ConnectorActionExecutor — the same generic runtime every other
# write-capable connector (Slack, LinkedIn, ...) uses. That entry documents
# the current enablement decision (personal single-tenant use, explicit
# per-trade approval, opt-in + kill-switch guarded) — this file's `status`
# is now `ga` so the connector sync engine polls portfolio/cash resources.
id: trading-212
name: Trading 212
provider: trading-212
version: 1.0.0
description: Portfolio sync for Trading 212 Invest and Stocks ISA accounts; live order placement is a separate write action (see ConnectorRegistry.ts)
status: ga
category: investment
supported_countries: ['GB']
base_url: https://demo.trading212.com/api/v0
live_base_url: https://live.trading212.com/api/v0

auth:
  type: basic
  notes: |
    HTTP Basic authentication using the API Key as the username and the API
    Secret as the password. Generate both in Trading 212 → Settings → API (Beta).
    For read-only sync, scope the key to Account data and Portfolio only. To
    place real orders (personal-use write action, see ConnectorRegistry.ts),
    the Orders permission must also be enabled on the key — that's a setting
    on the user's own Trading 212 account, done by the user themselves.
    Demo environment is used by default; set extra.live_mode=true on the
    stored credential to switch to live_base_url. Matches
    packages/workflows/src/connectors/ConnectorRegistry.ts.

resources:
  - name: Account
    path: /equity/account/summary
    method: GET
    response_shape: object
    description: Account summary including total value, cash, invested amount, and currency

  - name: Cash
    path: /equity/account/cash
    method: GET
    response_shape: object
    description: Cash balances in the account's primary currency

  - name: Portfolio
    path: /equity/portfolio
    method: GET
    response_shape: list
    description: Open positions and holdings

  - name: Instrument
    path: /equity/metadata/instruments
    method: GET
    response_shape: list
    description: >
      Reference metadata for tradable instruments (ticker, name, asset type,
      currency). The real API has no sector/geography/dividend-yield fields —
      those instrument.metadata properties stay unpopulated until a market-data
      source is added.

  - name: Order
    path: /equity/history/orders
    method: GET
    response_shape: list
    pagination:
      type: link
      response_key: items
    params:
      limit: "50"
    description: >
      Historical orders (buy/sell only — dividend payouts live on a separate
      /equity/history/dividends endpoint, see Dividend resource below).
      Execution price is deliberately left unmapped: the API's
      filledValue/filledQuantity split isn't confirmed to always be per-share,
      and a wrong price on a financial record is worse than a missing one.

  - name: Dividend
    path: /equity/history/dividends
    method: GET
    response_shape: list
    pagination:
      type: link
      response_key: items
    params:
      limit: "50"
    description: >
      Historical dividend payouts. Each record includes the ticker, amount
      paid (in minor units), pay date, and quantity held at ex-dividend date.
      Used to compute portfolio dividend yield and track dividend income
      over time.

signal_types:
  - portfolio_summary
  - portfolio_position
  - order_event
  - instrument_metadata
  - dividend_event

signal_type_map:
  portfolio: portfolio_position
  account: portfolio_summary
  cash: portfolio_summary
  order: order_event
  instrument: instrument_metadata
  dividend: dividend_event

field_mappings:
  # Account summary (/equity/account/summary) fields
  - source_field: totalValue
    target_field: total_value
    transform: to_minor_units
  - source_field: currency
    target_field: currency
  - source_field: investments.totalCost
    target_field: invested_value
    transform: to_minor_units
  # Cash (/equity/account/cash) fields (kept for backward compatibility)
  - source_field: total
    target_field: total_value
    transform: to_minor_units
  - source_field: invested
    target_field: invested_value
    transform: to_minor_units
  - source_field: free
    target_field: cash
    transform: to_minor_units
  - source_field: cash.availableToTrade
    target_field: cash
    transform: to_minor_units
  # Position fields
  - source_field: ticker
    target_field: ticker
  - source_field: quantity
    target_field: quantity
  - source_field: averagePrice
    target_field: avg_price
    transform: to_minor_units
  - source_field: currentPrice
    target_field: current_price
    transform: to_minor_units
  - source_field: ppl
    target_field: unrealised_pnl
    transform: to_minor_units
  - source_field: accountType
    target_field: account_type
  # Instrument fields
  - source_field: name
    target_field: name
  # Deliberately not mapping Instrument's `type` (STOCK/ETF/...) to asset_class:
  # Order records also carry a `type` field (LIMIT/MARKET/STOP/STOP_LIMIT) with
  # a different meaning, and field_mappings apply to every synced row regardless
  # of which resource it came from — mapping `type` here would leak order-style
  # values into instrument asset_class. asset_class stays connector-unmapped
  # until mappings can be scoped per-resource; existing consumers already
  # default it to 'stock'.
  - source_field: side
    target_field: type
    transform: to_lowercase
  - source_field: createdAt
    target_field: timestamp
    transform: iso_date
  # Dividend fields (/equity/history/dividends)
  - source_field: ticker
    target_field: ticker
  - source_field: amount
    target_field: dividend_amount
    transform: to_minor_units
  - source_field: quantity
    target_field: quantity
  - source_field: payDate
    target_field: pay_date
    transform: iso_date
  - source_field: type
    target_field: dividend_type
