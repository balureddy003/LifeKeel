# STATUS: planned — FRED (Federal Reserve Economic Data) macro connector.
# Free API, 120 requests/minute. Provides yield curve spreads, interest
# rates, credit spreads, and recession indicators used by the regime
# detector (Phase 2) for macro-aware strategy switching.
#
# Key series:
#   T10Y2Y  — 10Y-2Y Treasury yield curve spread (inversion = recession risk)
#   DGS10   — 10-Year Treasury yield
#   VIXCLS  — VIX (alternative to CBOE CSV)
#   BAMLH0A0HYM2 — ICE BofA US High Yield credit spread
#
# Register for a free API key at: https://fredaccount.stlouisfed.org/apikeys
id: fred
name: FRED Economic Data
provider: fred
version: 1.0.0
description: "Federal Reserve Economic Data. Free API (120 req/min). Yield curve spreads, interest rates, credit spreads for regime detection."
status: planned
category: investment
base_url: https://api.stlouisfed.org/fred

auth:
  type: api_key
  param: api_key
  notes: |
    Free API key required. Register at:
    https://fredaccount.stlouisfed.org/apikeys
    Free tier allows 120 requests/minute.

resources:
  - name: YieldCurveSpread
    path: /series/observations?series_id=T10Y2Y&file_type=json&limit=1&sort_order=desc
    method: GET
    response_shape: object
    record_transform: fred_yield_curve
    cadence: daily
    description: 10Y-2Y Treasury yield curve spread. Negative = inverted (recession signal).
  - name: CreditSpread
    path: /series/observations?series_id=BAMLH0A0HYM2&file_type=json&limit=1&sort_order=desc
    method: GET
    response_shape: object
    record_transform: fred_credit_spread
    cadence: daily
    description: ICE BofA US High Yield credit spread. >5% = credit stress.
  - name: Treasury10Y
    path: /series/observations?series_id=DGS10&file_type=json&limit=1&sort_order=desc
    method: GET
    response_shape: object
    record_transform: fred_treasury_10y
    cadence: daily
    description: 10-Year Treasury constant maturity yield.

signal_types:
  - yield_curve_spread
  - credit_spread
  - treasury_yield

signal_type_map:
  yieldcurvespread: yield_curve_spread
  creditspread: credit_spread
  treasury10y: treasury_yield
