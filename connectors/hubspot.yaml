# STATUS: planned — HubSpot has a public REST API behind OAuth2, but live
# ingestion is not wired. This definition fixes the connector contract so
# verticals that manage CRM contacts (branding-marketing lead nurture,
# smb-operations) reference a real id; wiring OAuth + sync is tracked
# separately. Same posture as rightmove/zoopla: contract complete, feed not.
id: hubspot
name: HubSpot
provider: hubspot
version: 0.1.0
status: planned
description: HubSpot CRM — contacts, companies, deals, activity logging
category: crm
base_url: https://api.hubapi.com

auth:
  type: oauth2
  oauth:
    authorization_url: https://app.hubspot.com/oauth/authorize
    token_url: https://api.hubapi.com/oauth/v1/token
    scopes:
      - contacts
      - timeline

resources:
  - name: contacts
    path: /crm/v3/objects/contacts
    method: GET
    description: List and create contacts
  - name: contact
    path: /crm/v3/objects/contacts/{contactId}
    method: POST
    description: Update a contact
  - name: engagements
    path: /crm/v3/objects/notes
    method: POST
    description: Log an activity/engagement on a contact

signal_types:
  - crm.contact.created
  - crm.contact.updated
  - crm.activity.logged
  - crm.deal.stage_changed
