id: postiz-library
name: Postiz Library (Open Source)
provider: postiz-oss
version: 1.0.0
description: Social media management using Postiz open source library - direct platform integration
category: social_media
base_url: https://api.github.com/repos/gitroomhq/postiz-agent

auth:
  type: multi_oauth
  platforms:
    twitter:
      type: oauth2
      authorization_url: https://twitter.com/i/oauth2/authorize
      token_url: https://api.twitter.com/2/oauth2/token
      scopes:
        - tweet.read
        - tweet.write
        - users.read
    linkedin:
      type: oauth2
      authorization_url: https://www.linkedin.com/oauth/v2/authorization
      token_url: https://www.linkedin.com/oauth/v2/accessToken
      scopes:
        - r_liteprofile
        - r_emailaddress
        - w_member_social
    facebook:
      type: oauth2
      authorization_url: https://www.facebook.com/v18.0/dialog/oauth
      token_url: https://graph.facebook.com/v18.0/oauth/access_token
      scopes:
        - pages_read_engagement
        - pages_manage_posts
        - pages_manage_metadata
    instagram:
      type: oauth2
      authorization_url: https://api.instagram.com/oauth/authorize
      token_url: https://api.instagram.com/oauth/access_token
      scopes:
        - instagram_basic
        - instagram_content_publish
        - instagram_manage_comments
    tiktok:
      type: oauth2
      authorization_url: https://open-api.tiktok.com/platform/oauth2/v1/authorize
      token_url: https://open-api.tiktok.com/platform/oauth2/v1/token
      scopes:
        - video.upload
        - video.publish
    youtube:
      type: oauth2
      authorization_url: https://accounts.google.com/o/oauth2/v2/auth
      token_url: https://oauth2.googleapis.com/token
      scopes:
        - https://www.googleapis.com/auth/youtube.upload
        - https://www.googleapis.com/auth/youtube
    pinterest:
      type: oauth2
      authorization_url: https://www.pinterest.com/oauth
      token_url: https://api.pinterest.com/v1/oauth/token
      scopes:
        - boards:read
        - boards:write
        - pins:read
        - pins:write
    reddit:
      type: oauth2
      authorization_url: https://www.reddit.com/api/v1/authorize
      token_url: https://www.reddit.com/api/v1/access_token
      scopes:
        - read
        - submit
        - identity
    telegram:
      type: bot_token
      setup_url: https://t.me/botfather

library:
  name: postiz-agent
  repository: https://github.com/gitroomhq/postiz-agent
  installation_method: npm
  package: postiz-agent
  cli_command: postiz

resources:
  - name: integrations
    path: local
    method: CLI
    description: List connected social media accounts via Postiz CLI
  - name: posts
    path: local
    method: CLI
    description: Create and manage posts via Postiz CLI
  - name: media
    path: local
    method: CLI
    description: Upload media via Postiz CLI

signal_types:
  - post.published
  - post.scheduled
  - post.failed
  - post.deleted
  - comment.added
  - engagement.received
  - follower.gained
  - account.connected
  - account.disconnected

signal_type_map:
  "post.published": "post.published"
  "post.scheduled": "post.scheduled"
  "post.failed": "post.failed"
  "post.deleted": "post.deleted"
  "comment.added": "comment.added"
  "engagement.like": "engagement.received"
  "engagement.share": "engagement.received"
  "engagement.comment": "engagement.received"
  "follower.new": "follower.gained"
  "integration.connected": "account.connected"
  "integration.disconnected": "account.disconnected"

field_mappings:
  - source_field: id
    target_field: post_id
  - source_field: content
    target_field: content
  - source_field: platforms
    target_field: platforms
  - source_field: media
    target_field: media_urls
  - source_field: scheduledDate
    target_field: scheduled_at
    transform: iso_date
  - source_field: createdAt
    target_field: created_at
    transform: iso_date
  - source_field: status
    target_field: status

supported_platforms:
  - twitter
  - linkedin
  - facebook
  - instagram
  - tiktok
  - youtube
  - pinterest
  - reddit
  - telegram

platform_specific_fields:
  twitter:
    - thread
    - poll
    - location
  linkedin:
    - document
    - article
  facebook:
    - album
    - event
  instagram:
    - story
    - reel
    - carousel
  tiktok:
    - sound
    - effect
    - duet
  youtube:
    - short
    - premiere
    - live

cli_commands:
  list_integrations: "postiz integrations:list"
  create_post: "postiz posts:create"
  list_posts: "postiz posts:list"
  upload_media: "postiz media:upload"