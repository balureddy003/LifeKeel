# STATUS: planned — CBOE VIX volatility index connector.
# Free CSV download, no API key required. The VIX (Volatility Index)
# measures the market's expectation of 30-day forward-looking volatility
# and is the primary fear gauge used by the regime detector (Phase 2).
#
# Data source: https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv
# This is the official CBOE-published daily VIX history (1990-present).
# No rate limit — it's a static file download.
id: cboe-vix
name: CBOE VIX Index
provider: cboe
version: 1.0.0
description: "CBOE Volatility Index (VIX) daily history. Free CSV download, no API key. Used by the regime detector for market fear/crisis classification."
status: planned
category: investment
base_url: https://cdn.cboe.com/api/global/us_indices/daily_prices

auth:
  type: none
  notes: |
    No authentication required. The VIX history CSV is a public static
    file published by CBOE. Download from:
    https://cdn.cboe.com/api/global/us_indices/daily_prices/VIX_History.csv

resources:
  - name: VIXHistory
    path: /VIX_History.csv
    method: GET
    response_shape: list
    record_transform: cboe_vix_daily
    cadence: daily
    description: "Daily VIX close history (1990-present). CSV format: Date,VIX Open,VIX High,VIX Low,VIX Close."

signal_types:
  - vix_index

signal_type_map:
  vixhistory: vix_index

field_mappings:
  - source_field: VIX Close
    target_field: vix_value
  - source_field: Date
    target_field: date
