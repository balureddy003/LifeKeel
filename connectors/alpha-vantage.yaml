# STATUS: planned — Alpha Vantage market-data connector.
# Provides daily price history for backtesting and detector enrichment.
# Read-only by design; no order placement or account access.
id: alpha-vantage
name: Alpha Vantage
provider: alpha-vantage
version: 1.0.0
description: Read-only daily price history and fundamentals for equities and ETFs
status: planned
category: finance
base_url: https://www.alphavantage.co/query

auth:
  type: api_key
  notes: |
    Free and paid API keys available at alphavantage.co. Supports daily price
    history (TIME_SERIES_DAILY) and company fundamentals (OVERVIEW). The free
    tier is rate-limited to 25 calls per day; batch and cache results
    aggressively in production.

resources:
  - name: DailyTimeSeries
    path: '?function=TIME_SERIES_DAILY&symbol={symbol}&apikey={apikey}&datatype=json'
    method: GET
    response_shape: object
    description: Daily OHLCV time series for a single symbol

  - name: DailyAdjustedTimeSeries
    path: '?function=TIME_SERIES_DAILY_ADJUSTED&symbol={symbol}&apikey={apikey}&datatype=json'
    method: GET
    response_shape: object
    description: Daily adjusted OHLCV plus split/dividend data for a single symbol

  # Gap #6 (TRADING_ENGINE_GAPS.md): company fundamentals from the OVERVIEW
  # endpoint. Returns GrossProfitTTM and TotalRevenueTTM, which feed
  # computeQualityScore(grossProfitability) in the scoring engine — replacing
  # the hardcoded quality = 0.5 placeholder.
  #
  # Fundamentals don't move day-to-day, so this resource is on a quarterly
  # cadence (see connector-sync-engine.ts syncConnector — the resource-level
  # cadence field controls how often it's polled vs. the default 15-minute
  # cycle for price data). Reuses the same symbols_param/per-symbol fan-out
  # pattern as DailyTimeSeries.
  - name: CompanyOverview
    path: '?function=OVERVIEW&symbol={symbol}&apikey={apikey}'
    method: GET
    response_shape: object
    symbols_param: symbol
    record_transform: alpha_vantage_overview
    cadence: quarterly
    description: Company fundamentals (gross profit, revenue, sector) for a single symbol

signal_types:
  - market_price
  - company_fundamentals

# Gap #6: map the CompanyOverview resource name to the company_fundamentals
# signal type. The event generator uses signal_type_map[source_event_type]
# where source_event_type = resource.name.toLowerCase() = 'companyoverview'.
signal_type_map:
  companyoverview: company_fundamentals
  dailytimeseries: market_price

