# STATUS: planned — HF Data Library market-data connector.
# Free, research-grade 1-minute OHLCV bars for 1,391 US stocks and ETFs from
# December 2002 to present. CC BY 4.0 license. Clean REST API with a free
# API key (renews every 30 days). Daily bars are aggregated from intraday
# data and split-adjusted.
#
# Ideal for backtesting across multiple market regimes (2008 crash, 2020
# COVID, 2022 bear, 2023-24 bull) — 20+ years of clean daily history with
# no rate-limit headaches (100 downloads/minute).
id: hf-data
name: HF Data Library
provider: hf-data
version: 1.0.0
description: Free 1-minute OHLCV bars for 1,391 US stocks since 2002. CC BY 4.0. Research-grade daily history for backtesting.
status: planned
category: investment
base_url: https://api.hfdatalibrary.com/v1

auth:
  type: api_key
  header: X-API-Key
  notes: |
    Free API key required. Register at hfdatalibrary.com with name,
    institution, and email. Keys expire every 30 days (re-register to
    renew). Rate limit: 100 downloads per minute per key. CC BY 4.0
    license — attribute the HF Data Library in any derived output.

resources:
  - name: DailyBars
    path: /bars/{symbol}/daily
    method: GET
    response_shape: list
    record_transform: hf_data_daily_bars
    symbols_param: symbol
    date_filter_param: start
    description: Daily OHLCV bars (aggregated from 1-minute data) for a single ticker

signal_types:
  - market_price

signal_type_map:
  dailybars: market_price
