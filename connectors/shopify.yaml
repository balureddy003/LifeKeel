id: shopify
name: Shopify
provider: shopify
version: 1.0.0
description: E-commerce — orders, products, customers, inventory, abandoned carts
category: ecommerce
base_url: https://{shop}.myshopify.com/admin/api/2024-01

auth:
  type: oauth2
  oauth:
    authorization_url: https://{shop}.myshopify.com/admin/oauth/authorize
    token_url: https://{shop}.myshopify.com/admin/oauth/access_token
    scopes:
      - read_orders
      - read_customers
      - read_products
      - read_inventory
      - read_checkouts

resources:
  - name: orders
    path: /orders.json
    params:
      status: any
    pagination:
      type: link
  - name: customers
    path: /customers.json
    pagination:
      type: link
  - name: checkouts
    path: /checkouts.json
    pagination:
      type: link

webhooks:
  path: /webhooks/shopify
  signature_header: x-shopify-hmac-sha256
  signature_algorithm: hmac-sha256
  event_type_field: topic

signal_types:
  - order.placed
  - order.refunded
  - order.cancelled
  - cart.abandoned
  - customer.created
  - product.updated
  - inventory.low

signal_type_map:
  "orders/create": "order.placed"
  "orders/cancelled": "order.cancelled"
  "refunds/create": "order.refunded"
  "checkouts/create": "cart.abandoned"
  "customers/create": "customer.created"
  "products/update": "product.updated"
  "inventory_levels/update": "inventory.low"

field_mappings:
  - source_field: total_price
    target_field: amount_minor
    transform: to_minor_units
  - source_field: currency
    target_field: currency
  - source_field: customer.id
    target_field: customer_id
  - source_field: created_at
    target_field: event_timestamp
    transform: iso_date
