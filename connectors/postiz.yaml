id: postiz
name: Postiz
provider: postiz
version: 1.0.0
description: Social media management - posts to Twitter, LinkedIn, Facebook, Instagram, TikTok, and more
category: social_media
base_url: https://api.postiz.com

auth:
  type: api_key
  header: x-api-key
  param: POSTIZ_API_KEY

resources:
  - name: integrations
    path: /integrations
    method: GET
    description: List all connected social media accounts
  - name: posts
    path: /posts
    method: GET
    description: List all posts
  - name: post
    path: /posts/{id}
    method: GET
    description: Get specific post details
  - name: create_post
    path: /posts
    method: POST
    description: Create new post
  - name: media
    path: /media
    method: POST
    description: Upload media

webhooks:
  path: /webhooks/postiz
  signature_header: x-postiz-signature
  signature_algorithm: hmac-sha256
  event_type_field: event

signal_types:
  - post.published
  - post.scheduled
  - post.failed
  - post.deleted
  - comment.added
  - engagement.received
  - follower.gained
  - account.connected
  - account.disconnected

signal_type_map:
  "post.published": "post.published"
  "post.scheduled": "post.scheduled"
  "post.failed": "post.failed"
  "post.deleted": "post.deleted"
  "comment.added": "comment.added"
  "engagement.like": "engagement.received"
  "engagement.share": "engagement.received"
  "engagement.comment": "engagement.received"
  "follower.new": "follower.gained"
  "integration.connected": "account.connected"
  "integration.disconnected": "account.disconnected"

field_mappings:
  - source_field: id
    target_field: post_id
  - source_field: content
    target_field: content
  - source_field: platforms
    target_field: platforms
  - source_field: media
    target_field: media_urls
  - source_field: scheduledDate
    target_field: scheduled_at
    transform: iso_date
  - source_field: createdAt
    target_field: created_at
    transform: iso_date
  - source_field: status
    target_field: status

supported_platforms:
  - twitter
  - linkedin
  - facebook
  - instagram
  - tiktok
  - youtube
  - pinterest
  - reddit
  - telegram

platform_specific_fields:
  twitter:
    - thread
    - poll
    - location
  linkedin:
    - document
    - article
  facebook:
    - album
    - event
  instagram:
    - story
    - reel
    - carousel
  tiktok:
    - sound
    - effect
    - duet
  youtube:
    - short
    - premiere
    - live