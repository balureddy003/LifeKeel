id: xero
name: Xero
provider: xero
version: 1.0.0
description: Accounting — invoices, payments, bank transactions, contacts
category: accounting
base_url: https://api.xero.com/api.xro/2.0

auth:
  type: oauth2
  oauth:
    authorization_url: https://login.xero.com/identity/connect/authorize
    token_url: https://identity.xero.com/connect/token
    scopes:
      - accounting.transactions
      - accounting.contacts
      - accounting.reports.read

resources:
  - name: Invoices
    path: /Invoices
    params:
      Statuses: AUTHORISED,SUBMITTED,OVERDUE
    pagination:
      type: page
      param: page
      response_key: Invoices
    date_filter_param: DateFrom        # enables incremental sync: ?DateFrom=2024-01-01
    page_size: 100
  - name: Payments
    path: /Payments
    pagination:
      type: page
      param: page
      response_key: Payments
    date_filter_param: DateFrom
    page_size: 100
  - name: BankTransactions
    path: /BankTransactions
    pagination:
      type: page
      param: page
      response_key: BankTransactions
    date_filter_param: DateFrom
    page_size: 100
  - name: CreditNotes
    path: /CreditNotes
    pagination:
      type: page
      param: page
      response_key: CreditNotes
    date_filter_param: DateFrom
    page_size: 100

webhooks:
  path: /webhooks/xero
  signature_header: x-xero-signature
  signature_algorithm: hmac-sha256
  event_type_field: events.0.eventType

signal_types:
  - invoice.created
  - invoice.overdue
  - payment.received
  - bank.transaction
  - credit_note.issued

signal_type_map:
  "CREATE": "invoice.created"
  "UPDATE": "invoice.updated"
  "INVOICES": "invoice.created"
  "PAYMENTS": "payment.received"
  "BANKTRANSACTIONS": "bank.transaction"
  "CREDITNOTES": "credit_note.issued"

field_mappings:
  - source_field: Total
    target_field: amount_minor
    transform: to_minor_units
  - source_field: CurrencyCode
    target_field: currency
  - source_field: InvoiceID
    target_field: invoice_id
  - source_field: ContactID
    target_field: customer_id
  - source_field: DueDateString
    target_field: due_date
    transform: iso_date
