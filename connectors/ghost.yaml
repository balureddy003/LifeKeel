# STATUS: planned — Ghost has a public Admin REST API behind API-key (JWT)
# auth, but live ingestion is not wired. This definition fixes the connector
# contract so the branding-marketing vertical's daily social presence workflow
# (which queues a blog draft) references a real id; wiring is tracked
# separately.
id: ghost
name: Ghost
provider: ghost
version: 0.1.0
status: planned
description: Ghost CMS — create and publish blog posts and pages
category: marketing
base_url: https://{blog}/ghost/api/admin

auth:
  type: api_key
  header: Authorization
  notes: Admin API key signed into a short-lived JWT sent as Bearer.

resources:
  - name: posts
    path: /posts/
    method: POST
    description: Create a draft or published post
  - name: post
    path: /posts/{id}/
    method: POST
    description: Update a post

signal_types:
  - post.published
  - post.updated
  - post.drafted
