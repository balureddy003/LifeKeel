# STATUS: planned — LinkedIn has a public REST API behind OAuth2, but live
# ingestion is not wired. This definition fixes the connector contract so the
# branding-marketing vertical's daily social presence workflow references a
# real id; wiring OAuth + post is tracked separately.
id: linkedin
name: LinkedIn
provider: linkedin
version: 0.1.0
status: planned
description: LinkedIn — post on behalf of a person or organization, read engagement
category: social_media
base_url: https://api.linkedin.com/v2

auth:
  type: oauth2
  oauth:
    authorization_url: https://www.linkedin.com/oauth/v2/authorization
    token_url: https://www.linkedin.com/oauth/v2/accessToken
    scopes:
      - w_member_social
      - r_organization_social
      - w_organization_social

resources:
  - name: posts
    path: /ugcPosts
    method: POST
    description: Create a post on behalf of a person or organization
  - name: author_urn
    path: /me
    method: GET
    description: Resolve the authenticated member's URN

signal_types:
  - post.published
  - post.engagement
  - follower.changed
